<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wada Sanzo | A Dictionary of Color Combinations</title>
  <!-- The book's cover in its colours: as SVG, else as PNG (sizes keeps browsers on the SVG). -->
  <link rel="icon" href="favicon.png" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      --bg: #fafaf7;
      --fg: #1d1d1b;
      --muted: #6e6e68;
      --line: #e3e3dd;
      --info: 26ch; /* widest info line: OKLCH 0.5579 0.1582 357.38 */
    }
    /* DM Mono (SIL Open Font License, fonts/OFL.txt), from github.com/google/fonts/tree/main/ofl/dmmono.
       It has no bold: Medium (500) is the heaviest weight. */
    @font-face { font-family: "DM Mono"; src: url("fonts/DMMono-Regular.ttf") format("truetype"); font-weight: 400; }
    @font-face { font-family: "DM Mono"; src: url("fonts/DMMono-Medium.ttf") format("truetype"); font-weight: 500; }
    * { box-sizing: border-box; margin: 0; }
    [hidden] { display: none !important; }
    body { font-family: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--bg); color: var(--fg); }

    /* Header: the main navigation, plus a sub-navigation row with the current view's options. */
    header {
      position: sticky; top: 0; z-index: 3;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    nav {
      display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
      padding: 1rem 1.5rem;
    }
    nav strong { font-weight: 500; }
    nav span { color: var(--muted); }
    .views, .subnav { display: flex; gap: 1rem; }
    .views, .subnav { flex-wrap: wrap; row-gap: 0.25rem; } /* narrow screens: on two lines */
    .subnav { justify-content: flex-end; padding: 0 1.5rem 1rem; font-size: 0.875rem; }
    .views a, .subnav :is(button, a, span) { color: var(--muted); text-decoration: none; }
    .subnav button { font: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    .views a[aria-current], .subnav button[aria-pressed="true"], .subnav [aria-current] {
      color: var(--fg); text-decoration: underline; text-underline-offset: 0.25em;
    }
    .subnav a:hover, .subnav a:focus-visible { color: var(--fg); }
    /* A combination's pages: previous and next on the left, its tabs on the right; a tab with nothing
       in it is greyed out. */
    .combo-subnav { justify-content: space-between; }
    .combo-subnav > div { display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; }
    .combo-subnav [aria-disabled="true"] { opacity: 0.45; }

    main { padding: 1.5rem; }
    #colors-view { display: grid; gap: 2rem; }
    /* Its layouts (the sub-navigation): the families as grids or rows, or the wheel. */
    #colors-view[data-show="wheel"] > section, #colors-view:not([data-show="wheel"]) > .wheel-box { display: none; }
    /* A group's name above it: the book's colour families, the months of the seasonal combinations. */
    .group-heading { margin-bottom: 1rem; font-size: 0.875rem; font-weight: 500; }
    .group-heading span { margin-left: 1ch; color: var(--muted); font-weight: 400; } /* e.g. its numbers */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr));
      padding: 0;
      list-style: none;
    }
    .swatch {
      display: grid; place-items: center;
      width: 100%; aspect-ratio: 1;
      border: 0;
      background: var(--color);
      color: var(--ink);
      font: inherit; font-size: 0.8rem; font-variant-numeric: tabular-nums;
      cursor: pointer;
    }
    .swatch span {
      opacity: 0; transform: translateY(4px);
      transition: opacity 0.6s ease, transform 0.6s ease; /* fade out */
      white-space: pre; text-align: left; line-height: 1.35;
    }
    .swatch:hover span, .swatch:focus-visible span {
      opacity: 1; transform: none;
      transition-duration: 0.12s; /* fade in */
    }
    .swatch:focus-visible { outline: 2px solid var(--ink); outline-offset: -4px; }

    /* Rows layout: one full-width stripe per colour, edge to edge (cancels main's padding); the only
       space is between families, around their names. */
    #colors-view[data-show="rows"] { margin: -1.5rem; gap: 0; }
    [data-show="rows"] .group-heading { margin: 0; padding: 1.5rem 1.5rem 1rem; }
    [data-show="rows"] .grid { grid-template-columns: 1fr; }
    [data-show="rows"] .swatch { aspect-ratio: auto; height: 3.5rem; place-items: center start; padding: 0 1.5rem; }
    /* Hover text: grid squares show the CMYK values one per line; rows show name, CMYK and OKLCH on
       one line, in columns that line up from row to row (widest name: 23 characters, CMYK: 20). */
    .swatch .in-rows, [data-show="rows"] .swatch .in-grid { display: none; }
    [data-show="rows"] .swatch .in-rows { display: grid; grid-template-columns: 26ch 24ch auto; }

    /* Combinations, laid out as in the book: 2 colours side by side (6:5 each), 3 squares in a row,
       4 colours as a cross of 2:1 rectangles (top, left, right, bottom). The colours touch. */
    #combinations-view { display: grid; gap: 4rem; }
    .combos {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: 2rem 1.5rem;
      padding: 0; list-style: none;
    }
    .combo-number {
      display: inline-block; margin-bottom: 0.5rem;
      color: var(--muted); font-size: 0.8rem; text-decoration: none;
    }
    a.combo-number:hover, a.combo-number:focus-visible { color: var(--fg); text-decoration: underline; }
    .blocks { display: grid; grid-template-rows: minmax(0, 1fr); } /* rows never grow to fit a colour's name */
    .blocks[data-size="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); aspect-ratio: 12 / 5; }
    .blocks[data-size="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); aspect-ratio: 3 / 1; }
    .blocks[data-size="4"] {
      grid-template: ". top top ." auto "left left right right" auto ". bottom bottom ." auto
        / minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); /* columns never grow to fit a long name */
    }
    /* Each of a cross's colours is 2 columns by 1 row: on a whole number of pixels when the cross is as
       wide as a multiple of 4px, else they would be painted a pixel apart. */
    .blocks[data-size="4"] { grid-template-rows: repeat(3, minmax(0, 1fr)); aspect-ratio: 4 / 3; width: round(down, 100%, 4px); }
    .blocks[data-size="4"] > :nth-child(1) { grid-area: top; }
    .blocks[data-size="4"] > :nth-child(2) { grid-area: left; }
    .blocks[data-size="4"] > :nth-child(3) { grid-area: right; }
    .blocks[data-size="4"] > :nth-child(4) { grid-area: bottom; }
    .blocks > * { background: var(--color); }
    .blocks .swatch { aspect-ratio: auto; height: 100%; padding: 0.5rem; }
    .blocks .swatch span { white-space: normal; text-align: center; } /* the colour name */
    /* Sub-navigation choice: only the combinations with that many colours. */
    #combinations-view[data-show="2"] > :not([data-size="2"]),
    #combinations-view[data-show="3"] > :not([data-size="3"]),
    #combinations-view[data-show="4"] > :not([data-size="4"]) { display: none; }
    /* ... and only that month's seasonal combinations. */
    #seasons-view[data-show="1"] > :not([data-month="1"]), #seasons-view[data-show="2"] > :not([data-month="2"]),
    #seasons-view[data-show="3"] > :not([data-month="3"]), #seasons-view[data-show="4"] > :not([data-month="4"]),
    #seasons-view[data-show="5"] > :not([data-month="5"]), #seasons-view[data-show="6"] > :not([data-month="6"]),
    #seasons-view[data-show="7"] > :not([data-month="7"]), #seasons-view[data-show="8"] > :not([data-month="8"]),
    #seasons-view[data-show="9"] > :not([data-month="9"]), #seasons-view[data-show="10"] > :not([data-month="10"]),
    #seasons-view[data-show="11"] > :not([data-month="11"]), #seasons-view[data-show="12"] > :not([data-month="12"]) { display: none; }

    /* Seasonal combinations (Volume 2), as in the book: 3 to 7 colours stacked top to bottom, equal. */
    .blocks.stack { grid-template-rows: repeat(var(--n), minmax(0, 1fr)); grid-template-columns: minmax(0, 1fr); aspect-ratio: 3 / 4; }
    /* A band can be thin (7 colours in a narrow column): there its name is set smaller and tighter, so
       two lines still fit inside it (each band measures its own height). */
    .blocks.stack .swatch { container-type: size; padding-block: 0; } /* measured: the band's height */
    @container (height < 2.25rem) { .blocks.stack .swatch span { font-size: 0.7rem; line-height: 1.15; } }
    @container (height < 1.625rem) { .blocks.stack .swatch span { font-size: 0.625rem; line-height: 1.05; } }
    #seasons-view { display: grid; gap: 4rem; }
    .combos.seasons { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (min-width: 40rem) { .combos.seasons { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (min-width: 64rem) { .combos.seasons { grid-template-columns: repeat(6, minmax(0, 1fr)); } }

    /* One combination, on its own: the colours large, centred with its number above their top-left
       corner, and each colour's values under them (see .combo-info). Its other pages (the combinations
       that share a colour with it, and the wheel) start with its number and its colours, small. */
    :is(#combination-view, #season-view) { display: grid; gap: 2.5rem; }
    :is(#combination-view, #season-view) > .combo-figure { justify-self: center; }
    .combo-figure > .combo-number { display: block; grid-column: 1 / -1; margin-bottom: 1rem; }
    /* A combination's own page (Volume 1's), as in the book: a vertical line left of its colours, its
       number at the line's top left, in the margin (the colours stay centred). The number is as high
       as a heading over the colours would be, and the line goes as far under them; what follows starts
       below its end. Where the margin is too narrow for them, the colours are narrower, as much on both
       sides (with the values under each of 2 or 3 colours; on phones, the values one under another keep
       the page's width). */
    #combination-view .plate { --over: 2rem; position: relative; margin-block: var(--over) calc(var(--over) + 0.75rem); }
    #combination-view .plate ~ .combo-info, #combination-view .plate ~ .combo-values > .combo-info { margin-top: 0; }
    #combination-view .plate > .combo-number {
      position: absolute; top: calc(-1 * var(--over)); bottom: calc(-1 * var(--over)); right: calc(100% + 1rem);
      margin: 0; padding-right: 0.75rem; border-right: 1px solid var(--muted); line-height: 1rem;
    }
    @media (40rem <= width < 58rem) { #combination-view > .combo-figure:not(:has(> .combo-values)) { padding-inline: 3.5rem; } }
    @media (width < 40rem) { #combination-view > .combo-figure > .plate { margin-inline: 3.5rem; } }
    @media (width < 46rem) { #combination-view > .combo-figure:has(> .combo-values) > .plate { margin-inline: 3.5rem; } }
    .combo-ref { display: grid; justify-items: start; align-content: start; }
    .combo-ref > .blocks { width: 12rem; }
    .combo-ref > .blocks[data-size="4"] { width: 9rem; }
    .combo-ref > .blocks.stack { width: 8rem; }
    .related { display: grid; gap: 2.5rem; } /* the related combinations of one kind, in groups */
    /* In a related combination, a dot next to each colour it shares with this one, outside the colours
       (on the page, so it adds no colour to them): under it in a row of 2 or 3; in a cross, above the
       top, under the bottom, left of the left and right of the right; left of a stacked band. */
    .swatch.shared { position: relative; overflow: visible; }
    .swatch.shared::after {
      content: ""; position: absolute; top: calc(100% + 0.25rem); left: calc(50% - 0.1875rem);
      width: 0.375rem; height: 0.375rem; border-radius: 50%; background: var(--fg);
    }
    .blocks[data-size="4"] > .shared:nth-child(1)::after { top: auto; bottom: calc(100% + 0.25rem); }
    .blocks[data-size="4"] > .shared:is(:nth-child(2), :nth-child(3))::after { top: calc(50% - 0.1875rem); }
    .blocks[data-size="4"] > .shared:nth-child(2)::after { left: auto; right: calc(100% + 0.25rem); }
    .blocks[data-size="4"] > .shared:nth-child(3)::after { left: calc(100% + 0.25rem); }
    .blocks.stack > .shared::after { top: calc(50% - 0.1875rem); left: auto; right: calc(100% + 0.25rem); }
    /* The wheel page: the wheel beside the combination (the colour under the pointer below it); on
       narrow screens under it, without the colour's info (tapping a colour opens it). */
    [data-tab="wheel"] > .wheel { justify-self: center; }
    [data-tab="wheel"] .wheel-panel { display: none; }
    @media (min-width: 64rem) {
      :is(#combination-view, #season-view)[data-tab="wheel"] { grid-template-columns: 16rem minmax(0, 1fr); align-items: start; }
      [data-tab="wheel"] .wheel-panel { display: block; position: static; transform: none; width: auto; margin-top: 2rem; }
    }
    /* Related seasonal combinations: the months side by side on the Seasons page's columns (6, or 3 and
       2 on narrower screens), each as wide as its combinations (at most a row), with one empty column
       between months on the same row. The script works out each month's first column and width for
       each number of columns (--at-6, --n-6, ...); a month starting further left goes on a new row. */
    .related-months { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 2.5rem 1.5rem; }
    .related-months > div { grid-column: var(--at-6) / span var(--n-6); display: grid; grid-template-columns: subgrid; align-content: start; }
    .related-months > div > * { grid-column: 1 / -1; }
    .related-months .combos { grid-template-columns: subgrid; }
    @media (width < 64rem) {
      .related-months { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .related-months > div { grid-column: var(--at-3) / span var(--n-3); }
    }
    @media (width < 40rem) {
      .related-months { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .related-months > div { grid-column: var(--at-2) / span var(--n-2); }
    }
    .combo-figure { width: min(100%, 48rem); }
    .combo-info { display: grid; gap: 1.25rem 1rem; margin-top: 1.25rem; font-size: 0.875rem; line-height: 1.5; }
    /* 2 and 3 colours: each colour's values under it, starting at its left edge; once 3 no longer fit
       side by side, one under another (each name is followed by its colour). */
    .combo-info[data-size="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 0; }
    .combo-info[data-size="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 0; }
    @media (width < 51rem) { .combo-info[data-size="3"] { grid-template-columns: minmax(0, 1fr); } }
    .combo-info p { white-space: nowrap; font-variant-numeric: tabular-nums; }
    /* A cross (4 colours) or a seasonal combination's stack: the colours in the middle, their values in
       rows under them, centred on the page and as wide as they need: up to 4 side by side (more in
       balanced rows: 3 + 2, 3 + 3, 4 + 3), 2 on narrower screens, then one under another. */
    :is(#combination-view, #season-view) > .combo-figure:has(> .combo-values) {
      --middle: min(100%, 36rem);
      display: grid; width: 100%; grid-template-columns: minmax(0, 1fr) var(--middle) minmax(0, 1fr); gap: 0;
    }
    #season-view > .combo-figure:has(> .combo-values) { --middle: min(100%, 20rem); }
    :is(#combination-view, #season-view) > .combo-figure:has(> .combo-values) > * { grid-column: 2; }
    :is(#combination-view, #season-view) > .combo-figure > .combo-values { grid-column: 1 / -1; justify-self: center; max-width: 100%; }
    .combo-info.row { column-gap: 2.5rem; } /* columns as wide as the widest */
    .combo-info.row[data-cols="3"] { grid-template-columns: repeat(3, 1fr); }
    .combo-info.row[data-cols="4"] { grid-template-columns: repeat(4, 1fr); }
    @media (width < 73rem) { .combo-info.row[data-cols="4"] { grid-template-columns: repeat(2, 1fr); } }
    @media (width < 55rem) { .combo-info.row[data-cols] { grid-template-columns: repeat(2, 1fr); } }
    .named { display: flex; align-items: center; gap: 1ch; } /* a colour's name, then a square of it */
    .chip { flex: none; width: 0.875rem; height: 0.875rem; background: var(--color); }
    @media (max-width: 40rem) { /* narrow screens: the values one colour after another */
      .combo-info:is([data-size], .row[data-cols]) { grid-template-columns: minmax(0, 1fr); }
    }
    .section-label { margin-top: 1.5rem; color: var(--muted); font-size: 0.8rem; }
    .section-label a { color: inherit; }
    .section-label a:hover, .section-label a:focus-visible { color: var(--fg); }
    .actions { display: flex; gap: 1.5rem; margin-top: 1rem; font-size: 0.8rem; }
    .actions :is(a, button) {
      padding: 0; border: 0; background: none;
      color: var(--muted); font: inherit; text-decoration: none; cursor: pointer;
    }
    .actions :is(a, button):is(:hover, :focus-visible) { color: var(--fg); text-decoration: underline; }

    /* Create: compose a combination of 2 to 7 colours, laid out as in the book (2 to 4 as in Volume 1,
       5 to 7 stacked as the seasonal combinations), the colours' values under them (under each colour
       for 1 to 3, else in rows of blocks, as many to a row as fit), beside the full set of colours to
       pick from. On wide screens the composition stays in view while scrolling the colours. */
    #create-view { display: grid; gap: 2.5rem; align-items: start; }
    @media (min-width: 64rem) {
      #create-view { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 3rem; }
      .create-stage { position: sticky; top: calc(var(--header-height, 3.375rem) + 1.5rem); } /* where it is unscrolled: below the header */
    }
    .create-stage .combo-figure { width: 100%; }
    /* A cross or a stack is centred in the composition's column, and under it its values' rows, the
       message and the actions: as many values to a row as fit (in balanced rows, as on a combination's
       page), each 15.75rem (the widest's), one under another on narrow screens. */
    .create-stage .blocks[data-size="4"] { width: round(down, min(100%, 30rem), 4px); margin-inline: auto; }
    .create-stage .blocks.stack { width: calc(round(down, min(100%, 30rem), 4px) * 0.5625); margin-inline: auto; } /* as tall as the cross */
    .create-stage .combo-values { width: fit-content; max-width: 100%; margin-inline: auto; }
    .create-stage .combo-values > .section-label { contain: inline-size; } /* as wide as the values, not wider */
    .create-stage .combo-info.row[data-cols] { grid-template-columns: minmax(0, 1fr); }
    @container (width >= 34rem) { .create-stage .combo-info.row[data-cols] { grid-template-columns: repeat(2, 15.75rem); } }
    @container (width >= 52.25rem) { .create-stage .combo-info.row:is([data-cols="3"], [data-cols="4"]) { grid-template-columns: repeat(3, 15.75rem); } }
    @container (width >= 70.5rem) { .create-stage .combo-info.row[data-cols="4"] { grid-template-columns: repeat(4, 15.75rem); } }
    .combo-info .preview { color: var(--muted); } /* a colour shown before it is picked */
    /* 1 to 3 colours: each colour's values under it, as on a combination's page, while each colour is
       at least 16rem wide (a block is about 250 px); then one under another. */
    .create-stage { container-type: inline-size; }
    @container (width < 48rem) { .create-stage .combo-info[data-size="3"] { grid-template-columns: minmax(0, 1fr); } }
    @container (width < 32rem) { .create-stage .combo-info[data-size="2"] { grid-template-columns: minmax(0, 1fr); } }
    .create-stage .blocks .swatch { touch-action: none; cursor: grab; } /* drag to reorder */
    /* The colour selected for swapping or replacing, and the one a dragged colour would swap with. */
    .create-stage .swatch:is([aria-pressed="true"], .drop-target) { box-shadow: inset 0 0 0 0.375rem var(--bg); }
    .create-stage .dragging { position: relative; z-index: 1; cursor: grabbing; }
    .blocks .empty { border: 1px dashed var(--muted); }
    .blocks .empty + .empty { border-left: 0; }
    .picker { display: grid; gap: 1rem; }
    .picker .grid { grid-template-columns: repeat(auto-fill, minmax(2.25rem, 1fr)); }
    .picker .swatch span { opacity: 1; transform: none; } /* a picked colour's place in the combination */
    .picker-status { min-height: 3em; font-size: 0.8rem; line-height: 1.5; white-space: pre; font-variant-numeric: tabular-nums; }
    .picker-status p { margin: 0; }

    /* A colour's combinations, in the colour dialog: small, each a link to its page. */
    .detail-combos { margin-top: 1.25rem; white-space: normal; }
    .detail-combos .section-label { margin: 0 0 0.5rem; }
    .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; align-items: start; }
    .thumbs.seasons { grid-template-columns: repeat(6, 1fr); }
    .thumbs + .section-label { margin-top: 1.25rem; }
    .thumb { display: block; color: var(--muted); font-size: 0.75rem; text-decoration: none; }
    .thumb:hover, .thumb:focus-visible { color: var(--fg); }
    .thumb .blocks { margin-top: 0.25rem; }

    /* Wheel layout: wheel (angle = hue, distance from centre = chroma) centred on the page, as tall as
       the screen below the header; the info panel floats at the left middle of the screen, outside the
       layout, so it never moves the wheel. */
    .wheel-box { display: grid; justify-items: center; }
    .wheel { position: relative; width: min(100%, calc(100vh - 10rem)); aspect-ratio: 1; }
    .wheel-panel {
      position: fixed; left: 1.5rem; top: 50%; transform: translateY(-50%); z-index: 2;
      width: var(--info);
      line-height: 1.5; white-space: nowrap; font-variant-numeric: tabular-nums; pointer-events: none;
      opacity: 0; transition: opacity 0.6s ease; /* fade out */
    }
    .wheel-panel.show { opacity: 1; transition-duration: 0.12s; /* fade in */ }
    .wheel-panel .detail-swatch { height: auto; aspect-ratio: 2; margin-bottom: 0.75rem; }
    .wheel-panel h2 { font: inherit; }
    .wheel svg { display: block; width: 100%; height: 100%; }
    .wheel .segment { stroke: var(--bg); stroke-width: 0.004; cursor: pointer; outline: none; }
    .wheel-bg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.35; pointer-events: none; }
    .wheel svg { position: relative; }
    .wheel .highlight { fill: none; stroke: var(--fg); stroke-width: 0.008; pointer-events: none; }
    /* A combination's colours on the wheel: the others faded (until hovered), its colours outlined and
       joined in hue order by a thin line (greys, near the centre, have no hue to join). */
    .wheel.marking .segment:not(.marked) { opacity: 0.2; }
    .wheel.marking .segment:not(.marked):is(:hover, :focus-visible) { opacity: 1; }
    .wheel.marking .wheel-bg { opacity: 0.15; }
    .wheel .marks { fill: none; stroke: var(--fg); stroke-width: 0.008; pointer-events: none; }
    .wheel .shape { fill: none; stroke: var(--fg); stroke-width: 0.004; stroke-opacity: 0.6; pointer-events: none; }
    @media (prefers-reduced-motion: reduce) { .swatch span, .wheel-panel { transition: none !important; } }

    dialog {
      width: min(calc(var(--info) + 4.5rem), calc(100% - 2rem)); /* text + padding + copy button */
      margin: auto;
      padding: 0; border: 0;
      background: var(--bg); color: var(--fg);
    }
    dialog::backdrop { background: rgb(0 0 0 / 0.4); }
    .detail-swatch { height: 12rem; background: var(--color); }
    .detail-body { padding: 1.25rem; line-height: 1.5; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .detail-body h2 { font-size: 1.25rem; font-weight: 500; margin-bottom: 0.5rem; }
    .oklch-line { display: flex; align-items: center; gap: 0.5rem; }
    .detail-note { margin-top: 0.5rem; color: var(--muted); font-size: 0.8rem; white-space: normal; }
    dialog .detail-combos { padding: 0 1.25rem 1.25rem; margin: 0; }
    .copy {
      display: grid; padding: 0.25rem; margin: -0.25rem 0;
      border: 0; background: none; color: var(--muted); cursor: pointer;
    }
    .copy:hover, .copy:focus-visible { color: var(--fg); }
    .copy svg { width: 1rem; height: 1rem; fill: none; stroke: currentColor; stroke-width: 1.25; }
    .copy .done, .copy.copied .idle { display: none; }
    .copy.copied .done { display: block; }
    .error { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <nav>
      <div><strong>Wada Sanzo</strong> <span>| A Dictionary of Color Combinations</span></div>
      <div class="views">
        <a href="#colors">Colors</a>
        <a href="#combinations">Combinations</a>
        <a href="#seasons">Seasons</a>
        <a href="#create">Create</a>
      </div>
    </nav>
    <div class="subnav" data-view="colors" role="group" aria-label="Colours layout">
      <button type="button" data-value="grid">Grid</button>
      <button type="button" data-value="rows">Rows</button>
      <button type="button" data-value="wheel">Wheel</button>
    </div>
    <div class="subnav" data-view="combinations" data-default="all" role="group" aria-label="Number of colours">
      <button type="button" data-value="2">2</button>
      <button type="button" data-value="3">3</button>
      <button type="button" data-value="4">4</button>
      <button type="button" data-value="all">All</button>
    </div>
    <div class="subnav" data-view="seasons" data-default="all" role="group" aria-label="Month">
      <button type="button" data-value="1" aria-label="January">Jan</button>
      <button type="button" data-value="2" aria-label="February">Feb</button>
      <button type="button" data-value="3" aria-label="March">Mar</button>
      <button type="button" data-value="4" aria-label="April">Apr</button>
      <button type="button" data-value="5" aria-label="May">May</button>
      <button type="button" data-value="6" aria-label="June">Jun</button>
      <button type="button" data-value="7" aria-label="July">Jul</button>
      <button type="button" data-value="8" aria-label="August">Aug</button>
      <button type="button" data-value="9" aria-label="September">Sep</button>
      <button type="button" data-value="10" aria-label="October">Oct</button>
      <button type="button" data-value="11" aria-label="November">Nov</button>
      <button type="button" data-value="12" aria-label="December">Dec</button>
      <button type="button" data-value="all">All</button>
    </div>
    <nav class="subnav combo-subnav" aria-label="Combination" hidden>
      <div class="pager"></div>
      <div class="tabs"></div>
    </nav>
  </header>

  <main>
    <section id="colors-view"></section>
    <section id="combinations-view" hidden></section>
    <section id="combination-view" hidden></section>
    <section id="seasons-view" hidden></section>
    <section id="season-view" hidden></section>
    <section id="create-view" hidden>
      <div class="create-stage"></div>
      <div class="picker" role="group" aria-label="Colours">
        <div class="picker-status" aria-hidden="true"></div>
      </div>
    </section>
  </main>

  <dialog id="detail">
    <div class="detail-swatch"></div>
    <div class="detail-body">
      <h2></h2>
      <p data-field="cmyk"></p>
      <p class="oklch-line">
        <span data-field="oklch"></span>
        <button type="button" class="copy" aria-label="Copy CSS colour" title="Copy CSS colour">
          <svg class="idle" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8"/><path d="M10.5 5.5v-3h-8v8h3"/></svg>
          <svg class="done" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg>
        </button>
      </p>
      <p class="detail-note"></p>
    </div>
    <div class="detail-combos"></div>
  </dialog>

  <script type="module">
    const views = {
      colors: document.getElementById("colors-view"),
      combinations: document.getElementById("combinations-view"),
      combination: document.getElementById("combination-view"),
      seasons: document.getElementById("seasons-view"),
      season: document.getElementById("season-view"),
      create: document.getElementById("create-view"),
    };
    const detail = document.getElementById("detail");
    const subnavs = document.querySelectorAll(".subnav[data-view]"); // each list view's options
    const comboSubnav = document.querySelector(".combo-subnav");
    // The header's height, for what sticks below it.
    new ResizeObserver(([entry]) => document.documentElement.style.setProperty("--header-height", `${entry.borderBoxSize[0].blockSize}px`))
      .observe(document.querySelector("header"));

    const cmykText = ([c, m, y, k]) => `C ${c} M ${m} Y ${y} K ${k}`;
    const oklchText = ([l, c, h]) => `oklch(${l} ${c} ${h})`;
    const oklchValues = ([l, c, h]) => `OKLCH ${l} ${c} ${h}`;

    // Routes: #colors, #combinations, #seasons, #combination/<number> and #season/<number> for one
    // combination (Volume 1's, numbered 1-348, or a seasonal one, 1-72), followed by /<tab> for its
    // other pages (see TABS), and #create/<colours> for a combination being composed.
    let data = null; // set once the JSON has loaded
    const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    // Volume 1's three sections: size, name, and the book's name (2色の配色帖, "album of 2-colour combinations").
    const SECTIONS = [[2, "Two-colour combinations", "2色の配色帖"], [3, "Three-colour combinations", "3色の配色帖"], [4, "Four-colour combinations", "4色の配色帖"]];
    const MAX_PICKED = 7; // as many colours as the largest combination in the book
    // A combination's pages: its colours on their own, the combinations of each kind that share a colour
    // with it, and its colours on the wheel. Address suffix and name.
    const TABS = [["", "Colours"], ["combinations", "Combinations"], ["seasons", "Seasons"], ["wheel", "Wheel"]];
    // The combination being composed: its colours in order (a cross: top, left, right, bottom), the slot
    // selected for swapping or replacing, and a one-off message. In the address as colour numbers in book
    // order (#create/1-46-89), so it can be shared; also remembered in this browser.
    const create = { picked: [], active: null, note: "", dragged: false, previewing: false };
    const pickerButtons = []; // colour index -> its button in the colour picker
    let comboWheel = null; // the combination pages' wheel, made the first time it is shown
    function showView() {
      const [route, arg, tab] = location.hash.slice(1).split("/");
      const name = route in views ? route : "colors";
      const section = { combination: "combinations", season: "seasons" }[name] ?? name; // highlighted in the nav
      for (const [key, el] of Object.entries(views)) el.hidden = key !== name;
      for (const a of document.querySelectorAll(".views a")) {
        if (a.hash === `#${section}`) a.setAttribute("aria-current", "page");
        else a.removeAttribute("aria-current");
      }
      for (const s of subnavs) s.hidden = s.dataset.view !== name;
      comboSubnav.hidden = name !== "combination" && name !== "season";
      if (detail.open) detail.close();
      if ((name === "combination" || name === "season") && data) {
        renderCombination(name, Number(arg), tab);
        scrollTo(0, 0);
      } else if (name === "create" && data) {
        openCreate(arg);
        document.title = "Create | Wada Sanzo";
      } else {
        document.title = "Wada Sanzo | A Dictionary of Color Combinations";
      }
    }
    // Sub-navigation: each view's options (colors: grid, rows or the wheel; combinations: number of
    // colours; seasons: one month or all).
    // The choice is set on the view as data-show, which the CSS reads, and remembered in this browser.
    for (const subnav of subnavs) {
      const view = views[subnav.dataset.view], key = `${subnav.dataset.view}-show`;
      const buttons = [...subnav.querySelectorAll("button")];
      const choose = (value) => {
        view.dataset.show = value;
        for (const b of buttons) b.setAttribute("aria-pressed", b.dataset.value === value);
        try { localStorage.setItem(key, value); } catch {}
      };
      for (const b of buttons) b.addEventListener("click", () => choose(b.dataset.value));
      let saved = null;
      try { saved = localStorage.getItem(key); } catch {}
      choose(buttons.some((b) => b.dataset.value === saved) ? saved : subnav.dataset.default ?? buttons[0].dataset.value);
    }

    addEventListener("hashchange", showView);
    showView();

    // Fills a block that has .detail-swatch, h2 and data-field elements (the dialog and the wheel panel).
    function fillDetails(root, color) {
      root.querySelector(".detail-swatch").style.setProperty("--color", color.css);
      root.querySelector("h2").textContent = color.name;
      root.querySelector('[data-field="cmyk"]').textContent = cmykText(color.cmyk);
      root.querySelector('[data-field="oklch"]').textContent = oklchValues(color.oklch);
    }

    function showDetail(color) {
      fillDetails(detail, color);
      const copy = detail.querySelector(".copy");
      copy.dataset.css = color.css;
      copy.classList.remove("copied");
      // Only in Volume 2, or misspelled in the book: say so.
      const note = detail.querySelector(".detail-note");
      note.textContent = [color.volume === 2 && "From Volume 2", color.bookName && `Printed as ${color.bookName}`].filter(Boolean).join(". ");
      note.hidden = !note.textContent;
      // The colour's combinations, small, Volume 1's then the seasonal ones; each opens its page.
      const list = detail.querySelector(".detail-combos");
      list.replaceChildren();
      for (const [combos, noun] of [[data.combosOf[color.index], "combination"], [data.seasonsOf[color.index], "seasonal combination"]]) {
        if (!combos.length) continue;
        const label = document.createElement("p");
        label.className = "section-label";
        label.textContent = `In ${combos.length} ${noun}${combos.length === 1 ? "" : "s"}`;
        const thumbs = document.createElement("div");
        thumbs.className = combos[0].kind === "season" ? "thumbs seasons" : "thumbs";
        for (const combo of combos) {
          const a = document.createElement("a");
          a.className = "thumb";
          a.href = comboHref(combo);
          a.addEventListener("click", () => detail.close()); // also when it is the page already open
          a.textContent = comboLabel(combo);
          const blocks = blocksFor(combo, () => document.createElement("div"));
          blocks.setAttribute("aria-hidden", "true");
          a.append(blocks);
          thumbs.append(a);
        }
        list.append(label, thumbs);
      }
      detail.showModal();
      detail.scrollTop = 0;
    }

    // Copy buttons (the dialog's, and the combination page's): copy the colour as CSS, oklch(L C h),
    // and show a check mark for a moment.
    const copyTemplate = detail.querySelector(".copy");
    function copyButtonFor(css) {
      const button = copyTemplate.cloneNode(true);
      button.dataset.css = css;
      return button;
    }
    document.addEventListener("click", async (e) => {
      const button = e.target.closest(".copy");
      if (!button) return;
      try {
        await navigator.clipboard.writeText(button.dataset.css);
      } catch {
        return; // clipboard unavailable (e.g. not served from localhost or https)
      }
      button.classList.add("copied");
      clearTimeout(button.copiedTimer);
      button.copiedTimer = setTimeout(() => button.classList.remove("copied"), 1500);
    });
    // Clicking the backdrop (outside the dialog's content) closes it.
    detail.addEventListener("click", (e) => { if (e.target === detail) detail.close(); });

    try {
      const [colors, families, combinations, seasonal] = await Promise.all(
        ["colors.json", "families.json", "combinations.json", "seasons.json"].map((f) => fetch(f).then((r) => r.json()))
      );
      colors.forEach((c, i) => Object.assign(c, { index: i, css: oklchText(c.oklch) }));
      const combos = combinations.map((ids, i) => ({ kind: "combination", number: i + 1, colors: ids.map((k) => colors[k]) }));
      // Seasonal combinations: six a month, January first.
      const seasons = seasonal.map((ids, i) => ({ kind: "season", number: i + 1, month: MONTHS[Math.floor(i / 6)], colors: ids.map((k) => colors[k]) }));
      // Colour index -> its combinations, in book order.
      const combosOf = colors.map(() => []), seasonsOf = colors.map(() => []);
      for (const combo of combos) for (const c of combo.colors) combosOf[c.index].push(combo);
      for (const combo of seasons) for (const c of combo.colors) seasonsOf[c.index].push(combo);
      data = { colors, combos, combosOf, seasons, seasonsOf };

      // Colors: one grid per colour family (the book groups its colours by hue), in book order, under
      // its name. Colours only in Volume 2 are where its colour index puts them. Then the wheel.
      for (const family of families) {
        const section = document.createElement("section");
        section.append(Object.assign(document.createElement("h2"), { className: "group-heading", textContent: family.name }));
        const ul = document.createElement("ul");
        ul.className = "grid";
        ul.append(...family.colors.map((i) => swatchItem(colors[i])));
        section.append(ul);
        views.colors.append(section);
      }

      // Combinations: in book order, in the book's three sections (2, 3 and 4 colours), each under its
      // name and its numbers.
      for (const [size, name] of SECTIONS) {
        const list = combos.filter((combo) => combo.colors.length === size);
        const heading = Object.assign(document.createElement("h2"), { className: "group-heading", textContent: name });
        const range = Object.assign(document.createElement("span"), { textContent: `${comboLabel(list[0])}–${comboLabel(list.at(-1))}` });
        heading.append(range);
        const ul = document.createElement("ul");
        ul.className = "combos";
        ul.append(...list.map((combo) => combinationItem(combo)));
        const section = document.createElement("section");
        section.dataset.size = size; // for the sub-navigation's choice of size
        section.append(heading, ul);
        views.combinations.append(section);
      }

      // Seasons: month by month, in book order.
      MONTHS.forEach((month, m) => {
        const heading = Object.assign(document.createElement("h2"), { className: "group-heading", textContent: month });
        const ul = document.createElement("ul");
        ul.className = "combos seasons";
        ul.append(...seasons.slice(m * 6, m * 6 + 6).map((combo) => combinationItem(combo)));
        const section = document.createElement("section");
        section.dataset.month = m + 1; // for the sub-navigation's choice of month
        section.append(heading, ul);
        views.seasons.append(section);
      });

      buildPicker(colors, families);
      const wheel = makeWheel(colors);
      const wheelBox = document.createElement("div");
      wheelBox.className = "wheel-box";
      wheelBox.append(wheel.panel, wheel.wheel);
      views.colors.append(wheelBox);
      // Prepare the wheel background's hue table while the page is idle, so opening the wheel is quick.
      (window.requestIdleCallback ?? setTimeout)(() => cuspTable());
      showView(); // a #combination/<number> (or #season, #create) link opened directly needs the data
    } catch (error) {
      console.error(error);
      document.querySelector("main").innerHTML = `<p class="error">Couldn't load the colour data. Serve this folder over HTTP, e.g. <code>python3 -m http.server</code>.</p>`;
    }

    // A colour block: shows its text on hover, opens the details on click (or does onClick).
    function colorButton(c, onClick = () => showDetail(c)) {
      const button = document.createElement("button");
      button.className = "swatch";
      button.style.setProperty("--color", c.css);
      button.style.setProperty("--ink", c.oklch[0] > 0.6 ? "rgb(0 0 0 / 0.75)" : "rgb(255 255 255 / 0.9)");
      button.setAttribute("aria-label", c.name);
      button.addEventListener("click", onClick);
      return button;
    }

    // A combination's number as shown (001-348; seasonal ones 01-72) and its page's address.
    function comboLabel(combo) {
      return String(combo.number).padStart(combo.kind === "season" ? 2 : 3, "0");
    }
    function comboHref(combo) {
      return `#${combo.kind}/${combo.number}`;
    }

    // Blocks for n colours laid out as in the book: Volume 1's layouts for 2 to 4 (see the CSS),
    // stacked for seasonal combinations and for more than 4.
    function emptyBlocks(n, stacked) {
      const blocks = document.createElement("div");
      blocks.className = stacked ? "blocks stack" : "blocks";
      if (stacked) blocks.style.setProperty("--n", n);
      else blocks.dataset.size = n;
      return blocks;
    }

    // The combination's colours laid out as in the book; make(colour) creates each block.
    function blocksFor(combo, make) {
      const blocks = emptyBlocks(combo.colors.length, combo.kind === "season");
      for (const c of combo.colors) {
        const block = make(c);
        block.style.setProperty("--color", c.css);
        blocks.append(block);
      }
      return blocks;
    }

    // A colour block that shows its name on hover and opens the colour dialog on click (or does onClick).
    function namedColorButton(c, onClick) {
      const button = colorButton(c, onClick);
      const name = document.createElement("span");
      // Where a line can break inside the words too long for their colour in the lists (at their
      // narrowest): after a slash, and at soft hyphens. A variant's letter stays with its mark ("- A").
      name.textContent = c.name.replace("/", "/\u200B").replace("Vanderpoel", "Vander\u00ADpoel")
        .replace("Pomegranate", "Pome\u00ADgran\u00ADate").replace(/ ([-|]) (\w)$/, " $1\u2060\u00A0$2");
      button.append(name);
      return button;
    }

    // A combination in a list: its number (a link to its page) above its colours; those in `shared`
    // marked (the colours it shares with the combination whose page this is).
    function combinationItem(combo, shared = []) {
      const link = document.createElement("a");
      link.className = "combo-number";
      link.href = comboHref(combo);
      link.textContent = comboLabel(combo);
      const li = document.createElement("li");
      li.setAttribute("aria-label", `${combo.kind === "season" ? "Seasonal combination" : "Combination"} ${combo.number}`);
      li.append(link, blocksFor(combo, (c) => {
        const button = namedColorButton(c);
        if (shared.includes(c)) button.classList.add("shared");
        return button;
      }));
      return li;
    }

    // Each colour's name (followed by the colour), CMYK and OKLCH (with a copy button): under each of
    // `size` colours side by side (Create shows 1 colour in 2 slots), or (row) in rows under the
    // combination, up to 4 to a row, the rows balanced (see the CSS).
    // A colour's name, then a small square of it (so it is clear which colour the values are of).
    function namedLine(c) {
      const name = document.createElement("p");
      name.className = "named";
      name.textContent = c.name;
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.style.setProperty("--color", c.css);
      name.append(chip);
      return name;
    }

    function infoFor(colors, row = false, size = colors.length) {
      const info = document.createElement("div");
      info.className = "combo-info";
      if (row) {
        info.classList.add("row");
        info.dataset.cols = Math.ceil(colors.length / Math.ceil(colors.length / 4));
      } else info.dataset.size = size;
      for (const c of colors) {
        const name = namedLine(c);
        const cmyk = document.createElement("p");
        cmyk.textContent = cmykText(c.cmyk);
        const oklch = document.createElement("p");
        oklch.className = "oklch-line";
        const values = document.createElement("span");
        values.textContent = oklchValues(c.oklch);
        oklch.append(values, copyButtonFor(c.css));
        const cell = document.createElement("div");
        cell.append(name, cmyk, oklch);
        info.append(cell);
      }
      return info;
    }

    // Colours in an address: their numbers in book order, 1-based, e.g. 1-46-89.
    function colorsCode(colors) {
      return colors.map((c) => c.index + 1).join("-");
    }
    function parseColors(text) {
      const colors = [];
      for (const part of text.split("-")) {
        const c = /^\d+$/.test(part) ? data.colors[Number(part) - 1] : undefined;
        if (c && !colors.includes(c) && colors.length < MAX_PICKED) colors.push(c);
      }
      return colors;
    }

    // Opens the Create view: with the colours in the address, or else the combination composed last.
    function openCreate(arg) {
      if (arg !== undefined) create.picked = parseColors(arg);
      else if (!create.picked.length) {
        let saved = null;
        try { saved = localStorage.getItem("create"); } catch {}
        create.picked = parseColors(saved ?? "");
      }
      create.active = null;
      create.note = "";
      updateCreate();
    }

    // After every change: the address, the saved copy, the composition and the picker's marks.
    function updateCreate(focusSlot) {
      const code = colorsCode(create.picked);
      history.replaceState(null, "", code ? `#create/${code}` : "#create");
      try { localStorage.setItem("create", code); } catch {}
      renderStage(focusSlot);
      for (const c of data.colors) {
        const at = create.picked.indexOf(c), button = pickerButtons[c.index];
        button.setAttribute("aria-pressed", at >= 0);
        button.firstElementChild.textContent = at >= 0 ? at + 1 : "";
      }
    }

    // The composition: the colours laid out as in the book (2 to 7; empty slots until there are 2),
    // each colour's values, a message, and actions. With a preview ({ colors, at }), its colours
    // instead, colour `at` being the one not picked yet.
    function renderStage(focusSlot, preview) {
      const { picked, active } = create;
      const shown = preview?.colors ?? picked;
      const size = Math.max(2, shown.length);
      const blocks = emptyBlocks(size, size > 4);
      for (let i = 0; i < size; i++) {
        if (i < shown.length) blocks.append(slotButton(shown[i], i, !preview));
        else blocks.append(Object.assign(document.createElement("div"), { className: "empty" }));
      }
      const figure = document.createElement("div");
      figure.className = "combo-figure";
      figure.append(blocks);
      let info = null;
      if (shown.length) {
        info = size > 3 ? infoFor(shown, true) : infoFor(shown, false, size);
        if (preview) info.children[preview.at].classList.add("preview");
      }

      const note = document.createElement("p");
      note.className = "section-label";
      note.setAttribute("aria-live", "polite");
      if (create.note) note.textContent = create.note;
      else if (active !== null) note.textContent = "Pick a colour to replace it, or select another to swap them.";
      else if (shown.length < 2) note.textContent = `Pick 2 to ${MAX_PICKED} colours.`;
      else {
        // Book combinations (Volume 1's and the seasonal ones) that have all these colours.
        const has = (combo) => shown.every((c) => combo.colors.includes(c));
        const groups = [["", data.combos.filter(has)], ["Seasons:", data.seasons.filter(has)]].filter(([, list]) => list.length);
        if (!groups.length) note.textContent = "Not together in the book.";
        else {
          note.append("Together in the book:");
          groups.forEach(([title, list], g) => {
            if (title) note.append(g ? " · " : " ", title);
            for (const combo of list) {
              const a = document.createElement("a");
              a.href = comboHref(combo);
              a.textContent = comboLabel(combo);
              note.append(" ", a);
            }
          });
        }
      }

      const actions = document.createElement("p");
      actions.className = "actions";
      if (picked.length) {
        const copyLink = Object.assign(document.createElement("button"), { type: "button", textContent: "Copy link" });
        copyLink.addEventListener("click", async () => {
          try { await navigator.clipboard.writeText(location.href); } catch { return; }
          copyLink.textContent = "Copied";
          setTimeout(() => (copyLink.textContent = "Copy link"), 1500);
        });
        const clear = Object.assign(document.createElement("button"), { type: "button", textContent: "Clear" });
        clear.addEventListener("click", () => {
          create.picked = [];
          create.active = null;
          create.note = "";
          updateCreate();
        });
        actions.append(copyLink, clear);
      }

      // A cross or a stack: its values, the message and the actions together, centred under it.
      if (size > 3) {
        const values = document.createElement("div");
        values.className = "combo-values";
        values.append(info, note, actions);
        figure.append(values);
        views.create.querySelector(".create-stage").replaceChildren(figure);
      } else {
        if (info) figure.append(info);
        views.create.querySelector(".create-stage").replaceChildren(figure, note, actions);
      }
      create.previewing = Boolean(preview);
      if (focusSlot !== undefined) blocks.children[focusSlot]?.focus();
    }

    // A colour of the composition: click it, then another, to swap them (or then a colour in the
    // picker, to replace it); or drag it onto another. Delete or Backspace removes it.
    function slotButton(c, i, marked = true) { // marked: show the selected slot (not in a preview)
      const button = namedColorButton(c, () => { if (!create.dragged) selectSlot(i); });
      button.dataset.slot = i;
      button.setAttribute("aria-pressed", marked && create.active === i);
      button.addEventListener("pointerdown", (e) => dragSlot(e, button, i));
      button.addEventListener("keydown", (e) => {
        if (e.key !== "Delete" && e.key !== "Backspace") return;
        e.preventDefault();
        create.picked.splice(i, 1);
        create.active = null;
        create.note = "";
        updateCreate(create.picked.length ? Math.min(i, create.picked.length - 1) : undefined);
      });
      return button;
    }

    function swapSlots(a, b) {
      const p = create.picked;
      [p[a], p[b]] = [p[b], p[a]];
    }

    function selectSlot(i) {
      const { active } = create;
      create.note = "";
      if (active === null) create.active = i;
      else {
        if (active !== i) swapSlots(active, i);
        create.active = null;
      }
      updateCreate(i);
    }

    // Dragging a colour of the composition: it follows the pointer; dropped on another colour, they swap.
    function dragSlot(e, button, i) {
      if (e.button !== 0 || !e.isPrimary) return;
      const x0 = e.clientX, y0 = e.clientY;
      const others = [...button.parentElement.querySelectorAll("[data-slot]")].filter((b) => b !== button);
      let dragging = false, target = null;
      button.setPointerCapture(e.pointerId);
      const move = (ev) => {
        const dx = ev.clientX - x0, dy = ev.clientY - y0;
        if (!dragging && Math.hypot(dx, dy) < 6) return; // still a click
        dragging = true;
        button.classList.add("dragging");
        button.style.transform = `translate(${dx}px, ${dy}px) scale(0.85)`; // smaller, to show the target
        target = others.find((b) => {
          const r = b.getBoundingClientRect();
          return ev.clientX >= r.left && ev.clientX < r.right && ev.clientY >= r.top && ev.clientY < r.bottom;
        }) ?? null;
        for (const b of others) b.classList.toggle("drop-target", b === target);
      };
      const end = (ev) => {
        button.removeEventListener("pointermove", move);
        button.removeEventListener("pointerup", end);
        button.removeEventListener("pointercancel", end);
        if (!dragging) return; // a click, handled by the click listener
        create.dragged = true; // ignore the click that follows this pointerup
        setTimeout(() => (create.dragged = false));
        if (target && ev.type === "pointerup") swapSlots(i, Number(target.dataset.slot));
        create.active = null;
        create.note = "";
        updateCreate();
      };
      button.addEventListener("pointermove", move);
      button.addEventListener("pointerup", end);
      button.addEventListener("pointercancel", end);
    }

    // A colour in the picker: adds it to the composition (or replaces the selected slot); if it is
    // already there, removes it.
    function pick(c) {
      const { picked } = create;
      const at = picked.indexOf(c);
      create.note = "";
      if (at >= 0) picked.splice(at, 1);
      else if (create.active !== null) picked[create.active] = c;
      else if (picked.length < MAX_PICKED) picked.push(c);
      else create.note = `${MAX_PICKED} colours at most: click a picked colour to remove it, or select one in the combination to replace it.`;
      create.active = null;
      updateCreate();
    }

    // Where picking c would put it (see pick): the composition it would make and its place in it; none
    // if c would be removed instead, or there is no room.
    function previewOf(c) {
      const { picked, active } = create;
      if (picked.includes(c)) return null;
      const colors = [...picked];
      const at = active ?? colors.length;
      if (at >= MAX_PICKED) return null;
      colors[at] = c;
      return { colors, at };
    }

    // The colour picker: every colour, by family as in the Colors view, small. A picked colour shows
    // its place in the combination; hovering or focusing one shows its values above, and hovering one
    // shows it in the composition where picking it would put it.
    function buildPicker(colors, families) {
      const picker = views.create.querySelector(".picker");
      const status = picker.querySelector(".picker-status");
      const showStatus = (c) => status.replaceChildren(
        namedLine(c), Object.assign(document.createElement("p"), { textContent: `${cmykText(c.cmyk)}  ${oklchValues(c.oklch)}` }));
      // Changing the composition moves neither the picker nor the composition. On narrow screens the
      // composition is above the picker: when it changes height, scroll by as much, so the picker stays
      // under the pointer. On wide screens it sticks below the header while the colours scroll, as far
      // as the view goes: grown taller than the colours, it would stop and jump up; the view grows instead.
      const steady = (change) => {
        const stage = views.create.querySelector(".create-stage");
        const top = picker.getBoundingClientRect().top, stageTop = stage.getBoundingClientRect().top;
        change();
        const jump = stageTop - stage.getBoundingClientRect().top;
        if (jump > 0.5) views.create.style.minHeight = `${views.create.getBoundingClientRect().height + jump}px`;
        scrollBy(0, picker.getBoundingClientRect().top - top);
      };
      const preview = (c) => {
        const p = previewOf(c);
        if (p) steady(() => renderStage(undefined, p));
      };
      const unpreview = () => { if (create.previewing) steady(() => renderStage()); };
      for (const family of families) {
        const ul = document.createElement("ul");
        ul.className = "grid";
        for (const i of family.colors) {
          const c = colors[i];
          const button = colorButton(c, () => steady(() => pick(c)));
          button.append(document.createElement("span"));
          button.addEventListener("pointerenter", (e) => {
            showStatus(c);
            if (e.pointerType !== "touch") preview(c); // a tap picks it at once
          });
          button.addEventListener("focus", () => showStatus(c));
          button.addEventListener("pointerleave", () => {
            status.replaceChildren();
            unpreview();
          });
          button.addEventListener("blur", () => status.replaceChildren());
          pickerButtons[i] = button;
          const li = document.createElement("li");
          li.append(button);
          ul.append(li);
        }
        picker.append(ul);
      }
    }

    // Escape cancels a selected slot.
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape" || views.create.hidden || detail.open || create.active === null) return;
      const focusSlot = create.active;
      create.active = null;
      updateCreate(focusSlot);
    });

    // One combination's pages (kind "combination" or "season"; tab one of TABS): its colours on their
    // own, large, with each colour's values; the combinations of one kind that share a colour with it
    // (by section or month; in each, most shared colours first, then in book order); or its colours on
    // the wheel. The other pages start with its number and its colours, small. Previous and next keep
    // the page.
    function renderCombination(kind, number, tab = "") {
      const view = views[kind];
      const all = kind === "season" ? data.seasons : data.combos;
      const combo = all[number - 1];
      if (!combo) {
        comboSubnav.querySelector(".pager").replaceChildren();
        comboSubnav.querySelector(".tabs").replaceChildren();
        view.replaceChildren(Object.assign(document.createElement("p"), { className: "error", textContent: "No such combination." }));
        document.title = "No such combination | Wada Sanzo";
        return;
      }
      if (!TABS.some(([t]) => t === tab)) tab = "";
      const shared = (other) => other.colors.filter((c) => combo.colors.includes(c)).length;
      const relatedIn = (list) => list
        .filter((other) => other !== combo && shared(other) > 0)
        .sort((a, b) => shared(b) - shared(a) || a.number - b.number);
      const related = { combinations: relatedIn(data.combos), seasons: relatedIn(data.seasons) };

      // Sub-navigation: previous, this one and next (also the arrow keys), and the tabs, with how many related.
      const suffix = tab ? `/${tab}` : "";
      const step = (other, rel, text) => other
        ? [Object.assign(document.createElement("a"), { href: comboHref(other) + suffix, rel, textContent: text(comboLabel(other)) })]
        : [];
      const here = Object.assign(document.createElement("span"), { textContent: comboLabel(combo) });
      here.setAttribute("aria-current", "page");
      comboSubnav.querySelector(".pager").replaceChildren(
        ...step(all[number - 2], "prev", (label) => `← ${label}`), here, ...step(all[number], "next", (label) => `${label} →`));
      comboSubnav.querySelector(".tabs").replaceChildren(...TABS.map(([t, label]) => {
        const count = related[t]?.length;
        const text = count === undefined ? label : `${label} ${count}`;
        if (count === 0) {
          const span = Object.assign(document.createElement("span"), { textContent: text });
          span.setAttribute("aria-disabled", "true");
          return span;
        }
        const a = Object.assign(document.createElement("a"), { href: comboHref(combo) + (t ? `/${t}` : ""), textContent: text });
        if (t === tab) a.setAttribute("aria-current", "page");
        return a;
      }));

      const name = combo.month ? `${comboLabel(combo)} · ${combo.month}` : comboLabel(combo);
      const title = document.createElement("h1");
      title.className = "combo-number";
      title.textContent = name;
      view.dataset.tab = tab || "colours";
      document.title = `${name}${tab ? ` · ${TABS.find(([t]) => t === tab)[1]}` : ""} | Wada Sanzo`;

      if (!tab) {
        const figure = document.createElement("div");
        figure.className = "combo-figure";
        // Under each colour when they're side by side (2 or 3); in rows for a cross or a stack.
        const info = infoFor(combo.colors, combo.kind === "season" || combo.colors.length === 4);
        const edit = document.createElement("a");
        edit.href = `#create/${colorsCode(combo.colors)}`;
        edit.textContent = "Edit in Create";
        const actions = document.createElement("p");
        actions.className = "actions";
        actions.append(edit);
        const blocks = blocksFor(combo, (c) => namedColorButton(c));
        if (kind === "combination") { // its number as in the book: see .plate
          const plate = document.createElement("div");
          plate.className = "plate";
          plate.append(title, blocks);
          figure.append(plate);
        } else figure.append(title, blocks);
        if (info.classList.contains("row")) { // the rows are wider than the colours: they go together
          const below = document.createElement("div");
          below.className = "combo-values";
          below.append(info, actions);
          figure.append(below);
        } else figure.append(info, actions);
        view.replaceChildren(figure);
        return;
      }

      const ref = document.createElement("div");
      ref.className = "combo-ref";
      ref.append(title, blocksFor(combo, (c) => colorButton(c))); // too small for the colours' names
      if (tab === "wheel") {
        comboWheel ??= makeWheel(data.colors);
        comboWheel.mark(combo.colors);
        ref.append(comboWheel.panel);
        view.replaceChildren(ref, comboWheel.wheel);
        return;
      }

      const items = related[tab];
      if (!items.length) {
        const noun = tab === "seasons" ? "seasonal combination" : "combination";
        view.replaceChildren(ref, Object.assign(document.createElement("p"), { className: "error", textContent: `No ${noun} shares a colour with this one.` }));
        return;
      }
      // Grouped as on their own pages: Volume 1's by section, the seasonal ones by month.
      const seasonal = tab === "seasons";
      const groups = seasonal
        ? MONTHS.map((month) => [month, (c) => c.month === month])
        : SECTIONS.map(([size, sectionName]) => [sectionName, (c) => c.colors.length === size]);
      const box = document.createElement("section");
      box.className = seasonal ? "related-months" : "related";
      const next = { 6: 0, 3: 0, 2: 0 }; // months side by side: the next free column, per number of columns
      for (const [groupName, inGroup] of groups) {
        const inThis = items.filter(inGroup);
        if (!inThis.length) continue;
        const heading = Object.assign(document.createElement("h2"), { className: "group-heading", textContent: groupName });
        heading.append(Object.assign(document.createElement("span"), { textContent: inThis.length }));
        const list = document.createElement("ul");
        list.className = seasonal ? "combos seasons" : "combos";
        list.append(...inThis.map((other) => combinationItem(other, combo.colors)));
        const group = document.createElement("div");
        if (seasonal) { // where the month goes (see the CSS): after the previous one and an empty column, or on a new row
          for (const cols of [6, 3, 2]) {
            const width = Math.min(inThis.length, cols);
            if (next[cols] > 0 && next[cols] + width > cols) next[cols] = 0;
            group.style.setProperty(`--at-${cols}`, next[cols] + 1);
            group.style.setProperty(`--n-${cols}`, width);
            next[cols] += width + 1;
          }
        }
        group.append(heading, list);
        box.append(group);
      }
      view.replaceChildren(ref, box);
    }

    // Left and right arrow keys: the previous and next combination, on the same page.
    document.addEventListener("keydown", (e) => {
      if (comboSubnav.hidden || detail.open || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
      const rel = { ArrowLeft: "prev", ArrowRight: "next" }[e.key];
      const link = rel && comboSubnav.querySelector(`[rel="${rel}"]`);
      if (!link) return;
      e.preventDefault();
      location.hash = link.hash;
    });

    function swatchItem(c) {
      const button = colorButton(c);
      const inGrid = document.createElement("span");
      inGrid.className = "in-grid";
      inGrid.textContent = c.cmyk.map((v, j) => `${"CMYK"[j]} ${v}`).join("\n");
      const inRows = document.createElement("span");
      inRows.className = "in-rows";
      for (const text of [c.name, cmykText(c.cmyk), oklchValues(c.oklch)]) {
        const cell = document.createElement("span");
        cell.textContent = text;
        inRows.append(cell);
      }
      button.append(inGrid, inRows);
      const li = document.createElement("li");
      li.append(button);
      return li;
    }

    // Donut wheel on a polar grid: angle = OKLCH hue (counter-clockwise from the right, 10° slices),
    // distance from the centre = chroma (8 rings, spaced by the square root of chroma so the many
    // muted colours get room). Colours sharing a cell split it side by side, in hue order; empty
    // cells stay as gaps. Near-neutral colours (no meaningful hue) form the inner ring, light to dark.
    // Returns the wheel, its info panel (the colour under the pointer), and mark(colours), which shows
    // a combination's colours on it.
    function makeWheel(colors) {
      const SLICE = 10, BANDS = 8, NEUTRAL_C = 0.02;
      const RING = [0.25, 1], GREYS = [0.13, 0.23];
      const panel = Object.assign(document.createElement("aside"), { className: "wheel-panel" });
      panel.setAttribute("aria-live", "polite");
      panel.innerHTML = `<div class="detail-swatch"></div><h2></h2><p data-field="cmyk"></p><p data-field="oklch"></p>`;
      const wheel = Object.assign(document.createElement("div"), { className: "wheel" });
      wheel.innerHTML = `<canvas class="wheel-bg" aria-hidden="true"></canvas>`
        + `<svg viewBox="-1.02 -1.02 2.04 2.04" role="group" aria-label="Colour wheel"></svg>`;
      const svg = wheel.querySelector("svg");
      const NS = "http://www.w3.org/2000/svg";
      const overlay = (name) => { // drawn over the colours
        const path = document.createElementNS(NS, "path");
        path.classList.add(name);
        return path;
      };
      const shape = overlay("shape"), marks = overlay("marks"), highlight = overlay("highlight");
      const segments = new Map(); // colour -> its path, outline, and (if not grey) hue angle and centre

      // Screen point for a hue angle: 0° to the right, increasing counter-clockwise.
      const pt = (r, deg) => {
        const a = (deg * Math.PI) / 180;
        return `${(r * Math.cos(a)).toFixed(5)} ${(-r * Math.sin(a)).toFixed(5)}`;
      };
      const arc = (r0, r1, d0, d1) => {
        const large = d1 - d0 > 180 ? 1 : 0;
        return `M ${pt(r1, d0)} A ${r1} ${r1} 0 ${large} 0 ${pt(r1, d1)} L ${pt(r0, d1)} A ${r0} ${r0} 0 ${large} 1 ${pt(r0, d0)} Z`;
      };

      const segment = (c, d, angle, centre) => {
        const path = document.createElementNS(NS, "path");
        segments.set(c, { path, d, angle, centre });
        path.classList.add("segment");
        path.setAttribute("d", d);
        path.setAttribute("fill", c.css);
        path.setAttribute("tabindex", "0");
        path.setAttribute("role", "button");
        path.setAttribute("aria-label", c.name);
        const show = () => {
          highlight.setAttribute("d", d);
          fillDetails(panel, c);
          panel.classList.add("show");
        };
        const hide = () => { highlight.removeAttribute("d"); panel.classList.remove("show"); };
        path.addEventListener("pointerenter", show);
        path.addEventListener("focus", show);
        path.addEventListener("pointerleave", hide);
        path.addEventListener("blur", hide);
        path.addEventListener("click", () => showDetail(c));
        path.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); showDetail(c); }
        });
        svg.append(path);
      };

      const chromatic = colors.filter((c) => c.oklch[1] >= NEUTRAL_C);
      const greys = colors.filter((c) => c.oklch[1] < NEUTRAL_C);
      const lo = Math.sqrt(NEUTRAL_C), hi = Math.sqrt(Math.max(...chromatic.map((c) => c.oklch[1])));
      const bandWidth = (RING[1] - RING[0]) / BANDS;

      // Background: the continuous wheel on the same mapping, faded, repainted when the size changes.
      const canvas = wheel.querySelector(".wheel-bg");
      new ResizeObserver(() => paintWheel(canvas, RING, lo, hi)).observe(canvas);

      const cells = new Map();
      for (const c of chromatic) {
        const s = Math.floor(c.oklch[2] / SLICE);
        const b = Math.min(Math.floor(((Math.sqrt(c.oklch[1]) - lo) / (hi - lo)) * BANDS), BANDS - 1);
        const key = `${s},${b}`;
        if (!cells.has(key)) cells.set(key, { s, b, list: [] });
        cells.get(key).list.push(c);
      }
      for (const { s, b, list } of cells.values()) {
        list.sort((x, y) => x.oklch[2] - y.oklch[2]);
        const r0 = RING[0] + b * bandWidth, w = SLICE / list.length;
        list.forEach((c, k) => {
          const d0 = s * SLICE + k * w, mid = d0 + w / 2;
          segment(c, arc(r0, r0 + bandWidth, d0, d0 + w), mid, pt(r0 + bandWidth / 2, mid));
        });
      }
      greys.sort((a, b) => b.oklch[0] - a.oklch[0]);
      const step = 360 / greys.length;
      greys.forEach((c, k) => segment(c, arc(GREYS[0], GREYS[1], k * step, (k + 1) * step)));
      svg.append(shape, marks, highlight);

      // A combination's colours: the others faded, its own outlined, joined in hue order.
      const mark = (list) => {
        wheel.classList.toggle("marking", list.length > 0);
        for (const [c, { path }] of segments) path.classList.toggle("marked", list.includes(c));
        marks.setAttribute("d", list.map((c) => segments.get(c).d).join(" "));
        const points = list.map((c) => segments.get(c)).filter((s) => s.centre).sort((a, b) => a.angle - b.angle).map((s) => s.centre);
        if (points.length < 2) shape.removeAttribute("d");
        else shape.setAttribute("d", `M ${points.join(" L ")}${points.length > 2 ? " Z" : ""}`);
      };
      return { panel, wheel, mark };
    }

    // Paints the continuous wheel: at each pixel, hue from the angle and chroma from the radius (same
    // mapping as the segments), at that hue's most vivid lightness, limited to what sRGB can show.
    // Only repaints when the size changes: a hidden canvas keeps its picture.
    function paintWheel(canvas, [R0, R1], lo, hi) {
      const size = Math.round(canvas.clientWidth * Math.min(devicePixelRatio, 1.5));
      if (!size || (size === canvas.width && canvas.dataset.painted)) return; // hidden, or already painted
      canvas.width = canvas.height = size;
      canvas.dataset.painted = "1";
      const ctx = canvas.getContext("2d");
      const img = ctx.createImageData(size, size), px = img.data;
      const unit = 2.04 / size; // matches the SVG viewBox
      const { L: cuspL, C: cuspC } = cuspTable();
      const rgb = new Float64Array(3);
      const encode = (v) => SRGB_ENCODE[v <= 0 ? 0 : v >= 1 ? 4095 : (v * 4095 + 0.5) | 0];
      for (let j = 0; j < size; j++) {
        const y = (j + 0.5) * unit - 1.02;
        for (let i = 0; i < size; i++) {
          const x = (i + 0.5) * unit - 1.02, r = Math.sqrt(x * x + y * y);
          const alpha = Math.min(1, (r - R0) / unit, (R1 - r) / unit); // antialiased edges
          if (alpha <= 0) continue;
          // Hue in half-degree steps, interpolated between the table's entries.
          const k = ((Math.atan2(-y, x) * 360) / Math.PI + 720) % 720, k0 = k | 0, t = k - k0;
          const L = cuspL[k0] + (cuspL[k0 + 1] - cuspL[k0]) * t;
          const c = lo + ((r - R0) / (R1 - R0)) * (hi - lo);
          const C = Math.min(c * c, cuspC[k0] + (cuspC[k0 + 1] - cuspC[k0]) * t);
          oklabToLinearSRGB(L, (C * x) / r, (-C * y) / r, rgb); // a = C cos h, b = C sin h
          const o = (j * size + i) * 4;
          px[o] = encode(rgb[0]);
          px[o + 1] = encode(rgb[1]);
          px[o + 2] = encode(rgb[2]);
          px[o + 3] = 255 * alpha;
        }
      }
      ctx.putImageData(img, 0, 0);
    }

    // Linear sRGB 0..1 (in 4096 steps) -> 8-bit sRGB.
    const SRGB_ENCODE = Uint8ClampedArray.from({ length: 4096 }, (_, i) => {
      const v = i / 4095;
      return 255 * (v <= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055);
    });

    // OKLab -> linear sRGB (Ottosson's matrices), written into `out`.
    function oklabToLinearSRGB(L, a, b, out = new Float64Array(3)) {
      const l_ = L + 0.3963377774 * a + 0.2158037573 * b, l = l_ * l_ * l_;
      const m_ = L - 0.1055613458 * a - 0.0638541728 * b, m = m_ * m_ * m_;
      const s_ = L - 0.0894841775 * a - 1.291485548 * b, s = s_ * s_ * s_;
      out[0] = 4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
      out[1] = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;
      out[2] = -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s;
      return out;
    }

    function inSRGB(L, C, h) {
      const rad = (h * Math.PI) / 180;
      return oklabToLinearSRGB(L, C * Math.cos(rad), C * Math.sin(rad)).every((v) => v >= -1e-4 && v <= 1 + 1e-4);
    }

    // Most vivid sRGB colour per hue (the gamut "cusp"): lightness L and chroma C in half-degree steps,
    // with entry 720 repeating entry 0 so interpolation wraps around. Computed once.
    let cusps = null;
    function cuspTable() {
      if (!cusps) {
        const L = new Float64Array(721), C = new Float64Array(721);
        for (let k = 0; k < 720; k++) {
          L[k] = cuspLightness(k / 2);
          C[k] = maxChroma(L[k], k / 2);
        }
        L[720] = L[0];
        C[720] = C[0];
        cusps = { L, C };
      }
      return cusps;
    }

    // Largest chroma sRGB can show at this lightness and hue.
    function maxChroma(L, h) {
      let lo = 0, hi = 0.4;
      for (let i = 0; i < 16; i++) { // to within 0.4 / 2^16
        const mid = (lo + hi) / 2;
        if (inSRGB(L, mid, h)) lo = mid; else hi = mid;
      }
      return lo;
    }

    // Lightness at which this hue reaches its most vivid sRGB colour (the gamut "cusp").
    // Max chroma rises then falls with lightness, so a ternary search finds the peak.
    function cuspLightness(h) {
      let lo = 0.2, hi = 1;
      for (let i = 0; i < 24; i++) { // to within 0.8 × (2/3)^24 ≈ 0.00005
        const m1 = lo + (hi - lo) / 3, m2 = hi - (hi - lo) / 3;
        if (maxChroma(m1, h) < maxChroma(m2, h)) lo = m1; else hi = m2;
      }
      return (lo + hi) / 2;
    }
  </script>
