    // Paints a wheel's background canvas, laid over its SVG (viewBox -1.02 to 1.02 each way): `at(x, y,
    // rgb, unit)` writes the pixel's linear sRGB colour into `rgb` (any colour: beyond 0..1 where sRGB
    // can't show it, kept as it is on the widest canvas the browser has, see wide2d) and returns how much
    // of the pixel it covers (0 leaves it clear); `unit` is a pixel's size in the SVG's units. At half the flat wheel's
    // resolution, scaled up smoothly: it's faded, and its edge is drawn over it, so it looks the same,
    // and it repaints at every step of the slice.
    function paintField(canvas, at) {

      if (!size) return;

          if (alpha > 0) put(px, (j * size + i) * 4, rgb, alpha);

    function paintWheel(canvas, [R0, R1], lo, hi, g = gamut("screen")) {
      const size = Math.round(canvas.clientWidth * Math.min(devicePixelRatio, 1.5));

      canvas.width = canvas.height = size;

          const C = Math.min(c * c, cuspC[k0] + (cuspC[k0 + 1] - cuspC[k0]) * t);
          oklabToLinearSRGB(L, (C * x) / r, (-C * y) / r, rgb); // a = C cos h, b = C sin h

    // SVG point at distance r and angle deg: 0° to the right, increasing counter-clockwise.
    function polarPoint(r, deg) {

    // Ostwald layout, with every cell a dot (BIG and DOT_GAP are set at the top, as the layout is made
    // before the script gets here): Wada's colours' dots are BIG times the empty cells'. Several in one
    // cell are all one size, their centres DOT_GAP radii apart and each DOT_GAP / 2 radii clear of the
    // cell's edge, as big as fits.
    // m centres on a line, DOT_GAP radii apart (radius r), about 0.
    function along(m, r) {
      return Array.from({ length: m }, (_, k) => (k - (m - 1) / 2) * DOT_GAP * r);
    }
    // The largest radius, up to `most`, at which the centres `place(r)` all fit, by halving. `fits(p, h)`:
    // whether a disc of radius h round p is within the cell.
    function fitDots(most, place, fits) {
      const ok = (r) => place(r).every((p) => fits(p, (DOT_GAP / 2) * r));
      if (ok(most)) return most;
      let lo = 0, hi = most;
      for (let i = 0; i < 30; i++) {
        const mid = (lo + hi) / 2;
        if (ok(mid)) lo = mid; else hi = mid;

      return lo;
    }

    // sits in its cell (a ring is a step of the log of it).
    function paleness(c) {
      return c.ostwald.white / (1 - c.ostwald.black);
    }

    // Ostwald's colour system, as Wada set it out (1935 supplement, pp. 8–14): every colour is a mixture
    // of full colour, white and black adding up to 1, as on Ostwald's spinning discs. Wada's grey scale
    // has 16 letters, A (white, 89% white) to P (black, 3.5% white) with J included (his Figure 2), evenly
    // spaced on a log scale so the steps look even. Ostwald's own scale skips J. A colour is written as
    // its hue, on a circle of 100 steps from yellow (0) through red (25), ultramarine (50) and sea green
    // (75) (his Figure 1), then two letters: the first gives its white content, the second its black (1
    // minus that grey's white). Wada's orange is 16PA.
    // Places each colour (c.ostwald: hue n, sector of the 24 hues, white and black content, notation, and
    // level and ring in the solid) and returns the system's constants and cell(sector, a, b), the system's
    // own colour in any of its cells. notes/ostwald.py does the same and checks it.
    function ostwaldSystem(colors) {
      const LETTERS = "ABCDEFGHIJKLMNOP";
      const GREYS = Array.from(LETTERS, (_, k) => 0.891 * (0.0355 / 0.891) ** (k / 15)); // white content
      // Named as in Wada's Figure 1, his German translated literally: Gelb, Kress (cress: orange), Rot, Veil
      // (violet), Ublau (ultramarine), Eisblau (ice blue), Seegrün, Laubgrün.
      const HUES = [[0, "Yellow"], [12.5, "Orange"], [25, "Red"], [37.5, "Violet"], [50, "Ultramarine"], [62.5, "Ice blue"], [75, "Sea green"], [87.5, "Leaf green"]];
      const mod = (x, m) => ((x % m) + m) % m;

      // a ray from the white in CIE xy (D65, CSS's) per degree, and one at each ink alone and each two at
      // 100%, where the full colours turn a corner. A hue's plane is one ray, its complement's the opposite
      // one: complements, mixed, give grey.
      const { rays: RAYS, angles: ANGLES, steps: STEPS } = press.ostwald;
      const WHITE = [0.9504559270516716, 1, 1.0890577507598784], SW = WHITE[0] + WHITE[1] + WHITE[2], XW = WHITE[0] / SW, YW = WHITE[1] / SW;
      const RAD = Math.PI / 180, DEG = 180 / Math.PI; // (as Python's math.radians and math.degrees)
      // The two rays either side of chromaticity angle theta, and how far theta is from the first.
      const between = (theta) => {
        const x = mod(theta, 360);
        let lo = 0, hi = ANGLES.length; // the first ray past x
        while (lo < hi) { const mid = (lo + hi) >> 1; if (ANGLES[mid] <= x) lo = mid + 1; else hi = mid; }
        const n = ANGLES.length, j0 = (lo - 1 + n) % n, j1 = lo % n, a0 = ANGLES[j0], a1 = ANGLES[j1] + (lo === n ? 360 : 0);

      };
      // At theta: the full colour's distance from the white and its X + Y + Z, and the tint edge (the
      // brightest the press prints, Y, at each 1/32 share of full colour).
      const ray = (theta) => {
        const [a, b, t] = between(theta);
        return [a[0] + t * (b[0] - a[0]), a[1] + t * (b[1] - a[1]), a[3].map((p, k) => p + t * (b[3][k] - p))];
      };
      const fullHue = (theta) => { // the OKLCH hue of the press's full colour at theta
        const [a, b, t] = between(theta);
        return a[2] + t * (mod(b[2] - a[2] + 180, 360) - 180);
      };
      const tintEdge = (edge, r) => {
        const x = Math.min(Math.max(r, 0), 1) * STEPS, k = Math.min(Math.trunc(x), STEPS - 1);
        return edge[k] + (x - k) * (edge[k + 1] - edge[k]);
      };
      // Ostwald's 100-step hue at chromaticity angle theta, before calibration. He spaced his circle evenly
      // to the eye, with complements opposite. The full colour's OKLCH hue is even to the eye, but the
      // press's full colours aren't symmetrical in it: a full colour and its complement are up to 37° from
      // opposite. So the number takes the mean of the two, the complement's turned half round, and
      // complements stay exactly 50 steps apart. Ostwald's circle runs the other way round, a quarter of it
      // (25 steps) per 90°. notes/ostwald.py's hue_number does the same.
      const hueNumber = (theta) => {
        const h1 = fullHue(theta), h2 = fullHue(theta + 180);

      };
      // Where a colour falls against the press: its hue number before calibration (null for a grey), and
      // its white and black content. Its share of full colour against white, r, comes from how pure it is:
      // Ostwald's discs mix white and full colour, so a colour a W + b F is r = b / (a + b) of the way, and
      // its purity is r's weighted by the two's X + Y + Z. Its black is how far it is below the tint edge,
      // 1 - Y / Ymax(r): a tint has none, and its shadow series, the same chromaticity darker, more. Beyond
      // what the press prints (purer than its full colour, or brighter than the tint edge) it is measured
      // at the edge. notes/ostwald.py's measure does the same.
      const rawOf = (oklch) => {

        if (d < 1e-6) return { n: null, white: xyz[1], black: 1 - xyz[1], colour: 0 };
        const theta = mod(Math.atan2(dy, dx) * DEG, 360), [dF, sF, edge] = ray(theta), u = d / dF;
        const r = Math.min(u < 1 ? (SW * u) / (SW * u + sF * (1 - u)) : u, 1);
        const black = Math.max(1 - xyz[1] / tintEdge(edge, r), 0);
        return { n: hueNumber(theta), white: (1 - r) * (1 - black), black, colour: r * (1 - black) };
      };
      const raw = colors.map((c) => rawOf(c.oklch));
      // Calibration: Wada's orange is 16PA (his 1935 supplement, p. 14).
      const offset = mod(16 - raw[colors.findIndex((c) => c.name === "Orange")].n, 100);
      // The chromaticity angles of the 24 hues (sector 0 is yellow): where the number is the sector's,
      // found by halving (the number falls as the angle rises).
      const SECTOR_ANGLES = Array.from({ length: 24 }, (_, sector) => {
        const diff = (theta) => mod(hueNumber(theta) + offset - (sector * 100) / 24 + 50, 100) - 50;
        let lo = 0;
        while (lo < 359 && !(diff(lo) >= 0 && diff(lo + 1) < 0)) lo++;
        let hi = lo + 1;
        for (let i = 0; i < 50; i++) { const mid = (lo + hi) / 2; if (diff(mid) >= 0) lo = mid; else hi = mid; }
        return (lo + hi) / 2;
      });
      // The nearest grey, on a log scale.
      const step = (v) => {
        const at = (k) => Math.abs(Math.log(Math.max(v, 1e-3)) - Math.log(GREYS[k]));
        let best = 0;
        for (let k = 1; k < GREYS.length; k++) if (at(k) < at(best)) best = k;
        return best;
      };
      // Where a colour falls (any colour's [L, C, h], or its raw values): its hue number and sector, its
      // white and black content, its level and ring, and its code.
      const notation = (oklch, { n: hueN, white, black } = rawOf(oklch)) => {
        let a = step(white), b = step(1 - black); // a >= b, as white <= 1 - black
        if (a <= b || hueN === null) a = b = Math.round((a + b) / 2); // no colour at this precision: a grey
        const n = a === b ? null : mod(hueN + offset, 100);
        return {
          n, sector: n === null ? null : Math.round((n * 24) / 100) % 24, // 0 is yellow, as in Wada's Figure 1
          white, black, level: a + b, ring: a - b,
          code: n === null ? LETTERS[a] : `${Math.round(n) % 100}${LETTERS[a]}${LETTERS[b]}`,
        };
      };
      colors.forEach((c, i) => { c.ostwald = notation(c.oklch, raw[i]); });
      // A cell's own colour: white GREYS[a] and black 1 - GREYS[b], so colour GREYS[b] - GREYS[a]. Its share
      // of full colour is r = colour / (white + colour), at the sector's angle, and it is as far below the
      // press's tint edge as its black says: Y = (1 - black) Ymax(r). A grey is GREYS[a] of the white.
      // Returned as CSS and OKLCH (rounded as colors.json is), linear sRGB (beyond 0..1 where sRGB can't
      // show it), its white and black content and its code, the hue numbered as in Wada's Figure 1 (sector
      // 1 is 4, sector 3 is 13). notes/ostwald.py's cell_xyz does the same.
      const cellXYZ = (sector, a, b) => {
        if (a === b || sector === null) return WHITE.map((v) => GREYS[a] * v);
        const theta = SECTOR_ANGLES[sector], [dF, sF, edge] = ray(theta), r = (GREYS[b] - GREYS[a]) / GREYS[b];
        const u = (r * sF) / (SW * (1 - r) + r * sF), Y = GREYS[b] * tintEdge(edge, r);
        const x = XW + u * dF * Math.cos(theta * RAD), y = YW + u * dF * Math.sin(theta * RAD);
        return [(x * Y) / y, Y, ((1 - x - y) * Y) / y];
      };
      const cell = (sector, a, b) => {
        const xyz = cellXYZ(sector, a, b), oklch = oklchOfXYZ(xyz);
        return {
          css: oklchText(oklch), oklch, rgb: times3(XYZ_TO_SRGB, xyz), white: GREYS[a], black: 1 - GREYS[b],
          code: a === b ? LETTERS[a] : `${Math.round((sector * 100) / 24) % 100}${LETTERS[a]}${LETTERS[b]}`,
          sector: a === b ? null : sector, a, b,
        };
      };
      // The cell whose own colour this is, exactly (its OKLCH as cell() rounds it, joined by commas), if any.
      let cells = null;
      const cellOf = (token) => {
        if (!cells) {
          cells = new Map();
          for (let a = 0; a < GREYS.length; a++) {
            for (let b = 0; b <= a; b++) {
              for (const sector of a === b ? [null] : SECTOR_ANGLES.keys()) {
                const own = cell(sector, a, b);
                cells.set(own.oklch.join(","), own);
              }
            }
          }
        }
        return cells.get(token) ?? null;
      };
      return { GREYS, LETTERS, HUES, cell, cellOf, offset, notation };
    }

    // Ostwald layout: one level of the double cone at a time, seen from above. Angle = hue (24 sectors,
    // yellow at the top, red at the right), distance from the centre = colour content in Wada's steps,
    // with the level's grey at the centre. Each of Wada's colours fills the cell of its rounded notation
    // (the info panel gives its exact values); colours sharing a cell split it in hue order, and empty
    // cells show a dot of the system's own colour (hovering one gives its code and values, with its CMYK
    // estimated, in the same panel, named "Ostwald" and its code); or, as the cells switch says, every
    // cell is a dot, Wada's colours' bigger. Beside it, the level control: the 16
    // greys, white at the top, and the solid's outline with the slice. Even levels have a grey at the
    // centre; odd ones fall between two greys, and the middle one, the widest, has the full colours at
    // its rim. Sliced through the axis instead, it shows two pages back to back (a hue's and its
    // complement's), with a dial in the control's place; or, in 3D, the whole solid.
    // With `picker` (the creator's), it's for picking colours: 2D only, and hovering a colour or a cell, or
    // clicking it, goes to the picker (hover(colour, event), leave(), pick(colour); ostwald(cell) makes a

      const P = picker ? "create-ostwald" : "ostwald"; // its saved choices' and its ids' prefix

      // once fetched, if made for this calibration.)

      const NS = "http://www.w3.org/2000/svg";
      const svgEl = (name, attrs = {}) => {
        const e = document.createElementNS(NS, name);

        return e;
      };
      const box = Object.assign(document.createElement("div"), { className: "ostwald-box" });

      panel.setAttribute("aria-live", "polite");

      const layout = Object.assign(document.createElement("div"), { className: "ostwald" });
      const disc = Object.assign(document.createElement("div"), { className: "ostwald-disc" });
      const svg = svgEl("svg", { viewBox: "-1.45 -1.2 2.9 2.4", role: "group", "aria-label": "A level of Ostwald's colour solid" });
      const cells = svgEl("g");
      const rim = svgEl("circle", { class: "rim", r: 1 }); // the widest level's edge, for scale
      const highlight = svgEl("path", { class: "highlight" });
      svg.append(cells, rim, highlight);
      disc.append(svg);
      // The 8 main hues, named around the outside.
      for (const [n, name] of HUES) {
        const rad = ((90 - n * 3.6) * Math.PI) / 180, x = 1.06 * Math.cos(rad), y = -1.06 * Math.sin(rad);
        const label = Object.assign(document.createElement("span"), { className: "ostwald-label level-label", textContent: name });
        label.style.left = `${((x + 1.45) / 2.9) * 100}%`;
        label.style.top = `${((y + 1.2) / 2.4) * 100}%`;
        const side = Math.abs(x) < 0.05 ? 0 : Math.sign(x); // centred above or below, or to the right or left
        label.style.setProperty("--dx", ["-100%", "-50%", "0%"][side + 1]);
        label.style.setProperty("--align", ["right", "center", "left"][side + 1]);
        disc.append(label);
      }
      // Sliced through the axis: the two pages' hues, named at their tips (left, right).
      const pageLabels = [-1, 1].map((side) => {
        const label = Object.assign(document.createElement("span"), { className: "ostwald-label page-label" });
        label.style.setProperty("--dx", side < 0 ? "-100%" : "0%");
        label.style.setProperty("--align", side < 0 ? "right" : "left");
        disc.append(label);
        return label;
      });
      // The caption; sliced through the axis, with a button each side to turn the slice a page back or on.
      const caption = Object.assign(document.createElement("p"), { className: "view-caption" });
      const captionText = document.createElement("span");
      const turn = (step, d) => {
        const b = Object.assign(document.createElement("button"), { type: "button", className: "page-turn", hidden: true });
        b.innerHTML = `<svg viewBox="-8 -8 16 16" aria-hidden="true"><path d="${d}"/></svg>`;
        b.addEventListener("click", () => setPage(page + step));
        return b;
      };
      const back = turn(-1, "M 2 -5 L -3 0 L 2 5"), ahead = turn(1, "M -2 -5 L 3 0 L -2 5");
      caption.append(back, captionText, ahead);

      // The level control: the greys (each 2 units tall, so level s is at y = s + 1: on a grey for even
      // levels, between two for odd ones) and, beside them, the double cone with the current slice. The
      // cone runs as the levels do, from the middle of A (y = 1) to the middle of P (y = 2N - 1).
      const CX = 5.5, W = 2.8; // the cone's axis and half-width
      const girth = (y) => Math.max(0, Math.min(y - 1, 2 * N - 1 - y)) / (N - 1); // its radius at y, 1 at the equator
      const halfWidth = (y) => W * girth(y);
      const control = svgEl("svg", {
        class: "ostwald-levels", viewBox: `-1.2 -0.6 9.8 ${2 * N + 1.2}`, role: "slider", tabindex: "0",
        "aria-label": "Level, from white to black", "aria-orientation": "vertical", "aria-valuemin": 0, "aria-valuemax": TOP,
      });
      for (let k = 0; k < N; k++) {
        control.append(svgEl("rect", { x: 0, y: 2 * k, width: 1.8, height: 2, fill: cell(null, k, k).css }));
        const letter = svgEl("text", { x: 0.9, y: 2 * k + 1, "font-size": 0.9, "text-anchor": "middle", "dominant-baseline": "central", fill: k < 6 ? "rgb(0 0 0 / 0.6)" : "rgb(255 255 255 / 0.75)" });
        letter.textContent = LETTERS[k];
        control.append(letter);
      }
      // In 3D: what the cut leaves, coloured as the solid, in the system's own colours. Its section through
      // the axis, facing as the view does (the hue on the solid's right on the right: a page of Wada's
      // Figure 2 on each side of the greys), and the cut face, the disc of the level, in the slice's
      // ellipse: seen from above, or from below when cut from the bottom. The cone runs through the
      // outermost cells' middles, so those show their inner half, as in Ostwald's triangles. A ring is
      // W / (N - 1) wide; cell (s, r) spans levels s - 1 to s + 1 and rings r - 1 to r + 1.
      // In 2D, only the slice is painted, with its disc as the disc shows it (yellow at the back, red on
      // the right), and the level previewed under the pointer, in its ghost.
      const section = svgEl("g", { class: "section" });
      const keptPath = svgEl("path");
      const keptClip = svgEl("clipPath", { id: `${P}-kept` });
      keptClip.append(keptPath);
      let right = 6; // the sector on the solid's right, to the nearest
      const step = W / (N - 1);
      const paint = (group, points, css) => group.append(svgEl("path", { d: `M ${points.join(" L ")} Z`, fill: css, stroke: css }));
      // The disc of level s, at the section's scale, trimmed to its ellipse: seen from above, or from
      // below (up = -1: its near side at the top, mirrored), with sector `rightmost` on the right.
      const face = (s, up, rightmost) => {
        const y = s + 1, hw = halfWidth(y);
        if (!hw) return;
        const ry = 0.3 * hw; // its near half hides the axis; over its far half, the axis is in front, rim and all
        hidden.push(up > 0 ? [y, y + ry] : [y - ry, y]);
        front.push(up > 0 ? [y - ry - pad, y] : [y, y + ry + pad]);
        const clip = svgEl("clipPath", { id: `${P}-face-${section.children.length}` });
        clip.append(svgEl("ellipse", { cx: CX, cy: y, rx: hw, ry: hw * 0.3 }));
        const group = svgEl("g", { "clip-path": `url(#${clip.id})` });
        const facing = rightmost * 15 + 90; // the view's direction, clockwise from north
        const at = (rings, deg) => {
          const t = ((deg - facing) * Math.PI) / 180;
          return `${CX - rings * step * Math.sin(t)} ${y + up * 0.3 * rings * step * Math.cos(t)}`;
        };
        const arc = (rings, d0, d1, n = 3) => Array.from({ length: n + 1 }, (_, i) => at(rings, d0 + ((d1 - d0) * i) / n));
        for (let r = s % 2; r <= Math.min(s, TOP - s); r += 2) {
          const a = (s + r) / 2, b = (s - r) / 2;
          if (r === 0) { paint(group, arc(1, 0, 360, 24), cell(null, a, b).css); continue; }
          for (let k = 0; k < 24; k++) paint(group, [...arc(r + 1, k * 15 - 7.5, k * 15 + 7.5), ...arc(Math.max(0, r - 1), k * 15 + 7.5, k * 15 - 7.5)], cell(k, a, b).css);
        }
        section.append(clip, group);
      };
      // The axis, under the colours (faint through them), and hidden behind each painted disc from its
      // middle to its near edge (below the middle seen from above, above it seen from below), so that it
      // reads as passing through. Over the disc's far half it's in front, so that part (axisFront) is
      // drawn over the disc and the slice's outline.
      // `pad`: 2 px in the control's units, so that the part in front starts clear of the outline's stroke.
      const axis = svgEl("path", { class: "axis" }), axisFront = svgEl("path", { class: "axis" }), hidden = [], front = [];
      let pad = 0.2;
      // The parts of [from, to] outside `cuts`, as path segments along the axis.
      const outside = (from, to, cuts) => {
        let d = "";
        for (const [a, b] of [...cuts].sort((p, q) => p[0] - q[0])) {
          if (a > from) d += `M ${CX} ${from} V ${Math.min(a, to)} `;
          from = Math.max(from, b);
          if (from >= to) return d;
        }
        return `${d}M ${CX} ${from} V ${to} `;
      };
      const drawAxis = () => {
        axis.setAttribute("d", outside(1, 2 * N - 1, [...hidden, ...front]));
        axisFront.setAttribute("d", front.map(([a, b]) => outside(Math.max(1, a), Math.min(2 * N - 1, b), hidden)).join(""));
      };
      // `s`: the level shown (cut, in 3D); `chosen`: the slice's.
      const drawSection = (s, chosen) => {
        section.replaceChildren();
        hidden.length = front.length = 0;
        const px = control.getBoundingClientRect().height / (2 * N + 1.2);
        if (px) pad = 2 / px;
        if (control.dataset.mode !== "3d") {
          face(chosen, 1, 6);
          if (s !== chosen) face(s, 1, 6);
        } else cutSection(s);
        drawAxis();
      };
      const cutSection = (s) => {
        const below = cut === "bottom", y = s + 1, hw = halfWidth(y);
        // What the cut leaves of the cone: below it, or, cut from the bottom, above it.
        const pts = below
          ? [[CX, 1], ...(y > N ? [[CX + W, N]] : []), [CX + hw, y], [CX - hw, y], ...(y > N ? [[CX - W, N]] : [])]
          : [[CX - hw, y], [CX + hw, y], ...(y < N ? [[CX + W, N]] : []), [CX, 2 * N - 1], ...(y < N ? [[CX - W, N]] : [])];
        keptPath.setAttribute("d", `M ${pts.map((q) => q.join(" ")).join(" L ")} Z`);
        // The section: every cell on the kept side of the cut (the clip trims the rest).
        const cells = svgEl("g", { "clip-path": `url(#${P}-kept)` });
        for (let l = 0; l <= TOP; l++) {
          if (below ? l - 1 > s : l + 1 < s) continue;
          for (let r = l % 2; r <= Math.min(l, TOP - l); r += 2) {
            for (const side of r === 0 ? [0] : [1, -1]) {
              const x = (k) => CX + (side || 1) * k * step;
              const { css } = cell(side === 0 ? null : side > 0 ? right : (right + 12) % 24, (l + r) / 2, (l - r) / 2);
              paint(cells, [`${x(r - 1)} ${l + 1}`, `${x(r)} ${l}`, `${x(r + 1)} ${l + 1}`, `${x(r)} ${l + 2}`], css);
            }
          }
        }

      };
      control.append(
        svgEl("rect", { class: "strip", x: 0, y: 0, width: 1.8, height: 2 * N }),
        keptClip, axis, section,
        svgEl("ellipse", { class: "outline equator", cx: CX, cy: N, rx: W, ry: W * 0.3 }),
        svgEl("path", { class: "outline", d: `M ${CX} 1 L ${CX + W} ${N} L ${CX} ${2 * N - 1} L ${CX - W} ${N} Z` }),

      const ghost = svgEl("ellipse", { class: "ghost", cx: CX }); // the level under the pointer, previewed
      const marker = svgEl("line", { class: "marker", x1: 1.8 }); // from the greys to the slice
      const pointer = svgEl("path", { class: "pointer" });

      // 2D (the disc) or 3D (the whole solid, made when first asked for).
      const modes = Object.assign(document.createElement("div"), { className: "view-modes" });
      // The cells: every one a dot, Wada's colours' bigger; or, for the empty cells (none of Wada's colours
      // there), hidden; only a dot of the system's own colour; the cell, with that dot; or filled with it.
      // Each choice is drawn as a cell, a diamond as in the solid, dashed where the cell isn't drawn; every
      // cell a dot, as a dot, with smaller ones where the diamond's corners would be.
      const DIAMOND = `<path d="M 0 -6 L 6 0 L 0 6 L -6 0 Z"`;
      const EMPTY = [
        ["all", "Every cell a dot: Wada's colours bigger, the system's own in the empty cells", `<circle r="2.4"/>${[[0, -6], [6, 0], [0, 6], [-6, 0]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="0.9"/>`).join("")}`],
        ["hidden", "Empty cells hidden: only Wada's colours", `${DIAMOND} fill="none" stroke-dasharray="2.12 2.12"/>`],
        ["points", "Empty cells: only a dot of the system's own colour", `${DIAMOND} fill="none" stroke-dasharray="2.12 2.12"/><circle r="2.1"/>`],
        ["dots", "Empty cells: the cell, with a dot of the system's own colour", `${DIAMOND} fill="none"/><circle r="2.1"/>`],
        ["filled", "Empty cells filled with the system's own colour", `${DIAMOND}/>`],
      ];
      // In 3D, where the cut is from: the top (the lower part stays) or the bottom. Each choice is drawn
      // as the solid's outline, the part that stays filled.

        ["top", "Cut from the top: the lower part stays", `<path d="M -3.5 0 L 0 -7 L 3.5 0" fill="none" stroke-dasharray="1.8 1.6"/><path d="M -3.5 0 L 0 7 L 3.5 0 Z"/><path d="M -6.5 0 H 6.5"/>`],
        ["bottom", "Cut from the bottom: the upper part stays", `<path d="M -3.5 0 L 0 7 L 3.5 0" fill="none" stroke-dasharray="1.8 1.6"/><path d="M -3.5 0 L 0 -7 L 3.5 0 Z"/><path d="M -6.5 0 H 6.5"/>`],

      const hide = () => { highlight.removeAttribute("d"); panel.classList.remove("show"); solid?.unhover(); picker?.leave(); };

      const openCell = (own) => {
        const cmyk = ostwaldCMYK?.[own.code];

      };

          else showColour(c);
        };

        path.addEventListener("focus", show);
        path.addEventListener("pointerleave", hide);
        path.addEventListener("blur", hide);

        if (dot) cells.append(svgEl("circle", { class: "colour-dot", cx: dot.x, cy: dot.y, r: dot.r, fill: c.css }));
      };
      // An empty cell, outlined, with a dot of the system's own colour in the middle (at x, y); or the dot
      // alone, filled with that colour, or hidden, as the empty-cells switch says (the CSS does that).
      // Hovering it shows that colour in the panel; clicking it, its card. A touch leaves the cell as the
      // finger lifts, so its info stays until the next touch.

        path.addEventListener("pointerenter", (e) => {

          if (picker) picker.hover(picker.ostwald(own), e);

      });
      // For the picker: where each of Wada's colours on the slice shown is (its dot's centre, or its piece

      // of the cell it falls in (an Ostwald colour's own; another's, by its notation).
      const placed = new Map();
      const badges = svgEl("g", { class: "pick-marks" });
      if (picker) svg.append(badges);

      const drawNumbers = () => {
        if (!picker) return;

        numbered.forEach((c, i) => {
          let at = null;

          } else {
            const { sector, level: s, ring: r } = c.ostwald ?? notation(c.oklch);
            if (disc.dataset.slicing === "pages") {

      };

      // A cell: ring r of a sector (24 of 15°, sector 0 at the top, clockwise), its piece k of m.

      const cellPath = (sector, r, k = 0, m = 1) => {

      };
      const centre = (k, m) => {
        const r = 1 / N;
        if (m === 1) return `M ${r} 0 A ${r} ${r} 0 1 0 ${-r} 0 A ${r} ${r} 0 1 0 ${r} 0 Z`;
        return ringSector(0, r, 90 - ((k + 1) * 360) / m, 90 - (k * 360) / m);
      };
      // An empty cell's dot on ring r: smaller near the centre, where the cells narrow.
      const emptyDot = (r) => (r === 0 ? 0.4 / N : Math.min(0.024, ((r === 1 ? 1.25 : r) / N) * 0.08));
      // Every cell a dot: Wada's colours in a cell of the disc, BIG times its empty dot, as big as fits.
      // Several share it in rows along the radius, by how far out each sits in the solid, each row
      // clockwise by hue: as many rows as gives the biggest dots (one row, round the circle, if no more
      // gives them a fiftieth bigger). Returns each colour's dot, and its piece of the cell, to hover:
      // the cell split halfway between the rows, and between the dots in a row.
      const discDots = (list, sector, r) => {
        const m = list.length, r0 = Math.max(0, (r - 1) / N), r1 = (r + 1) / N, rc = (r === 1 ? 1.25 : r) / N, mid = 90 - sector * 15;
        const counts = (rows) => Array.from({ length: rows }, (_, j) => Math.floor(m / rows) + (j >= rows - (m % rows) ? 1 : 0)); // the outer rows, wider, take any more
        const place = (rows) => (size) => { // the centres, row by row, as [distance, angle]

          gl.bufferData(gl.ARRAY_BUFFER, m[field]?.subarray(0, m.n * size) ?? new Uint8Array(4), gl.STATIC_DRAW);
          gl.enableVertexAttribArray(loc[name]);
          gl.vertexAttribPointer(loc[name], size, type, normalized, 0, 0);
        }
        if (m.ni) {
          gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
          gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, m.idx.subarray(0, m.ni), gl.STATIC_DRAW);
        }
        gl.bindVertexArray(null);
        return { vao, count: m.n, indices: m.ni };
      };
      const meshes = { faces: upload(faces), lines: upload(lines), points: upload(points) };
      // The lone dots' order, from the back, kept for the camera it was sorted for.
      const order = { idx: Uint16Array.from({ length: meshes.points.count }, (_, i) => i), d: new Float32Array(meshes.points.count), key: "" };
      gl.bindVertexArray(meshes.points.vao);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
      // The piece hovered: its outline, its positions alone (the rest is set for the whole draw).
      const hoverVao = gl.createVertexArray(), hoverBuffer = gl.createBuffer();
      gl.bindVertexArray(hoverVao);
      gl.bindBuffer(gl.ARRAY_BUFFER, hoverBuffer);
      gl.enableVertexAttribArray(loc.a_pos);
      gl.vertexAttribPointer(loc.a_pos, 3, gl.FLOAT, false, 0, 0);
      gl.bindVertexArray(null);

      // The page's colours: card a little darker than the background, its edges and lines darker still.
      const BG = wide.fromEncoded(cssRGB("--bg")), FG = wide.fromEncoded(cssRGB("--fg"));
      const tint = (t) => BG.map((v, i) => v + (FG[i] - v) * t);
      const CARD = tint(0.06), CARD_SIDE = tint(0.11), LINE = tint(0.2);

      // The camera: from the red side (hue 10°), so that yellow, most vivid near the top, is on the right,
      // and blue, near the middle, on the left; a little above. The cut is at `level`, from the top (`from`
      // 1: what's above is hidden) or the bottom (-1); at the end it comes from (white from the top, black
      // from the bottom), nothing is cut: the slice there is the tip.
      const DIST = 4.7, HALF = 13; // (as Ostwald's)
      let az = start?.az ?? 80, el = start?.el ?? 25, level = 0, from = 1, hovered = -1, emptyAs = 2, off = new Set(start?.off); // off: the pages hidden
      const camera = () => orbit(az, el, DIST, HALF, canvas.width / canvas.height);
      const cutLevel = () => (from > 0 ? (level === 0 ? -1 : level) : level === TOP ? TOP + 1 : level);
      const cutY = () => yOf(lightOf(cutLevel()));

      // Round the solid, a button per page, which hides or shows it: the hue's name where it has one, else a
      // dot of its most vivid colour. Each by its page's furthest still shown, following it (those behind
      // fainter; a dot hidden behind the solid).
      const labels = pages.map(({ s }) => {
        const name = NAMED.find(([h]) => Math.floor(h / SLICE) === s)?.[1], what = name ? `${name}, ${pageName(s)}` : `Hue ${pageName(s)}`;
        const b = Object.assign(document.createElement("button"), { type: "button", className: `solid-label${name ? "" : " solid-dot"}` });
        if (name) b.textContent = name;
        else b.style.setProperty("--hue", vivid(s).css);
        const mark = () => {
          const shown = !off.has(s);
          b.setAttribute("aria-pressed", shown);
          b.setAttribute("aria-label", `Page: ${what}`);
          b.title = `${what}: ${shown ? "hide" : "show"} its page`;
        };
        b.addEventListener("click", () => { if (!off.delete(s)) off.add(s); mark(); request(); });
        mark();
        return b;
      });
      let anchors = [], anchorsFor = "";
      const labelAnchors = () => {
        const key = `${cutLevel()} ${from}`;
        if (key === anchorsFor) return anchors;
        anchorsFor = key;
        const L = lightOf(cutLevel());
        anchors = pages.map(({ h, t }) => {
          let best = 0, row = 0;
          for (let k = 0; k <= 512; k++) if ((k / 512 - L) * from <= 1e-9 && t[k] > best) [best, row] = [t[k], k / 512];
          return best > inner ? at(best + 0.1, h, yOf(row)) : null;
        });
        return anchors;
      };
      // Whether the solid stands between the eye and p: within a page's edge, on the side of the cut shown,
      // sampled along the line where it can be.
      const behind = (p, eye) => {
        const y0 = cutY();
        for (let i = 0; i < 64; i++) {
          const t = 0.6 + (0.4 * i) / 64, x = eye[0] + (p[0] - eye[0]) * t, y = eye[1] + (p[1] - eye[1]) * t, z = eye[2] + (p[2] - eye[2]) * t;
          const q = y / PAGE_Y + 0.5, h = ((Math.atan2(-z, x) * 180) / Math.PI + 360) % 360;
          if (q > 0 && q < 1 && (y - y0) * from < 0 && Math.hypot(x, z) < pages[Math.floor(h / SLICE) % PAGES].e(q)) return true;
        }
        return false;
      };
      const placeLabels = ({ mvp, eye }) => {
        const spots = labelAnchors(), toward = Math.hypot(eye[0], eye[2]) || 1;
        labels.forEach((label, s) => {
          const p = spots[s];
          label.style.visibility = p ? "" : "hidden";
          if (!p) return;
          const [x, y, z] = p, w = mvp[3] * x + mvp[7] * y + mvp[11] * z + mvp[15];
          label.style.left = `${(((mvp[0] * x + mvp[4] * y + mvp[8] * z + mvp[12]) / w + 1) / 2) * 100}%`;
          label.style.top = `${((1 - (mvp[1] * x + mvp[5] * y + mvp[9] * z + mvp[13]) / w) / 2) * 100}%`;
          const facing = (x * eye[0] + z * eye[2]) / (Math.hypot(x, z) * toward);
          label.style.opacity = facing < -0.2 && Math.abs(el) < 60 ? 0.35 : 1;
          if (label.classList.contains("solid-dot") && behind(p, eye)) label.style.visibility = "hidden";
        });
      };

      // Drawing, on screen or, for picking, one pixel of ids off screen.
      let W = 0, H = 0, frame = 0;
      const pick = { fb: gl.createFramebuffer(), tex: gl.createTexture(), depth: gl.createRenderbuffer() };
      const resize = () => {
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
        if (!w || !h || (w === W && h === H)) return;
        W = canvas.width = w;
        H = canvas.height = h;
        gl.bindTexture(gl.TEXTURE_2D, pick.tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.bindRenderbuffer(gl.RENDERBUFFER, pick.depth);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, W, H);
        gl.bindFramebuffer(gl.FRAMEBUFFER, pick.fb);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, pick.tex, 0);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, pick.depth);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      };
      const draw = (px = -1, py = -1) => {
        resize();
        if (!W) return -1;
        const picking = px >= 0, cam = camera();
        gl.bindFramebuffer(gl.FRAMEBUFFER, picking ? pick.fb : null);
        gl.viewport(0, 0, W, H);
        if (picking) { gl.enable(gl.SCISSOR_TEST); gl.scissor(px, py, 1, 1); }
        gl.clearColor(0, 0, 0, 0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.useProgram(program);
        gl.uniformMatrix4fv(u.u_mvp, false, cam.mvp);
        const cutAt = cutLevel();
        let offLow = 0, offHigh = 0;
        for (const s of off) if (s < 32) offLow |= 1 << s; else offHigh |= 1 << (s - 32);
        gl.uniform1f(u.u_cut, cutAt);
        gl.uniform1f(u.u_from, from);
        gl.uniform1i(u.u_empty, emptyAs);
        gl.uniform2i(u.u_off, offLow, offHigh);
        gl.uniform1f(u.u_px, H / 2 / Math.tan(rad(HALF)));
        gl.uniform1f(u.u_dpr, W / canvas.clientWidth);
        gl.uniform1i(u.u_round, 0);
        gl.uniform1i(u.u_hi, 0);
        gl.uniform1f(u.u_cutY, cutY());
        gl.uniform3fv(u.u_card, CARD);
        gl.uniform3fv(u.u_cardSide, CARD_SIDE);
        gl.uniform1i(u.u_mode, picking ? 1 : 0);
        gl.enable(gl.POLYGON_OFFSET_FILL); // faces a little behind their outlines
        gl.polygonOffset(1, 1);
        gl.bindVertexArray(meshes.faces.vao);
        gl.drawElements(gl.TRIANGLES, meshes.faces.indices, gl.UNSIGNED_INT, 0);
        gl.disable(gl.POLYGON_OFFSET_FILL);
        if (emptyAs === 1 || emptyAs === 4) { // the lone dots, from the back, so that each one's smoothed edge lies over what's behind it
          gl.bindVertexArray(meshes.points.vao);
          const key = `${az} ${el}`;
          if (key !== order.key) {
            order.key = key;
            const e = cam.eye;
            for (let i = 0; i < order.d.length; i++) order.d[i] = (points.pos[3 * i] - e[0]) ** 2 + (points.pos[3 * i + 1] - e[1]) ** 2 + (points.pos[3 * i + 2] - e[2]) ** 2;
            order.idx.sort((i, j) => order.d[j] - order.d[i]);
            gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, order.idx, gl.DYNAMIC_DRAW);
          }
          gl.uniform1i(u.u_round, 1);
          if (!picking) { gl.enable(gl.BLEND); gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA); }
          gl.drawElements(gl.POINTS, order.idx.length, gl.UNSIGNED_SHORT, 0);
          gl.disable(gl.BLEND);
          gl.uniform1i(u.u_round, 0);
        }
        let id = -1;
        if (picking) {
          const got = new Uint8Array(4);
          gl.readPixels(px, py, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, got);
          id = got[0] + got[1] * 256 + got[2] * 65536 - 1;
          gl.disable(gl.SCISSOR_TEST);
        } else {
          gl.uniform1i(u.u_mode, 2);
          gl.uniform3fv(u.u_line, LINE);
          gl.bindVertexArray(meshes.lines.vao);
          gl.drawElements(gl.LINES, meshes.lines.indices, gl.UNSIGNED_INT, 0);
          // The piece under the pointer, outlined through everything in front of it; with the empty cells
          // only dots, an empty cell's dot itself, bigger, on top, ringed; with every cell a dot, any dot.
          if (hovered >= 0) {
            gl.disable(gl.DEPTH_TEST);
            gl.uniform3fv(u.u_line, FG);
            const spot = emptyAs === 1 ? lone.get(hovered) : emptyAs === 4 ? lone.get(hovered) ?? spots.get(hovered) : undefined;
            if (spot !== undefined) {
              gl.uniform1i(u.u_mode, 0);
              gl.uniform1i(u.u_round, 1);
              gl.uniform1i(u.u_hi, 1);
              gl.enable(gl.BLEND);
              gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
              gl.bindVertexArray(meshes.points.vao);
              gl.drawArrays(gl.POINTS, spot, 1);
              gl.disable(gl.BLEND);
              gl.uniform1i(u.u_round, 0);
              gl.uniform1i(u.u_hi, 0);
            } else {
              const t = targets[hovered], [body, cap] = (t.lines ??= t.outline().map((list) => new Float32Array(list.flat())));
              gl.bindVertexArray(hoverVao);
              gl.bindBuffer(gl.ARRAY_BUFFER, hoverBuffer);
              gl.bufferData(gl.ARRAY_BUFFER, body.byteLength + cap.byteLength, gl.STREAM_DRAW);
              gl.bufferSubData(gl.ARRAY_BUFFER, 0, body);
              gl.bufferSubData(gl.ARRAY_BUFFER, body.byteLength, cap);
              gl.vertexAttrib1f(loc.a_id, hovered);
              gl.vertexAttrib1f(loc.a_page, POLE);
              gl.vertexAttrib4f(loc.a_extra, 0, 0, 0, 0);
              gl.vertexAttrib4f(loc.a_col, 0, 0, 0, 1);
              for (const [kind, first, count] of [[BODY, 0, body.length / 3], [CAP, body.length / 3, cap.length / 3]]) {
                gl.vertexAttrib4f(loc.a_info, t.level, kind, 0, ALWAYS);
                if (count) gl.drawArrays(gl.LINES, first, count);
              }
            }
          }
          placeLabels(cam);
        }
        gl.bindVertexArray(null);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        return id;
      };
      const request = () => { if (!frame) frame = requestAnimationFrame(() => { frame = 0; draw(); }); };
      new ResizeObserver(request).observe(canvas);
      const idAt = (e) => {
        const r = canvas.getBoundingClientRect();
        const x = Math.floor(((e.clientX - r.left) / r.width) * W), y = H - 1 - Math.floor(((e.clientY - r.top) / r.height) * H);
        return x >= 0 && y >= 0 && x < W && y < H ? draw(x, y) : -1;
      };
      const hover = (id) => {
        if (id === hovered) return;
        hovered = id;
        const t = targets[id];
        if (t?.colour) onColour(t.colour);
        else if (t?.cell) onCell(t.cell);
        else onLeave();
        hovered = id; // onLeave unhovers
        request();
      };

      // Turning: drag (a press that hardly moves is a click), or the arrow keys (orbitInput). Hovering picks
      // once a frame.
      let swing = 0;
      const turn = (dAz, dEl) => {
        cancelAnimationFrame(swing);
        az = (((az + dAz) % 360) + 360) % 360;
        el = Math.min(90, Math.max(-90, el + dEl));
        request();
      };
      // Turns the camera, in 0.4 s, to the height `to`.
      const swingTo = (to) => {
        cancelAnimationFrame(swing);
        const start = performance.now(), el0 = el;
        const step = (now) => {
          const t = Math.min(1, (now - start) / 400);
          el = el0 + (to - el0) * t * t * (3 - 2 * t);
          draw();
          if (t < 1) swing = requestAnimationFrame(step);
        };
        swing = requestAnimationFrame(step);
      };
      orbitInput(canvas, {
        turn,
        hover: (e) => hover(e ? idAt(e) : -1),
        tap: (e) => {
          const t = targets[idAt(e)];
          if (t?.colour) onOpen(t.colour);
          else if (t?.cell) onOpenCell(t.cell);
        },
      });

      return {
        canvas, labels,
        cut: (i) => { level = i; request(); },
        // From the top or the bottom; the camera turns to the cut's side if it isn't there (at once, or in a swing).
        side: (where, animate) => {
          from = where === "bottom" ? -1 : 1;
          if (el * from < 15) {
            const to = from * Math.max(25, Math.abs(el));
            if (animate) swingTo(to); else el = to;
          }
          request();
        },
        empty: (how) => { emptyAs = ["hidden", "points", "dots", "filled", "all"].indexOf(how); request(); }, // how the cells show
        unhover: () => { if (hovered >= 0) { hovered = -1; request(); } },
        state: () => ({ az, el, off: [...off] }),
        dispose: () => gl.getExtension("WEBGL_lose_context")?.loseContext(), // its GPU memory, at once
      };
    }

    // CMYK for a colour that isn't one of Wada's, estimated as scripts/ostwald_cmyk.py does for the Ostwald
    // view's empty cells: OKLCH -> CIE Lab (D50) -> CMYK through the colorimetric table (B2A1) of the print
    // profile Wada's CMYK is read through (Japan Color 2011 Coated), interpolated trilinearly, as
    // LittleCMS does for Lab. Only that table is fetched, as a byte range of the profile (340 KB of its
    // 1.9 MB), once, when first asked for; until it's in (or if it can't be had), estimateCMYK gives null.
    function loadPrintTable() {
      printLoading ??= (async () => {
        const PROFILE = "profiles/JapanColor2011Coated.icc", B2A1 = 0x42324131, MFT2 = 0x6d667432;
        let whole = null; // a server that ignores ranges sends the whole profile: the table is then in it
        const bytes = async (start, end) => {
          if (!whole) {
            const r = await fetch(PROFILE, { headers: { Range: `bytes=${start}-${end - 1}` } });
            if (!r.ok) throw new Error(`${PROFILE}: ${r.status}`);
            const got = await r.arrayBuffer();
            if (r.status === 206) return new DataView(got);
            whole = got;
          }
          return new DataView(whole, start, end - start);
        };
        // The tag table: per tag, its signature, offset and size.
        const head = await bytes(0, 4096), tags = head.getUint32(128);
        let tag = null;
        for (let i = 0; i < tags && !tag; i++) {
          const at = 132 + 12 * i, offset = head.getUint32(at + 4);
          if (head.getUint32(at) === B2A1) tag = await bytes(offset, offset + head.getUint32(at + 8));
        }
        if (!tag || tag.getUint32(0) !== MFT2 || tag.getUint8(8) !== 3 || tag.getUint8(9) !== 4) throw new Error("no 16-bit Lab -> CMYK table");
        // A lut16Type: input curves, the grid (first input slowest), output curves; 0..65535 as 0..1.
        const grid = tag.getUint8(10), inSize = tag.getUint16(48), outSize = tag.getUint16(50);
        let pos = 52;
        const read = (n) => {
          const values = new Float64Array(n);
          for (let k = 0; k < n; k++, pos += 2) values[k] = tag.getUint16(pos) / 65535;
          return values;
        };
        const inCurves = [read(inSize), read(inSize), read(inSize)], clut = read(grid ** 3 * 4);
        printTable = { grid, inCurves, clut, outCurves: [read(outSize), read(outSize), read(outSize), read(outSize)] };
      })().catch(() => {}); // no estimates, then: the panel says the colour isn't in Wada's palette
      return printLoading;
    }

    // CMYK in percent for [L, C, h], or null while the table isn't in.
    function estimateCMYK([L, C, h]) {
      if (!printTable) return null;
      const { grid, inCurves, clut, outCurves } = printTable;
      const curve = (table, x) => { // piecewise linear, x in 0..1
        const p = Math.min(Math.max(x, 0), 1) * (table.length - 1), i = Math.min(p | 0, table.length - 2);
        return table[i] + (table[i + 1] - table[i]) * (p - i);
      };
      const [l, a, b] = oklchToLab(L, C, h);
      // ICC v2's 16-bit Lab: L 0..100 as 0..0xFF00; a and b 0 as 0x8000.
      const x = [(l * 652.8) / 65535, ((a + 128) * 256) / 65535, ((b + 128) * 256) / 65535].map((v, k) => curve(inCurves[k], v));
      const g = grid - 1, lo = [], frac = [];
      for (const v of x) {
        const p = Math.min(Math.max(v, 0), 1) * g, i = Math.min(p | 0, g - 1);
        lo.push(i);
        frac.push(p - i);
      }
      const y = [0, 0, 0, 0];
      for (let corner = 0; corner < 8; corner++) { // the cube's 8 nodes round it, each by its nearness
        let w = 1, node = 0;
        for (let k = 0; k < 3; k++) {
          const up = (corner >> k) & 1;
          w *= up ? frac[k] : 1 - frac[k];
          node = node * grid + lo[k] + up;
        }
        if (w) for (let o = 0; o < 4; o++) y[o] += w * clut[node * 4 + o];
      }
      return y.map((v, o) => Math.round(100 * curve(outCurves[o], v)));
    }

    // OKLCH -> CIE Lab (D50): the inverse of scripts/cmyk_to_oklch.py's maths (CSS Color 4's), with its
    // matrices inverted as scripts/ostwald_cmyk.py does.
    function oklchToLab(L, C, h) {
      const D65_TO_D50 = [[1.0479297925449969, 0.02294687060160972, -0.05019226628920526], [0.029627808770055802, 0.99043442675388, -0.017073799063418812], [-0.009243040646204523, 0.015055191490298147, 0.7518742814281371]];
      const D50 = [0.9642956764295677, 1, 0.8251046025104602]; // the white
      const [X, Y, Z] = Array.from(times3(D65_TO_D50, xyzOf([L, C, h])), (v, k) => v / D50[k]);
      const f = (t) => (t > 216 / 24389 ? t ** (1 / 3) : ((24389 / 27) * t + 16) / 116);
      return [116 * f(Y) - 16, 500 * (f(X) - f(Y)), 200 * (f(Y) - f(Z))];
    }
  </script>
