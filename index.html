        const path = document.createElementNS(NS, "path");
        path.classList.add(name);
        return path;
      };
      const shape = overlay("shape"), marks = overlay("marks"), highlight = overlay("highlight");
      const segments = new Map(); // colour -> its path, outline, and (if not grey) hue angle and centre
      const pt = polarPoint, arc = ringSector;

      const segment = (c, d, angle, centre) => {
        const path = document.createElementNS(NS, "path");
        segments.set(c, { path, d, angle, centre });
        path.classList.add("segment");
        path.setAttribute("d", d);
        path.setAttribute("fill", c.css);
        path.setAttribute("tabindex", "0");
        path.setAttribute("role", "button");
        path.setAttribute("aria-label", c.name);
        const show = () => {
          highlight.setAttribute("d", d);
          fillDetails(panel, c);
          panel.classList.add("show");
        };
        const hide = () => { highlight.removeAttribute("d"); panel.classList.remove("show"); };
        path.addEventListener("pointerenter", show);
        path.addEventListener("focus", show);
        path.addEventListener("pointerleave", hide);
        path.addEventListener("blur", hide);
        path.addEventListener("click", () => showDetail(c));
        path.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); showDetail(c); }
        });
        svg.append(path);
      };

      const chromatic = colors.filter((c) => c.oklch[1] >= NEUTRAL_C);
      const greys = colors.filter((c) => c.oklch[1] < NEUTRAL_C);
      const lo = Math.sqrt(NEUTRAL_C), hi = Math.sqrt(Math.max(...chromatic.map((c) => c.oklch[1])));
      const bandWidth = (RING[1] - RING[0]) / BANDS;

      // Background: the continuous wheel on the same mapping, faded, repainted when the size changes.
      const canvas = wheel.querySelector(".wheel-bg");
      new ResizeObserver(() => paintWheel(canvas, RING, lo, hi)).observe(canvas);

      const cells = new Map();
      for (const c of chromatic) {
        const s = Math.floor(c.oklch[2] / SLICE);
        const b = Math.min(Math.floor(((Math.sqrt(c.oklch[1]) - lo) / (hi - lo)) * BANDS), BANDS - 1);
        const key = `${s},${b}`;
        if (!cells.has(key)) cells.set(key, { s, b, list: [] });
        cells.get(key).list.push(c);
      }
      for (const { s, b, list } of cells.values()) {
        list.sort((x, y) => x.oklch[2] - y.oklch[2]);
        const r0 = RING[0] + b * bandWidth, w = SLICE / list.length;
        list.forEach((c, k) => {
          const d0 = s * SLICE + k * w, mid = d0 + w / 2;
          segment(c, arc(r0, r0 + bandWidth, d0, d0 + w), mid, pt(r0 + bandWidth / 2, mid));
        });
      }
      greys.sort((a, b) => b.oklch[0] - a.oklch[0]);
      const step = 360 / greys.length;
      greys.forEach((c, k) => segment(c, arc(GREYS[0], GREYS[1], k * step, (k + 1) * step)));
      svg.append(shape, marks, highlight);

      // A combination's colours: the others faded, its own outlined, joined in hue order.
      const mark = (list) => {
        wheel.classList.toggle("marking", list.length > 0);
        for (const [c, { path }] of segments) path.classList.toggle("marked", list.includes(c));
        marks.setAttribute("d", list.map((c) => segments.get(c).d).join(" "));
        const points = list.map((c) => segments.get(c)).filter((s) => s.centre).sort((a, b) => a.angle - b.angle).map((s) => s.centre);
        if (points.length < 2) shape.removeAttribute("d");
        else shape.setAttribute("d", `M ${points.join(" L ")}${points.length > 2 ? " Z" : ""}`);
      };
      return { panel, wheel, mark };
    }

    // Paints the continuous wheel: at each pixel, hue from the angle and chroma from the radius (same
    // mapping as the segments), at that hue's most vivid lightness, limited to what sRGB can show.
    // Only repaints when the size changes: a hidden canvas keeps its picture.
    function paintWheel(canvas, [R0, R1], lo, hi) {
      const size = Math.round(canvas.clientWidth * Math.min(devicePixelRatio, 1.5));
      if (!size || (size === canvas.width && canvas.dataset.painted)) return; // hidden, or already painted
      canvas.width = canvas.height = size;
      canvas.dataset.painted = "1";
      const ctx = canvas.getContext("2d");
      const img = ctx.createImageData(size, size), px = img.data;
      const unit = 2.04 / size; // matches the SVG viewBox
      const { L: cuspL, C: cuspC } = cuspTable();
      const rgb = new Float64Array(3);
      const encode = (v) => SRGB_ENCODE[v <= 0 ? 0 : v >= 1 ? 4095 : (v * 4095 + 0.5) | 0];
      for (let j = 0; j < size; j++) {
        const y = (j + 0.5) * unit - 1.02;
        for (let i = 0; i < size; i++) {
          const x = (i + 0.5) * unit - 1.02, r = Math.sqrt(x * x + y * y);
          const alpha = Math.min(1, (r - R0) / unit, (R1 - r) / unit); // antialiased edges
          if (alpha <= 0) continue;
          // Hue in half-degree steps, interpolated between the table's entries.
          const k = ((Math.atan2(-y, x) * 360) / Math.PI + 720) % 720, k0 = k | 0, t = k - k0;
          const L = cuspL[k0] + (cuspL[k0 + 1] - cuspL[k0]) * t;
          const c = lo + ((r - R0) / (R1 - R0)) * (hi - lo);
          const C = Math.min(c * c, cuspC[k0] + (cuspC[k0 + 1] - cuspC[k0]) * t);
          oklabToLinearSRGB(L, (C * x) / r, (-C * y) / r, rgb); // a = C cos h, b = C sin h
          const o = (j * size + i) * 4;
          px[o] = encode(rgb[0]);
          px[o + 1] = encode(rgb[1]);
          px[o + 2] = encode(rgb[2]);
          px[o + 3] = 255 * alpha;
        }
      }
      ctx.putImageData(img, 0, 0);
    }

    // SVG point at distance r and angle deg: 0° to the right, increasing counter-clockwise.
    function polarPoint(r, deg) {
      const a = (deg * Math.PI) / 180;
      return `${(r * Math.cos(a)).toFixed(5)} ${(-r * Math.sin(a)).toFixed(5)}`;
    }

    // SVG path of the ring between radii r0 and r1, from angle d0 to d1 (as polarPoint).
    function ringSector(r0, r1, d0, d1) {
      const large = d1 - d0 > 180 ? 1 : 0;
      return `M ${polarPoint(r1, d0)} A ${r1} ${r1} 0 ${large} 0 ${polarPoint(r1, d1)} L ${polarPoint(r0, d1)} A ${r0} ${r0} 0 ${large} 1 ${polarPoint(r0, d0)} Z`;
    }

    // Ostwald layout, with every cell a dot (BIG and DOT_GAP are set at the top, as the layout is made
    // before the script gets here): Wada's colours' dots are BIG times the empty cells'. Several in one
    // cell are all one size, their centres DOT_GAP radii apart and each DOT_GAP / 2 radii clear of the
    // cell's edge, as big as fits.
    // m centres on a line, DOT_GAP radii apart (radius r), about 0.
    function along(m, r) {
      return Array.from({ length: m }, (_, k) => (k - (m - 1) / 2) * DOT_GAP * r);
    }
    // The largest radius, up to `most`, at which the centres `place(r)` all fit, by halving. `fits(p, h)`:
    // whether a disc of radius h round p is within the cell.
    function fitDots(most, place, fits) {
      const ok = (r) => place(r).every((p) => fits(p, (DOT_GAP / 2) * r));
      if (ok(most)) return most;
      let lo = 0, hi = most;
      for (let i = 0; i < 30; i++) {
        const mid = (lo + hi) / 2;
        if (ok(mid)) lo = mid; else hi = mid;
      }
      return lo;
    }
    // How far a point (dx, dy from its middle) is in from the edge of a diamond, A wide and B tall each way.
    function inDiamond(dx, dy, A, B) {
      return ((1 - Math.abs(dx) / A - Math.abs(dy) / B) * A * B) / Math.hypot(A, B);
    }
    // One of Wada's colours' white, as a share of white and colour: the less, the further from the axis it
    // sits in its cell (a ring is a step of the log of it).
    function paleness(c) {
      return c.ostwald.white / (1 - c.ostwald.black);
    }

    // Ostwald's colour system, as Wada set it out (1935 supplement, pp. 8–14): every colour is a mixture
    // of full colour, white and black adding up to 1, as on Ostwald's spinning discs. Wada's grey scale
    // has 16 letters, A (white, 89% white) to P (black, 3.5% white) with J included (his Figure 2), evenly
    // spaced on a log scale so the steps look even. Ostwald's own scale skips J. A colour is written as
    // its hue, on a circle of 100 steps from yellow (0) through red (25), ultramarine (50) and sea green
    // (75) (his Figure 1), then two letters: the first gives its white content, the second its black (1
    // minus that grey's white). Wada's orange is 16PA.
    // Places each colour (c.ostwald: hue n, sector of the 24 hues, white and black content, notation, and
    // level and ring in the solid) and returns the system's constants and cell(sector, a, b), the system's
    // own colour in any of its cells. notes/ostwald.py does the same and checks it.
    function ostwaldSystem(colors) {
      const LETTERS = "ABCDEFGHIJKLMNOP";
      const GREYS = Array.from(LETTERS, (_, k) => 0.891 * (0.0355 / 0.891) ** (k / 15)); // white content
      const HUES = [[0, "Yellow"], [12.5, "Orange"], [25, "Red"], [37.5, "Purple"], [50, "Ultramarine"], [62.5, "Turquoise"], [75, "Sea green"], [87.5, "Leaf green"]];
      const mod = (x, m) => ((x % m) + m) % m;
      // The hue of an additive mixture (red 0°, yellow 60°, green 120°, ...): complements are 180° apart.
      const hexHue = (r, g, b) => {
        const hi = Math.max(r, g, b), d = hi - Math.min(r, g, b);
        if (d === 0) return null;
        if (hi === r) return 60 * mod((g - b) / d, 6);
        return hi === g ? 60 * ((b - r) / d + 2) : 60 * ((r - g) / d + 4);
      };
      // The nearest grey, on a log scale.
      const step = (v) => {
        const at = (k) => Math.abs(Math.log(Math.max(v, 1e-3) / GREYS[k]));
        let best = 0;
        for (let k = 1; k < GREYS.length; k++) if (at(k) < at(best)) best = k;
        return best;
      };
      // The full colour of hexagonal hue h, in linear sRGB: HSV with saturation and value 1.
      const fullRGB = (h) => [5, 3, 1].map((k) => { const t = mod(k + h / 60, 6); return 1 - Math.max(0, Math.min(t, 4 - t, 1)); });
      const oklab = ([r, g, b]) => { // Ottosson's matrices
        const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
        const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
        const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
        return [0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s, 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s];
      };
      // Ostwald's 100-step hue of hexagonal hue h, before calibration. He spaced his circle evenly to
      // the eye, with complements opposite. The full colour's OKLCH hue is even to the eye, but sRGB's
      // full colours aren't symmetrical in it: a full colour and its complement are up to 29° from
      // opposite. So the number takes the mean of the two, the complement's turned half round, and
      // complements stay exactly 50 steps apart. Ostwald's circle runs the other way round, a quarter
      // of it (25 steps) per 90°. notes/ostwald.py's hue_number does the same.
      const hueNumber = (h) => {
        const okHue = (rgb) => { const [, A, B] = oklab(rgb); return (Math.atan2(B, A) * 180) / Math.PI; };
        const h1 = okHue(fullRGB(h)), h2 = okHue(fullRGB(h + 180));
        return mod(-(h1 + (mod(h2 - h1, 360) - 180) / 2) / 3.6, 100);
      };
      const raw = colors.map((c) => {
        const [L, C, h] = c.oklch, rad = (h * Math.PI) / 180;
        const [r, g, b] = Array.from(oklabToLinearSRGB(L, C * Math.cos(rad), C * Math.sin(rad)), (v) => Math.min(1, Math.max(0, v)));
        const hue = hexHue(r, g, b);
        return { n: hue === null ? null : hueNumber(hue), white: Math.min(r, g, b), black: 1 - Math.max(r, g, b) };
      });
      // Calibration: Wada's orange is 16PA (his 1935 supplement, p. 14).
      const offset = mod(16 - raw[colors.findIndex((c) => c.name === "Orange")].n, 100);
      // The full colours of the 24 hues (sector 0 is yellow): the hexagonal hue whose number is the
      // sector's, found by halving (the number falls as the hexagonal hue rises).
      const FULL = Array.from({ length: 24 }, (_, sector) => {
        const diff = (h) => mod(hueNumber(h) + offset - (sector * 100) / 24 + 50, 100) - 50;
        let lo = 0;
        while (lo < 359 && !(diff(lo) >= 0 && diff(lo + 1) < 0)) lo++;
        let hi = lo + 1;
        for (let i = 0; i < 50; i++) { const mid = (lo + hi) / 2; if (diff(mid) >= 0) lo = mid; else hi = mid; }
        return fullRGB((lo + hi) / 2);
      });
      colors.forEach((c, i) => {
        const { white, black } = raw[i];
        const a = step(white), b = step(1 - black); // a >= b, as white <= 1 - black
        const n = a === b ? null : mod(raw[i].n + offset, 100); // a === b: no colour at this precision, a grey
        c.ostwald = {
          n, sector: n === null ? null : Math.round((n * 24) / 100) % 24, // 0 is yellow, as in Wada's Figure 1
          white, black, level: a + b, ring: a - b,
          code: n === null ? LETTERS[a] : `${Math.round(n) % 100}${LETTERS[a]}${LETTERS[b]}`,
        };
      });
      // A cell's colour: white GREYS[a] plus colour (GREYS[b] - GREYS[a]) times the full colour of the
      // sector's hue. Returned as CSS and OKLCH (rounded as colors.json is), with its white and black
      // content and its code, the hue numbered as in Wada's Figure 1 (sector 1 is 4, sector 3 is 13).
      const encode = (v) => Math.round(255 * (v <= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055));
      const toOklch = (rgb) => {
        const [L, A, B] = oklab(rgb);
        const C = +Math.hypot(A, B).toFixed(4);
        const h = +mod((Math.atan2(B, A) * 180) / Math.PI, 360).toFixed(2);
        return [+L.toFixed(4), C, C === 0 || h === 360 ? 0 : h];
      };
      const cell = (sector, a, b) => {
        const w = GREYS[a], c = GREYS[b] - GREYS[a];
        const rgb = (sector === null ? [0, 0, 0] : FULL[sector]).map((v) => w + c * v), rgb8 = rgb.map(encode);
        return {
          css: `rgb(${rgb8.join(" ")})`, rgb8, oklch: toOklch(rgb), white: w, black: 1 - GREYS[b],
          code: a === b ? LETTERS[a] : `${Math.round((sector * 100) / 24) % 100}${LETTERS[a]}${LETTERS[b]}`,
        };
      };
      return { GREYS, LETTERS, HUES, cell, offset };
    }

    // Ostwald layout: one level of the double cone at a time, seen from above. Angle = hue (24 sectors,
    // yellow at the top, red at the right), distance from the centre = colour content in Wada's steps,
    // with the level's grey at the centre. Each of Wada's colours fills the cell of its rounded notation
    // (the info panel gives its exact values); colours sharing a cell split it in hue order, and empty
    // cells show a dot of the system's own colour (hovering one gives its code and values, with its CMYK
    // estimated, in the same panel, named "Ostwald" and its code); or, as the cells switch says, every
    // cell is a dot, Wada's colours' bigger. Beside it, the level control: the 16
    // greys, white at the top, and the solid's outline with the slice. Even levels have a grey at the
    // centre; odd ones fall between two greys, and the middle one, the widest, has the full colours at
    // its rim. Sliced through the axis instead, it shows two pages back to back (a hue's and its
    // complement's), with a dial in the control's place; or, in 3D, the whole solid.
    function makeOstwald(colors) {
      const { LETTERS, HUES, cell, offset } = ostwaldSystem(colors);
      // CMYK estimated for the empty cells through the print profile (scripts/ostwald_cmyk.py), if it
      // was made for this calibration.
      let estimates = null;
      fetch("ostwald-cmyk.json").then((r) => r.json()).then((d) => { if (Math.abs(d.offset - offset) < 1e-4) estimates = d.cmyk; }).catch(() => {});
      const N = LETTERS.length, TOP = 2 * (N - 1), MIDDLE = N - 1; // levels 0 (white) to TOP (black)
      const NS = "http://www.w3.org/2000/svg";
      const svgEl = (name, attrs = {}) => {
        const e = document.createElementNS(NS, name);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        return e;
      };
      const box = Object.assign(document.createElement("div"), { className: "ostwald-box" });
      const panel = Object.assign(document.createElement("aside"), { className: "wheel-panel" });
      panel.setAttribute("aria-live", "polite");
      panel.innerHTML = `<div class="detail-swatch"></div><h2></h2><p data-field="cmyk"></p><p data-field="oklch"></p>`
        + `<p data-field="ostwald"></p><p data-field="mix"></p>`;
      const layout = Object.assign(document.createElement("div"), { className: "ostwald" });
      const disc = Object.assign(document.createElement("div"), { className: "ostwald-disc" });
      const svg = svgEl("svg", { viewBox: "-1.45 -1.2 2.9 2.4", role: "group", "aria-label": "A level of Ostwald's colour solid" });
      const cells = svgEl("g");
      const rim = svgEl("circle", { class: "rim", r: 1 }); // the widest level's edge, for scale
      const highlight = svgEl("path", { class: "highlight" });
      svg.append(cells, rim, highlight);
      disc.append(svg);
      // The 8 main hues, named around the outside.
      for (const [n, name] of HUES) {
        const rad = ((90 - n * 3.6) * Math.PI) / 180, x = 1.06 * Math.cos(rad), y = -1.06 * Math.sin(rad);
        const label = Object.assign(document.createElement("span"), { className: "ostwald-label level-label", textContent: name });
        label.style.left = `${((x + 1.45) / 2.9) * 100}%`;
        label.style.top = `${((y + 1.2) / 2.4) * 100}%`;
        const side = Math.abs(x) < 0.05 ? 0 : Math.sign(x); // centred above or below, or to the right or left
        label.style.setProperty("--dx", ["-100%", "-50%", "0%"][side + 1]);
        label.style.setProperty("--align", ["right", "center", "left"][side + 1]);
