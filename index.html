<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wada Sanzo | A Dictionary of Color Combinations</title>
  <style>
    :root {
      --bg: #fafaf7;
      --fg: #1d1d1b;
      --muted: #6e6e68;
      --line: #e3e3dd;
      --info: 26ch; /* widest info line: OKLCH 0.5579 0.1582 357.38 */
    }
    /* DM Mono (SIL Open Font License, fonts/OFL.txt), from github.com/google/fonts/tree/main/ofl/dmmono.
       It has no bold: Medium (500) is the heaviest weight. */
    @font-face { font-family: "DM Mono"; src: url("fonts/DMMono-Regular.ttf") format("truetype"); font-weight: 400; }
    @font-face { font-family: "DM Mono"; src: url("fonts/DMMono-Medium.ttf") format("truetype"); font-weight: 500; }
    * { box-sizing: border-box; margin: 0; }
    [hidden] { display: none !important; }
    body { font-family: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--bg); color: var(--fg); }

    /* Header: the main navigation, plus a sub-navigation row with the current view's options. */
    header {
      position: sticky; top: 0; z-index: 3;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    nav {
      display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
      padding: 1rem 1.5rem;
    }
    nav strong { font-weight: 500; }
    nav span { color: var(--muted); }
    .views, .subnav { display: flex; gap: 1rem; }
    .subnav { justify-content: flex-end; padding: 0 1.5rem 1rem; font-size: 0.875rem; }
    .views a, .subnav button { color: var(--muted); text-decoration: none; }
    .subnav button { font: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    .views a[aria-current], .subnav button[aria-pressed="true"] {
      color: var(--fg); text-decoration: underline; text-underline-offset: 0.25em;
    }

    main { padding: 1.5rem; }
    #families-view { display: grid; gap: 1rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr));
      padding: 0;
      list-style: none;
    }
    .swatch {
      display: grid; place-items: center;
      width: 100%; aspect-ratio: 1;
      border: 0;
      background: var(--color);
      color: var(--ink);
      font: inherit; font-size: 0.8rem; font-variant-numeric: tabular-nums;
      cursor: pointer;
    }
    .swatch span {
      opacity: 0; transform: translateY(4px);
      transition: opacity 0.6s ease, transform 0.6s ease; /* fade out */
      white-space: pre; text-align: left; line-height: 1.35;
    }
    .swatch:hover span, .swatch:focus-visible span {
      opacity: 1; transform: none;
      transition-duration: 0.12s; /* fade in */
    }
    .swatch:focus-visible { outline: 2px solid var(--ink); outline-offset: -4px; }

    /* Rows layout: one full-width stripe per colour, edge to edge (cancels main's padding); the only
       space is the gap between families. */
    #families-view[data-show="rows"] { margin: -1.5rem; gap: 2rem; }
    [data-show="rows"] .grid { grid-template-columns: 1fr; }
    [data-show="rows"] .swatch { aspect-ratio: auto; height: 3.5rem; place-items: center start; padding: 0 1.5rem; }
    /* Hover text: grid squares show the CMYK values one per line; rows show name, CMYK and OKLCH on
       one line, in columns that line up from row to row (widest name: 22 characters, CMYK: 20). */
    .swatch .in-rows, [data-show="rows"] .swatch .in-grid { display: none; }
    [data-show="rows"] .swatch .in-rows { display: grid; grid-template-columns: 26ch 24ch auto; }

    /* Combinations, laid out as in the book: 2 colours side by side (6:5 each), 3 squares in a row,
       4 colours as a cross of 2:1 rectangles (top, left, right, bottom). The colours touch. */
    #combinations-view { display: grid; gap: 3rem; }
    .combos {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: 2rem 1.5rem;
      padding: 0; list-style: none;
    }
    .combo-number {
      display: inline-block; margin-bottom: 0.5rem;
      color: var(--muted); font-size: 0.8rem; text-decoration: none;
    }
    a.combo-number:hover, a.combo-number:focus-visible { color: var(--fg); text-decoration: underline; }
    .blocks { display: grid; grid-template-rows: 1fr; }
    .blocks[data-size="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); aspect-ratio: 12 / 5; }
    .blocks[data-size="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); aspect-ratio: 3 / 1; }
    [data-size="4"]:is(.blocks, .combo-info) {
      grid-template: ". top top ." auto "left left right right" auto ". bottom bottom ." auto
        / minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); /* columns never grow to fit a long name */
    }
    .blocks[data-size="4"] { grid-template-rows: 1fr 1fr 1fr; aspect-ratio: 4 / 3; }
    [data-size="4"]:is(.blocks, .combo-info) > :nth-child(1) { grid-area: top; }
    [data-size="4"]:is(.blocks, .combo-info) > :nth-child(2) { grid-area: left; }
    [data-size="4"]:is(.blocks, .combo-info) > :nth-child(3) { grid-area: right; }
    [data-size="4"]:is(.blocks, .combo-info) > :nth-child(4) { grid-area: bottom; }
    .blocks > * { background: var(--color); }
    .blocks .swatch { aspect-ratio: auto; height: 100%; padding: 0.5rem; }
    .blocks .swatch span { white-space: normal; text-align: center; } /* the colour name */
    /* Sub-navigation choice: only the combinations with that many colours. */
    [data-show="2"] .combos:not([data-size="2"]),
    [data-show="3"] .combos:not([data-size="3"]),
    [data-show="4"] .combos:not([data-size="4"]) { display: none; }

    /* One combination: the colours large, each colour's values under it (placed as in the book),
       then the combinations that share a colour with it. */
    #combination-view { display: grid; gap: 1.5rem; }
    #combination-view > .combo-number { margin: 0; }
    .combo-figure { width: min(100%, 48rem); }
    .combo-figure:has([data-size="4"]) { width: min(100%, 36rem); }
    .combo-info { display: grid; gap: 1.25rem 1rem; margin-top: 1.25rem; font-size: 0.875rem; line-height: 1.5; }
    .combo-info[data-size="2"] { grid-template-columns: repeat(2, 1fr); }
    .combo-info[data-size="3"] { grid-template-columns: repeat(3, 1fr); }
    .combo-info p { white-space: nowrap; font-variant-numeric: tabular-nums; }
    @media (max-width: 40rem) { /* narrow screens: the values one colour after another */
      .combo-info[data-size] { grid-template: none; grid-template-columns: minmax(0, 1fr); }
      .combo-info[data-size] > :nth-child(n) { grid-area: auto; }
    }
    .section-label { margin-top: 1.5rem; color: var(--muted); font-size: 0.8rem; }
    .section-label a { color: inherit; }
    .section-label a:hover, .section-label a:focus-visible { color: var(--fg); }
    .actions { display: flex; gap: 1.5rem; margin-top: 1rem; font-size: 0.8rem; }
    .actions :is(a, button) {
      padding: 0; border: 0; background: none;
      color: var(--muted); font: inherit; text-decoration: none; cursor: pointer;
    }
    .actions :is(a, button):is(:hover, :focus-visible) { color: var(--fg); text-decoration: underline; }

    /* Create: compose a combination of 2 to 4 colours, laid out as in the book, beside the full set of
       colours to pick from. On wide screens the composition stays in view while scrolling the colours. */
    #create-view { display: grid; gap: 2.5rem; align-items: start; }
    @media (min-width: 64rem) {
      #create-view { grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 3rem; }
      .create-stage { position: sticky; top: 5rem; } /* below the header */
    }
    .create-stage .combo-figure { width: 100%; }
    .create-stage .blocks[data-size="4"] { width: min(100%, 30rem); }
    .create-stage .blocks .swatch { touch-action: none; cursor: grab; } /* drag to reorder */
    /* The colour selected for swapping or replacing, and the one a dragged colour would swap with. */
    .create-stage .swatch:is([aria-pressed="true"], .drop-target) { box-shadow: inset 0 0 0 0.375rem var(--bg); }
    .create-stage .dragging { position: relative; z-index: 1; cursor: grabbing; }
    .blocks .empty { border: 1px dashed var(--muted); }
    .blocks .empty + .empty { border-left: 0; }
    /* Each colour's values, one row per colour in order (columns line up; OKLCH wraps when narrow). */
    .create-info {
      display: grid; gap: 0.5rem; margin-top: 1.25rem; padding: 0; list-style: none;
      font-size: 0.8rem; line-height: 1.5; font-variant-numeric: tabular-nums;
    }
    .create-info li { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 1.5ch; white-space: nowrap; }
    .create-info .chip { width: 1rem; height: 1rem; background: var(--color); }
    .create-info .name { width: 22ch; } /* widest name */
    .create-info .cmyk { width: 20ch; } /* widest CMYK */
    .picker { display: grid; gap: 1rem; }
    .picker .grid { grid-template-columns: repeat(auto-fill, minmax(2.25rem, 1fr)); }
    .picker .swatch span { opacity: 1; transform: none; } /* a picked colour's place in the combination */
    .picker-status { min-height: 3em; font-size: 0.8rem; line-height: 1.5; white-space: pre; font-variant-numeric: tabular-nums; }

    /* A colour's combinations, in the colour dialog: small, each a link to its page. */
    .detail-combos { margin-top: 1.25rem; white-space: normal; }
    .detail-combos .section-label { margin: 0 0 0.5rem; }
    .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; align-items: start; }
    .thumb { display: block; color: var(--muted); font-size: 0.75rem; text-decoration: none; }
    .thumb:hover, .thumb:focus-visible { color: var(--fg); }
    .thumb .blocks { margin-top: 0.25rem; }

    /* Wheel view: wheel (angle = hue, distance from centre = chroma) centred on the page; the info panel
       floats at the left middle of the screen, outside the layout, so it never moves the wheel. */
    #wheel-view { display: grid; justify-items: center; }
    .wheel { position: relative; width: min(100%, calc(100vh - 8rem)); aspect-ratio: 1; }
    .wheel-panel {
      position: fixed; left: 1.5rem; top: 50%; transform: translateY(-50%); z-index: 2;
      width: var(--info);
      line-height: 1.5; white-space: nowrap; font-variant-numeric: tabular-nums; pointer-events: none;
      opacity: 0; transition: opacity 0.6s ease; /* fade out */
    }
    .wheel-panel.show { opacity: 1; transition-duration: 0.12s; /* fade in */ }
    .wheel-panel .detail-swatch { height: auto; aspect-ratio: 2; margin-bottom: 0.75rem; }
    .wheel-panel h2 { font: inherit; }
    .wheel svg { display: block; width: 100%; height: 100%; }
    .wheel .segment { stroke: var(--bg); stroke-width: 0.004; cursor: pointer; outline: none; }
    .wheel-bg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.35; pointer-events: none; }
    .wheel svg { position: relative; }
    .wheel .highlight { fill: none; stroke: var(--fg); stroke-width: 0.008; pointer-events: none; }
    @media (prefers-reduced-motion: reduce) { .swatch span, .wheel-panel { transition: none !important; } }

    dialog {
      width: min(calc(var(--info) + 4.5rem), calc(100% - 2rem)); /* text + padding + copy button */
      margin: auto;
      padding: 0; border: 0;
      background: var(--bg); color: var(--fg);
    }
    dialog::backdrop { background: rgb(0 0 0 / 0.4); }
    .detail-swatch { height: 12rem; background: var(--color); }
    .detail-body { padding: 1.25rem; line-height: 1.5; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .detail-body h2 { font-size: 1.25rem; font-weight: 500; margin-bottom: 0.5rem; }
    .oklch-line { display: flex; align-items: center; gap: 0.5rem; }
    dialog .detail-combos { padding: 0 1.25rem 1.25rem; margin: 0; }
    .copy {
      display: grid; padding: 0.25rem; margin: -0.25rem 0;
      border: 0; background: none; color: var(--muted); cursor: pointer;
    }
    .copy:hover, .copy:focus-visible { color: var(--fg); }
    .copy svg { width: 1rem; height: 1rem; fill: none; stroke: currentColor; stroke-width: 1.25; }
    .copy .done, .copy.copied .idle { display: none; }
    .copy.copied .done { display: block; }
    .error { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <nav>
      <div><strong>Wada Sanzo</strong> <span>| A Dictionary of Color Combinations</span></div>
      <div class="views">
        <a href="#families">Families</a>
        <a href="#combinations">Combinations</a>
        <a href="#wheel">Wheel</a>
        <a href="#create">Create</a>
      </div>
    </nav>
    <div class="subnav" data-view="families" role="group" aria-label="Families layout">
      <button type="button" data-value="grid">Grid</button>
      <button type="button" data-value="rows">Rows</button>
    </div>
    <div class="subnav" data-view="combinations" data-default="all" role="group" aria-label="Number of colours">
      <button type="button" data-value="2">2</button>
      <button type="button" data-value="3">3</button>
      <button type="button" data-value="4">4</button>
      <button type="button" data-value="all">All</button>
    </div>
  </header>

  <main>
    <section id="families-view"></section>
    <section id="combinations-view" hidden></section>
    <section id="combination-view" hidden></section>
    <section id="wheel-view" hidden>
      <aside class="wheel-panel" aria-live="polite">
        <div class="detail-swatch"></div>
        <h2></h2>
        <p data-field="cmyk"></p>
        <p data-field="oklch"></p>
      </aside>
      <div class="wheel">
        <canvas class="wheel-bg" aria-hidden="true"></canvas>
        <svg viewBox="-1.02 -1.02 2.04 2.04" role="group" aria-label="Colour wheel"></svg>
      </div>
    </section>
    <section id="create-view" hidden>
      <div class="create-stage"></div>
      <div class="picker" role="group" aria-label="Colours">
        <p class="picker-status" aria-hidden="true"></p>
      </div>
    </section>
  </main>

  <dialog id="detail">
    <div class="detail-swatch"></div>
    <div class="detail-body">
      <h2></h2>
      <p data-field="cmyk"></p>
      <p class="oklch-line">
        <span data-field="oklch"></span>
        <button type="button" class="copy" aria-label="Copy CSS colour" title="Copy CSS colour">
          <svg class="idle" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8"/><path d="M10.5 5.5v-3h-8v8h3"/></svg>
          <svg class="done" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg>
        </button>
      </p>
    </div>
    <div class="detail-combos"></div>
  </dialog>

  <script type="module">
    const views = {
      families: document.getElementById("families-view"),
      combinations: document.getElementById("combinations-view"),
      combination: document.getElementById("combination-view"),
      wheel: document.getElementById("wheel-view"),
      create: document.getElementById("create-view"),
    };
    const detail = document.getElementById("detail");
    const subnavs = document.querySelectorAll(".subnav");

    const cmykText = ([c, m, y, k]) => `C ${c} M ${m} Y ${y} K ${k}`;
    const oklchText = ([l, c, h]) => `oklch(${l} ${c} ${h})`;
    const oklchValues = ([l, c, h]) => `OKLCH ${l} ${c} ${h}`;

    // Routes: #families, #combinations, #wheel, #combination/<number> for one combination, and
    // #create/<colours> for a combination being composed.
    let data = null; // set once the JSON has loaded
    // The combination being composed: its colours in order (a cross: top, left, right, bottom), the slot
    // selected for swapping or replacing, and a one-off message. In the address as colour numbers in book
    // order (#create/1-46-89), so it can be shared; also remembered in this browser.
    const create = { picked: [], active: null, note: "", dragged: false };
    const pickerButtons = []; // colour index -> its button in the colour picker
    function showView() {
      const [route, arg] = location.hash.slice(1).split("/");
      const name = route in views ? route : "families";
      const section = name === "combination" ? "combinations" : name; // highlighted in the nav
      for (const [key, el] of Object.entries(views)) el.hidden = key !== name;
      for (const a of document.querySelectorAll(".views a")) {
        if (a.hash === `#${section}`) a.setAttribute("aria-current", "page");
        else a.removeAttribute("aria-current");
      }
      for (const s of subnavs) s.hidden = s.dataset.view !== name;
      if (detail.open) detail.close();
      if (name === "combination" && data) {
        renderCombination(Number(arg));
        scrollTo(0, 0);
      } else if (name === "create" && data) {
        openCreate(arg);
        document.title = "Create | Wada Sanzo";
      } else {
        document.title = "Wada Sanzo | A Dictionary of Color Combinations";
      }
    }
    addEventListener("hashchange", showView);
    showView();

    // Sub-navigation: each view's options (families: grid or rows; combinations: number of colours).
    // The choice is set on the view as data-show, which the CSS reads, and remembered in this browser.
    for (const subnav of subnavs) {
      const view = views[subnav.dataset.view], key = `${subnav.dataset.view}-show`;
      const buttons = [...subnav.querySelectorAll("button")];
      const choose = (value) => {
        view.dataset.show = value;
        for (const b of buttons) b.setAttribute("aria-pressed", b.dataset.value === value);
        try { localStorage.setItem(key, value); } catch {}
      };
      for (const b of buttons) b.addEventListener("click", () => choose(b.dataset.value));
      let saved = null;
      try { saved = localStorage.getItem(key); } catch {}
      choose(buttons.some((b) => b.dataset.value === saved) ? saved : subnav.dataset.default ?? buttons[0].dataset.value);
    }

    // Fills a block that has .detail-swatch, h2 and data-field elements (the dialog and the wheel panel).
    function fillDetails(root, color) {
      root.querySelector(".detail-swatch").style.setProperty("--color", color.css);
      root.querySelector("h2").textContent = color.name;
      root.querySelector('[data-field="cmyk"]').textContent = cmykText(color.cmyk);
      root.querySelector('[data-field="oklch"]').textContent = oklchValues(color.oklch);
    }

    function showDetail(color) {
      fillDetails(detail, color);
      const copy = detail.querySelector(".copy");
      copy.dataset.css = color.css;
      copy.classList.remove("copied");
      // The colour's combinations, small; each opens that combination's page.
      const list = detail.querySelector(".detail-combos");
      const combos = data.combosOf[color.index];
      const label = document.createElement("p");
      label.className = "section-label";
      label.textContent = `In ${combos.length} combination${combos.length === 1 ? "" : "s"}`;
      const thumbs = document.createElement("div");
      thumbs.className = "thumbs";
      for (const combo of combos) {
        const a = document.createElement("a");
        a.className = "thumb";
        a.href = `#combination/${combo.number}`;
        a.addEventListener("click", () => detail.close()); // also when it is the page already open
        a.textContent = comboNumber(combo.number);
        const blocks = blocksFor(combo, () => document.createElement("div"));
        blocks.setAttribute("aria-hidden", "true");
        a.append(blocks);
        thumbs.append(a);
      }
      list.replaceChildren(label, thumbs);
      detail.showModal();
      detail.scrollTop = 0;
    }

    // Copy buttons (the dialog's, and the combination page's): copy the colour as CSS, oklch(L C h),
    // and show a check mark for a moment.
    const copyTemplate = detail.querySelector(".copy");
    function copyButtonFor(css) {
      const button = copyTemplate.cloneNode(true);
      button.dataset.css = css;
      return button;
    }
    document.addEventListener("click", async (e) => {
      const button = e.target.closest(".copy");
      if (!button) return;
      try {
        await navigator.clipboard.writeText(button.dataset.css);
      } catch {
        return; // clipboard unavailable (e.g. not served from localhost or https)
      }
      button.classList.add("copied");
      clearTimeout(button.copiedTimer);
      button.copiedTimer = setTimeout(() => button.classList.remove("copied"), 1500);
    });
    // Clicking the backdrop (outside the dialog's content) closes it.
    detail.addEventListener("click", (e) => { if (e.target === detail) detail.close(); });

    try {
      const [colors, families, combinations] = await Promise.all(
        ["colors.json", "families.json", "combinations.json"].map((f) => fetch(f).then((r) => r.json()))
      );
      colors.forEach((c, i) => Object.assign(c, { index: i, css: oklchText(c.oklch) }));
      const combos = combinations.map((ids, i) => ({ number: i + 1, colors: ids.map((k) => colors[k]) }));
      const combosOf = colors.map(() => []); // colour index -> its combinations, in book order
      for (const combo of combos) for (const c of combo.colors) combosOf[c.index].push(combo);
      data = { colors, combos, combosOf };

      // Families: one grid per colour family (the book groups its colours by hue), in book order.
      for (const family of families) {
        const ul = document.createElement("ul");
        ul.className = "grid";
        ul.append(...family.map((i) => swatchItem(colors[i])));
        views.families.append(ul);
      }

      // Combinations: in book order, in the book's three sections (2, 3 and 4 colours).
      for (const size of [2, 3, 4]) {
        const ul = document.createElement("ul");
        ul.className = "combos";
        ul.dataset.size = size;
        ul.append(...combos.filter((combo) => combo.colors.length === size).map(combinationItem));
        views.combinations.append(ul);
      }

      buildPicker(colors, families);
      buildWheel(colors);
      // Prepare the wheel background's hue table while the page is idle, so opening the wheel is quick.
      (window.requestIdleCallback ?? setTimeout)(() => cuspTable());
      showView(); // a #combination/<number> link opened directly needs the data
    } catch (error) {
      console.error(error);
      document.querySelector("main").innerHTML = `<p class="error">Couldn't load the colour data. Serve this folder over HTTP, e.g. <code>python3 -m http.server</code>.</p>`;
    }

    // A colour block: shows its text on hover, opens the details on click (or does onClick).
    function colorButton(c, onClick = () => showDetail(c)) {
      const button = document.createElement("button");
      button.className = "swatch";
      button.style.setProperty("--color", c.css);
      button.style.setProperty("--ink", c.oklch[0] > 0.6 ? "rgb(0 0 0 / 0.75)" : "rgb(255 255 255 / 0.9)");
      button.setAttribute("aria-label", c.name);
      button.addEventListener("click", onClick);
      return button;
    }

    function comboNumber(number) {
      return String(number).padStart(3, "0");
    }

    // The combination's colours laid out as in the book; make(colour) creates each block.
    function blocksFor(combo, make) {
      const blocks = document.createElement("div");
      blocks.className = "blocks";
      blocks.dataset.size = combo.colors.length;
      for (const c of combo.colors) {
        const block = make(c);
        block.style.setProperty("--color", c.css);
        blocks.append(block);
      }
      return blocks;
    }

    // A colour block that shows its name on hover and opens the colour dialog on click (or does onClick).
    function namedColorButton(c, onClick) {
      const button = colorButton(c, onClick);
      const name = document.createElement("span");
      name.textContent = c.name;
      button.append(name);
      return button;
    }

    // A combination in a list: its number (a link to its page) above its colours.
    function combinationItem(combo) {
      const link = document.createElement("a");
      link.className = "combo-number";
      link.href = `#combination/${combo.number}`;
      link.textContent = comboNumber(combo.number);
      const li = document.createElement("li");
      li.setAttribute("aria-label", `Combination ${combo.number}`);
      li.append(link, blocksFor(combo, (c) => namedColorButton(c)));
      return li;
    }

    // Each colour's name, CMYK and OKLCH (with a copy button), placed like the colours themselves.
    function infoFor(colors) {
      const info = document.createElement("div");
      info.className = "combo-info";
      info.dataset.size = colors.length;
      for (const c of colors) {
        const name = document.createElement("p");
        name.textContent = c.name;
        const cmyk = document.createElement("p");
        cmyk.textContent = cmykText(c.cmyk);
        const oklch = document.createElement("p");
        oklch.className = "oklch-line";
        const values = document.createElement("span");
        values.textContent = oklchValues(c.oklch);
        oklch.append(values, copyButtonFor(c.css));
        const cell = document.createElement("div");
        cell.append(name, cmyk, oklch);
        info.append(cell);
      }
      return info;
    }

    // Colours in an address: their numbers in book order, 1-based, e.g. 1-46-89.
    function colorsCode(colors) {
      return colors.map((c) => c.index + 1).join("-");
    }
    function parseColors(text) {
      const colors = [];
      for (const part of text.split("-")) {
        const c = /^\d+$/.test(part) ? data.colors[Number(part) - 1] : undefined;
        if (c && !colors.includes(c) && colors.length < 4) colors.push(c);
      }
      return colors;
    }

    // Opens the Create view: with the colours in the address, or else the combination composed last.
    function openCreate(arg) {
      if (arg !== undefined) create.picked = parseColors(arg);
      else if (!create.picked.length) {
        let saved = null;
        try { saved = localStorage.getItem("create"); } catch {}
        create.picked = parseColors(saved ?? "");
      }
      create.active = null;
      create.note = "";
      updateCreate();
    }

    // After every change: the address, the saved copy, the composition and the picker's marks.
    function updateCreate(focusSlot) {
      const code = colorsCode(create.picked);
      history.replaceState(null, "", code ? `#create/${code}` : "#create");
      try { localStorage.setItem("create", code); } catch {}
      renderStage(focusSlot);
      for (const c of data.colors) {
        const at = create.picked.indexOf(c), button = pickerButtons[c.index];
        button.setAttribute("aria-pressed", at >= 0);
        button.firstElementChild.textContent = at >= 0 ? at + 1 : "";
      }
    }

    // The composition: the colours laid out as in the book (2 to 4; empty slots until there are 2),
    // each colour's values, a message, and actions.
    function renderStage(focusSlot) {
      const { picked, active } = create;
      const size = Math.max(2, picked.length);
      const blocks = document.createElement("div");
      blocks.className = "blocks";
      blocks.dataset.size = size;
      for (let i = 0; i < size; i++) {
        if (i < picked.length) blocks.append(slotButton(picked[i], i));
        else blocks.append(Object.assign(document.createElement("div"), { className: "empty" }));
      }
      const figure = document.createElement("div");
      figure.className = "combo-figure";
      const info = document.createElement("ol");
      info.className = "create-info";
      for (const c of picked) {
        const li = document.createElement("li");
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.style.setProperty("--color", c.css);
        const oklch = document.createElement("span");
        oklch.className = "oklch-line";
        oklch.append(oklchValues(c.oklch), copyButtonFor(c.css));
        li.append(
          chip,
          Object.assign(document.createElement("span"), { className: "name", textContent: c.name }),
          Object.assign(document.createElement("span"), { className: "cmyk", textContent: cmykText(c.cmyk) }),
          oklch,
        );
        info.append(li);
      }
      figure.append(blocks, info);

      const note = document.createElement("p");
      note.className = "section-label";
      note.setAttribute("aria-live", "polite");
      if (create.note) note.textContent = create.note;
      else if (active !== null) note.textContent = "Pick a colour to replace it, or select another to swap them.";
      else if (picked.length < 2) note.textContent = "Pick 2 to 4 colours.";
      else {
        // Book combinations that have all these colours.
        const together = data.combos.filter((combo) => picked.every((c) => combo.colors.includes(c)));
        if (!together.length) note.textContent = "Not together in the book.";
        else {
          note.append("Together in the book:");
          for (const combo of together) {
            const a = document.createElement("a");
            a.href = `#combination/${combo.number}`;
            a.textContent = comboNumber(combo.number);
            note.append(" ", a);
          }
        }
      }

      const actions = document.createElement("p");
      actions.className = "actions";
      if (picked.length) {
        const copyLink = Object.assign(document.createElement("button"), { type: "button", textContent: "Copy link" });
        copyLink.addEventListener("click", async () => {
          try { await navigator.clipboard.writeText(location.href); } catch { return; }
          copyLink.textContent = "Copied";
          setTimeout(() => (copyLink.textContent = "Copy link"), 1500);
        });
        const clear = Object.assign(document.createElement("button"), { type: "button", textContent: "Clear" });
        clear.addEventListener("click", () => {
          create.picked = [];
          create.active = null;
          create.note = "";
          updateCreate();
        });
        actions.append(copyLink, clear);
      }

      views.create.querySelector(".create-stage").replaceChildren(figure, note, actions);
      if (focusSlot !== undefined) blocks.children[focusSlot]?.focus();
    }

    // A colour of the composition: click it, then another, to swap them (or then a colour in the
    // picker, to replace it); or drag it onto another. Delete or Backspace removes it.
    function slotButton(c, i) {
      const button = namedColorButton(c, () => { if (!create.dragged) selectSlot(i); });
      button.dataset.slot = i;
      button.setAttribute("aria-pressed", create.active === i);
      button.addEventListener("pointerdown", (e) => dragSlot(e, button, i));
      button.addEventListener("keydown", (e) => {
        if (e.key !== "Delete" && e.key !== "Backspace") return;
        e.preventDefault();
        create.picked.splice(i, 1);
        create.active = null;
        create.note = "";
        updateCreate(create.picked.length ? Math.min(i, create.picked.length - 1) : undefined);
      });
      return button;
    }

    function swapSlots(a, b) {
      const p = create.picked;
      [p[a], p[b]] = [p[b], p[a]];
    }

    function selectSlot(i) {
      const { active } = create;
      create.note = "";
      if (active === null) create.active = i;
      else {
        if (active !== i) swapSlots(active, i);
        create.active = null;
      }
      updateCreate(i);
    }

    // Dragging a colour of the composition: it follows the pointer; dropped on another colour, they swap.
    function dragSlot(e, button, i) {
      if (e.button !== 0 || !e.isPrimary) return;
      const x0 = e.clientX, y0 = e.clientY;
      const others = [...button.parentElement.querySelectorAll("[data-slot]")].filter((b) => b !== button);
      let dragging = false, target = null;
      button.setPointerCapture(e.pointerId);
      const move = (ev) => {
        const dx = ev.clientX - x0, dy = ev.clientY - y0;
        if (!dragging && Math.hypot(dx, dy) < 6) return; // still a click
        dragging = true;
        button.classList.add("dragging");
        button.style.transform = `translate(${dx}px, ${dy}px) scale(0.85)`; // smaller, to show the target
        target = others.find((b) => {
          const r = b.getBoundingClientRect();
          return ev.clientX >= r.left && ev.clientX < r.right && ev.clientY >= r.top && ev.clientY < r.bottom;
        }) ?? null;
        for (const b of others) b.classList.toggle("drop-target", b === target);
      };
      const end = (ev) => {
        button.removeEventListener("pointermove", move);
        button.removeEventListener("pointerup", end);
        button.removeEventListener("pointercancel", end);
        if (!dragging) return; // a click, handled by the click listener
        create.dragged = true; // ignore the click that follows this pointerup
        setTimeout(() => (create.dragged = false));
        if (target && ev.type === "pointerup") swapSlots(i, Number(target.dataset.slot));
        create.active = null;
        create.note = "";
        updateCreate();
      };
      button.addEventListener("pointermove", move);
      button.addEventListener("pointerup", end);
      button.addEventListener("pointercancel", end);
    }

    // A colour in the picker: adds it to the composition (or replaces the selected slot); if it is
    // already there, removes it.
    function pick(c) {
      const { picked } = create;
      const at = picked.indexOf(c);
      create.note = "";
      if (at >= 0) picked.splice(at, 1);
      else if (create.active !== null) picked[create.active] = c;
      else if (picked.length < 4) picked.push(c);
      else create.note = "4 colours at most: click a picked colour to remove it, or select one in the combination to replace it.";
      create.active = null;
      updateCreate();
    }

    // The colour picker: every colour, by family as in the Families view, small. A picked colour shows
    // its place in the combination; hovering one shows its values above.
    function buildPicker(colors, families) {
      const picker = views.create.querySelector(".picker");
      const status = picker.querySelector(".picker-status");
      const showStatus = (c) => (status.textContent = `${c.name}\n${cmykText(c.cmyk)}  ${oklchValues(c.oklch)}`);
      for (const family of families) {
        const ul = document.createElement("ul");
        ul.className = "grid";
        for (const i of family) {
          const c = colors[i];
          const button = colorButton(c, () => pick(c));
          button.append(document.createElement("span"));
          button.addEventListener("pointerenter", () => showStatus(c));
          button.addEventListener("focus", () => showStatus(c));
          button.addEventListener("pointerleave", () => status.replaceChildren());
          button.addEventListener("blur", () => status.replaceChildren());
          pickerButtons[i] = button;
          const li = document.createElement("li");
          li.append(button);
          ul.append(li);
        }
        picker.append(ul);
      }
    }

    // Escape cancels a selected slot.
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape" || views.create.hidden || detail.open || create.active === null) return;
      const focusSlot = create.active;
      create.active = null;
      updateCreate(focusSlot);
    });

    // One combination's page: number, colours, each colour's values, and related combinations
    // (those sharing a colour with it: most shared colours first, then in book order).
    function renderCombination(number) {
      const view = views.combination;
      const combo = data.combos[number - 1];
      if (!combo) {
        view.replaceChildren(Object.assign(document.createElement("p"), { className: "error", textContent: "No such combination." }));
        return;
      }
      const title = document.createElement("h1");
      title.className = "combo-number";
      title.textContent = comboNumber(number);

      const figure = document.createElement("div");
      figure.className = "combo-figure";
      figure.append(blocksFor(combo, (c) => namedColorButton(c)), infoFor(combo.colors));
      const edit = document.createElement("a");
      edit.href = `#create/${colorsCode(combo.colors)}`;
      edit.textContent = "Edit in Create";
      const actions = document.createElement("p");
      actions.className = "actions";
      actions.append(edit);
      figure.append(actions);

      const shared = (other) => other.colors.filter((c) => combo.colors.includes(c)).length;
      const related = data.combos
        .filter((other) => other !== combo && shared(other) > 0)
        .sort((a, b) => shared(b) - shared(a) || a.number - b.number);
      const label = document.createElement("p");
      label.className = "section-label";
      label.textContent = `${related.length} related combination${related.length === 1 ? "" : "s"}`;
      const list = document.createElement("ul");
      list.className = "combos";
      list.append(...related.map(combinationItem));

      view.replaceChildren(title, figure, label, list);
      document.title = `${comboNumber(number)} | Wada Sanzo`;
    }

    function swatchItem(c) {
      const button = colorButton(c);
      const inGrid = document.createElement("span");
      inGrid.className = "in-grid";
      inGrid.textContent = c.cmyk.map((v, j) => `${"CMYK"[j]} ${v}`).join("\n");
      const inRows = document.createElement("span");
      inRows.className = "in-rows";
      for (const text of [c.name, cmykText(c.cmyk), oklchValues(c.oklch)]) {
        const cell = document.createElement("span");
        cell.textContent = text;
        inRows.append(cell);
      }
      button.append(inGrid, inRows);
      const li = document.createElement("li");
      li.append(button);
      return li;
    }

    // Donut wheel on a polar grid: angle = OKLCH hue (counter-clockwise from the right, 10° slices),
    // distance from the centre = chroma (8 rings, spaced by the square root of chroma so the many
    // muted colours get room). Colours sharing a cell split it side by side, in hue order; empty
    // cells stay as gaps. Near-neutral colours (no meaningful hue) form the inner ring, light to dark.
    function buildWheel(colors) {
      const SLICE = 10, BANDS = 8, NEUTRAL_C = 0.02;
      const RING = [0.25, 1], GREYS = [0.13, 0.23];
      const svg = views.wheel.querySelector("svg");
      const panel = views.wheel.querySelector(".wheel-panel");
      const NS = "http://www.w3.org/2000/svg";
      const highlight = document.createElementNS(NS, "path");
      highlight.classList.add("highlight");

      // Screen point for a hue angle: 0° to the right, increasing counter-clockwise.
      const pt = (r, deg) => {
        const a = (deg * Math.PI) / 180;
        return `${(r * Math.cos(a)).toFixed(5)} ${(-r * Math.sin(a)).toFixed(5)}`;
      };
      const arc = (r0, r1, d0, d1) => {
        const large = d1 - d0 > 180 ? 1 : 0;
        return `M ${pt(r1, d0)} A ${r1} ${r1} 0 ${large} 0 ${pt(r1, d1)} L ${pt(r0, d1)} A ${r0} ${r0} 0 ${large} 1 ${pt(r0, d0)} Z`;
      };

      const segment = (c, d) => {
        const path = document.createElementNS(NS, "path");
        path.classList.add("segment");
        path.setAttribute("d", d);
        path.setAttribute("fill", c.css);
        path.setAttribute("tabindex", "0");
        path.setAttribute("role", "button");
        path.setAttribute("aria-label", c.name);
        const show = () => {
          highlight.setAttribute("d", d);
          fillDetails(panel, c);
          panel.classList.add("show");
        };
        const hide = () => { highlight.removeAttribute("d"); panel.classList.remove("show"); };
        path.addEventListener("pointerenter", show);
        path.addEventListener("focus", show);
        path.addEventListener("pointerleave", hide);
        path.addEventListener("blur", hide);
        path.addEventListener("click", () => showDetail(c));
        path.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); showDetail(c); }
        });
        svg.append(path);
      };

      const chromatic = colors.filter((c) => c.oklch[1] >= NEUTRAL_C);
      const greys = colors.filter((c) => c.oklch[1] < NEUTRAL_C);
      const lo = Math.sqrt(NEUTRAL_C), hi = Math.sqrt(Math.max(...chromatic.map((c) => c.oklch[1])));
      const bandWidth = (RING[1] - RING[0]) / BANDS;

      // Background: the continuous wheel on the same mapping, faded, repainted when the size changes.
      const canvas = views.wheel.querySelector(".wheel-bg");
      new ResizeObserver(() => paintWheel(canvas, RING, lo, hi)).observe(canvas);

      const cells = new Map();
      for (const c of chromatic) {
        const s = Math.floor(c.oklch[2] / SLICE);
        const b = Math.min(Math.floor(((Math.sqrt(c.oklch[1]) - lo) / (hi - lo)) * BANDS), BANDS - 1);
        const key = `${s},${b}`;
        if (!cells.has(key)) cells.set(key, { s, b, list: [] });
        cells.get(key).list.push(c);
      }
      for (const { s, b, list } of cells.values()) {
        list.sort((x, y) => x.oklch[2] - y.oklch[2]);
        const r0 = RING[0] + b * bandWidth, w = SLICE / list.length;
        list.forEach((c, k) => segment(c, arc(r0, r0 + bandWidth, s * SLICE + k * w, s * SLICE + (k + 1) * w)));
      }
      greys.sort((a, b) => b.oklch[0] - a.oklch[0]);
      const step = 360 / greys.length;
      greys.forEach((c, k) => segment(c, arc(GREYS[0], GREYS[1], k * step, (k + 1) * step)));
      svg.append(highlight);
    }

    // Paints the continuous wheel: at each pixel, hue from the angle and chroma from the radius (same
    // mapping as the segments), at that hue's most vivid lightness, limited to what sRGB can show.
    // Only repaints when the size changes: a hidden canvas keeps its picture.
    function paintWheel(canvas, [R0, R1], lo, hi) {
      const size = Math.round(canvas.clientWidth * Math.min(devicePixelRatio, 1.5));
      if (!size || (size === canvas.width && canvas.dataset.painted)) return; // hidden, or already painted
      canvas.width = canvas.height = size;
      canvas.dataset.painted = "1";
      const ctx = canvas.getContext("2d");
      const img = ctx.createImageData(size, size), px = img.data;
      const unit = 2.04 / size; // matches the SVG viewBox
      const { L: cuspL, C: cuspC } = cuspTable();
      const rgb = new Float64Array(3);
      const encode = (v) => SRGB_ENCODE[v <= 0 ? 0 : v >= 1 ? 4095 : (v * 4095 + 0.5) | 0];
      for (let j = 0; j < size; j++) {
        const y = (j + 0.5) * unit - 1.02;
        for (let i = 0; i < size; i++) {
          const x = (i + 0.5) * unit - 1.02, r = Math.sqrt(x * x + y * y);
          const alpha = Math.min(1, (r - R0) / unit, (R1 - r) / unit); // antialiased edges
          if (alpha <= 0) continue;
          // Hue in half-degree steps, interpolated between the table's entries.
          const k = ((Math.atan2(-y, x) * 360) / Math.PI + 720) % 720, k0 = k | 0, t = k - k0;
          const L = cuspL[k0] + (cuspL[k0 + 1] - cuspL[k0]) * t;
          const c = lo + ((r - R0) / (R1 - R0)) * (hi - lo);
          const C = Math.min(c * c, cuspC[k0] + (cuspC[k0 + 1] - cuspC[k0]) * t);
          oklabToLinearSRGB(L, (C * x) / r, (-C * y) / r, rgb); // a = C cos h, b = C sin h
          const o = (j * size + i) * 4;
          px[o] = encode(rgb[0]);
          px[o + 1] = encode(rgb[1]);
          px[o + 2] = encode(rgb[2]);
          px[o + 3] = 255 * alpha;
        }
      }
      ctx.putImageData(img, 0, 0);
    }

    // Linear sRGB 0..1 (in 4096 steps) -> 8-bit sRGB.
    const SRGB_ENCODE = Uint8ClampedArray.from({ length: 4096 }, (_, i) => {
      const v = i / 4095;
      return 255 * (v <= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055);
    });

    // OKLab -> linear sRGB (Ottosson's matrices), written into `out`.
    function oklabToLinearSRGB(L, a, b, out = new Float64Array(3)) {
      const l_ = L + 0.3963377774 * a + 0.2158037573 * b, l = l_ * l_ * l_;
      const m_ = L - 0.1055613458 * a - 0.0638541728 * b, m = m_ * m_ * m_;
      const s_ = L - 0.0894841775 * a - 1.291485548 * b, s = s_ * s_ * s_;
      out[0] = 4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
      out[1] = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;
      out[2] = -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s;
      return out;
    }

    function inSRGB(L, C, h) {
      const rad = (h * Math.PI) / 180;
      return oklabToLinearSRGB(L, C * Math.cos(rad), C * Math.sin(rad)).every((v) => v >= -1e-4 && v <= 1 + 1e-4);
    }

    // Most vivid sRGB colour per hue (the gamut "cusp"): lightness L and chroma C in half-degree steps,
    // with entry 720 repeating entry 0 so interpolation wraps around. Computed once.
    let cusps = null;
    function cuspTable() {
      if (!cusps) {
        const L = new Float64Array(721), C = new Float64Array(721);
        for (let k = 0; k < 720; k++) {
          L[k] = cuspLightness(k / 2);
          C[k] = maxChroma(L[k], k / 2);
        }
        L[720] = L[0];
        C[720] = C[0];
        cusps = { L, C };
      }
      return cusps;
    }

    // Largest chroma sRGB can show at this lightness and hue.
    function maxChroma(L, h) {
      let lo = 0, hi = 0.4;
      for (let i = 0; i < 16; i++) { // to within 0.4 / 2^16
        const mid = (lo + hi) / 2;
        if (inSRGB(L, mid, h)) lo = mid; else hi = mid;
      }
      return lo;
    }

    // Lightness at which this hue reaches its most vivid sRGB colour (the gamut "cusp").
    // Max chroma rises then falls with lightness, so a ternary search finds the peak.
    function cuspLightness(h) {
      let lo = 0.2, hi = 1;
      for (let i = 0; i < 24; i++) { // to within 0.8 × (2/3)^24 ≈ 0.00005
        const m1 = lo + (hi - lo) / 3, m2 = hi - (hi - lo) / 3;
        if (maxChroma(m1, h) < maxChroma(m2, h)) lo = m1; else hi = m2;
      }
      return (lo + hi) / 2;
    }
  </script>
</body>
