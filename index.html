    // write a colour for it: screen(rgb), linear sRGB (any colour), and fromEncoded(rgb), sRGB as CSS gives
    // it (0..1), each as the three channels its shaders write.
    function wideGL(gl) {
      let kind = "srgb";
      try {
        if (gl.getExtension("EXT_color_buffer_float") && gl.drawingBufferStorage) {
          gl.drawingBufferStorage(gl.RGBA16F, gl.drawingBufferWidth, gl.drawingBufferHeight);
          if (gl.drawingBufferFormat === gl.RGBA16F) kind = "float";
        }
      } catch {}
      if (kind === "srgb" && "drawingBufferColorSpace" in gl) {
        try { gl.drawingBufferColorSpace = "display-p3"; } catch {}
        if (gl.drawingBufferColorSpace === "display-p3") kind = "p3";
      }
      const curve = (v) => SRGB_CURVE[Math.round(Math.min(1, Math.max(0, v)) * 4096)];
      const screen = kind === "float" ? (rgb) => Array.from(rgb, extendedCurve) : (rgb) => Array.from(kind === "p3" ? times3(SRGB_TO_P3, rgb) : rgb, curve);
      const decode = (v) => (v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
      const fromEncoded = kind === "p3" ? (rgb) => screen(rgb.map(decode)) : (rgb) => [...rgb];
      return { kind, screen, fromEncoded };
    }

    // CIE XYZ (D65) <-> OKLCH, CSS Color 4's matrices (as scripts/cmyk_to_oklch.py, and inverted, as
    // notes/ostwald.py): for Ostwald's system, measured against the press. Nothing is clipped.
    const OKLAB_TO_LMS = [[1.00000000239858, 0.39633777716154006, 0.21580375421218242], [0.999999999290284, -0.1055613457521502, -0.06385417190922567], [0.9999999856456103, -0.08948417624532107, -1.2914855294809227]];
    const LMS_TO_XYZ = [[1.226879875845924, -0.557814994460217, 0.2813910456659646], [-0.040575745214800875, 1.1122868032803173, -0.07171105806551642], [-0.07637293667466001, -0.4214933324022431, 1.5869240198367816]];
    const XYZ_TO_LMS = [[0.819022437996703, 0.3619062600528904, -0.1288737815209879], [0.0329836539323885, 0.9292868615863434, 0.0361446663506424], [0.0481771893596242, 0.2642395317527308, 0.6335478284694309]];
    const LMS_TO_OKLAB = [[0.210454268309314, 0.7936177747023054, -0.0040720430116193], [1.9779985324311684, -2.42859224204858, 0.450593709617411], [0.0259040424655478, 0.7827717124575296, -0.8086757660377118]];
    const XYZ_TO_SRGB = [[3.2409699419045226, -1.537383177570094, -0.4986107602930034], [-0.9692436362808796, 1.8759675015077202, 0.04155505740717559], [0.05563007969699366, -0.20397695888897652, 1.0569715142428786]];
    function xyzOf([L, C, h]) {
      const rad = h * (Math.PI / 180);
      return times3(LMS_TO_XYZ, Array.from(times3(OKLAB_TO_LMS, [L, C * Math.cos(rad), C * Math.sin(rad)]), (v) => v * v * v));
    }
    function oklchOfXYZ(xyz) { // rounded as colors.json is (and in the same steps as notes/ostwald.py)
      const [L, a, b] = times3(LMS_TO_OKLAB, Array.from(times3(XYZ_TO_LMS, xyz), (v) => Math.sign(v) * Math.abs(v) ** (1 / 3)));
      const deg = Math.atan2(b, a) * (180 / Math.PI) % 360, C = +Math.hypot(a, b).toFixed(4), h = +(deg < 0 ? deg + 360 : deg).toFixed(2);
      return [+L.toFixed(4), C, C === 0 || h === 360 ? 0 : h];
    }
    function oklchOfLinear(rgb) { // linear sRGB -> OKLCH (Ottosson's matrices), not rounded
      const [r, g, b] = rgb;
      const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b), m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b), s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
      const L = 0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s, A = 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s, B = 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s;
      return [L, Math.hypot(A, B), (((Math.atan2(B, A) * 180) / Math.PI) % 360 + 360) % 360];
    }

    function showView() {
      const [, arg, tab] = location.hash.slice(1).split("/");
      const name = showHeader(); // the header's script (in the page, so as to show the header right from the start)
      for (const [key, el] of Object.entries(views)) el.hidden = key !== name;
      if (detail.open) detail.close();
      if ((name === "combination" || name === "season") && data) {
        renderCombination(name, Number(arg), tab);
        scrollTo(0, 0);
      } else if (name === "create" && data) {
        openCreate(arg);
        document.title = "Create | Wada Sanzo";
      } else {
        document.title = "Wada Sanzo | A Dictionary of Color Combinations";
      }
    }
    // Sub-navigation: each view's options (colors: grid, rows, OKLCH or Ostwald; combinations: number of
    // colours; seasons: one month or all).
    // The choice is set on the view as data-show, which the CSS reads, and remembered in this browser;
    // at first, the one the header's script chose (the one remembered, or the default).
    for (const subnav of subnavs) {
      const view = views[subnav.dataset.view], key = `${subnav.dataset.view}-show`;
      const buttons = [...subnav.querySelectorAll("button")];
      const choose = (value) => {
        view.dataset.show = value;
        for (const b of buttons) b.setAttribute("aria-pressed", b.dataset.value === value);
        try { localStorage.setItem(key, value); } catch {}
      };
      for (const b of buttons) b.addEventListener("click", () => choose(b.dataset.value));
      choose(buttons.find((b) => b.getAttribute("aria-pressed") === "true").dataset.value);
    }

    addEventListener("hashchange", showView);
    showView();

    // Fills a block that has .detail-swatch, h2 and data-field elements (the dialog and the wheel panel).
    function fillDetails(root, color) {
      root.querySelector(".detail-swatch").style.setProperty("--color", color.css);
      const name = root.querySelector("h2");
      name.classList.add("named");
      name.replaceChildren(color.name, chipOf(color));
      root.querySelector('[data-field="cmyk"]').textContent = cmykText(color.cmyk);
      root.querySelector('[data-field="oklch"]').textContent = oklchValues(color.oklch);
    }

    // The card of a colour that isn't one of Wada's (an empty cell's, in the Ostwald view or on the wheel
    // sliced): its values, its CMYK if estimated, and the CSS colour to copy; then `line` and `warning`
    // (that it isn't one of his) instead of combinations.
    function showComputedDetail(own, title, cmyk, line, warning) {
      detail.querySelector(".detail-swatch").style.setProperty("--color", own.css);
      const name = detail.querySelector("h2");
      name.classList.add("named");
      name.replaceChildren(title, chipOf(own));
      detail.querySelector('[data-field="cmyk"]').textContent = cmyk ? `≈ ${cmykText(cmyk)}` : "Not in Wada's palette"; // an estimate, so ≈
      detail.querySelector('[data-field="oklch"]').textContent = oklchValues(own.oklch);
      const copy = detail.querySelector(".copy");
      copy.dataset.css = oklchText(own.oklch);
      copy.classList.remove("copied");
      const note = detail.querySelector(".detail-note");
      note.replaceChildren(line, Object.assign(document.createElement("span"), { className: "detail-warning", textContent: warning }));
      note.hidden = false;
      detail.querySelector(".detail-combos").replaceChildren();
      detail.showModal();
      detail.scrollTop = 0;
    }

    function showDetail(color) {
      fillDetails(detail, color);
      const copy = detail.querySelector(".copy");
      copy.dataset.css = color.css;
      copy.classList.remove("copied");
      // Only in Volume 2, or misspelled in the book: say so. On Plate 8 of Hama and Wada's colour atlas
      // (1935): its hue and tone there, and the plate's Japanese name with its reading.
      const note = detail.querySelector(".detail-note"), { atlas } = color;
      const parts = [color.volume === 2 && "From Volume 2", color.bookName && `Printed as ${color.bookName}`].filter(Boolean);
      note.replaceChildren(parts.join(". "));
      if (atlas) {
        note.append(`${parts.length ? ". " : ""}Colour atlas (1935), Plate 8: ${atlas.tone} of ${atlas.hue}, `,
          Object.assign(document.createElement("span"), { lang: "ja", textContent: atlas.ja }), ` (${atlas.reading})`);
      }
      note.hidden = !note.textContent;
      // The colour's combinations, small, Volume 1's then the seasonal ones; each opens its page.
      const list = detail.querySelector(".detail-combos");
      list.replaceChildren();
      for (const [combos, noun] of [[data.combosOf[color.index], "combination"], [data.seasonsOf[color.index], "seasonal combination"]]) {
        if (!combos.length) continue;
        const label = document.createElement("p");
        label.className = "section-label";
        label.textContent = `In ${combos.length} ${noun}${combos.length === 1 ? "" : "s"}`;
        const thumbs = document.createElement("div");
        thumbs.className = combos[0].kind === "season" ? "thumbs seasons" : "thumbs";
        for (const combo of combos) {
          const a = document.createElement("a");
          a.className = "thumb";
          a.href = comboHref(combo);
          a.addEventListener("click", () => detail.close()); // also when it is the page already open
          a.textContent = comboLabel(combo);
          const blocks = blocksFor(combo, () => document.createElement("div"));
          blocks.setAttribute("aria-hidden", "true");
          a.append(blocks);
          thumbs.append(a);
        }
        list.append(label, thumbs);
      }
      detail.showModal();
      detail.scrollTop = 0;
    }

    // Copy buttons (the dialog's, and the combination page's): copy the colour as CSS, oklch(L C h),
    // and show a check mark for a moment.
    const copyTemplate = detail.querySelector(".copy");
    function copyButtonFor(css) {
      const button = copyTemplate.cloneNode(true);
      button.dataset.css = css;
      return button;
    }
    document.addEventListener("click", async (e) => {
      const button = e.target.closest(".copy");
      if (!button) return;
      try {
        await navigator.clipboard.writeText(button.dataset.css);
      } catch {
        return; // clipboard unavailable (e.g. not served from localhost or https)
      }
      button.classList.add("copied");
      clearTimeout(button.copiedTimer);
      button.copiedTimer = setTimeout(() => button.classList.remove("copied"), 1500);
    });
    // Clicking the backdrop (outside the dialog's content) closes it.
    detail.addEventListener("click", (e) => { if (e.target === detail) detail.close(); });

    try {
      const [colors, families, combinations, seasonal, printed] = await Promise.all(
        ["colors.json", "families.json", "combinations.json", "seasons.json", "print-gamut.json"].map((f) => fetch(f).then((r) => r.json()))
      );
      press = printed;
      colors.forEach((c, i) => Object.assign(c, { index: i, css: oklchText(c.oklch) }));
      const combos = combinations.map((ids, i) => ({ kind: "combination", number: i + 1, colors: ids.map((k) => colors[k]) }));
      // Seasonal combinations: six a month, January first.
      const seasons = seasonal.map((ids, i) => ({ kind: "season", number: i + 1, month: MONTHS[Math.floor(i / 6)], colors: ids.map((k) => colors[k]) }));
      // Colour index -> its combinations, in book order.
      const combosOf = colors.map(() => []), seasonsOf = colors.map(() => []);
      for (const combo of combos) for (const c of combo.colors) combosOf[c.index].push(combo);
      for (const combo of seasons) for (const c of combo.colors) seasonsOf[c.index].push(combo);
      data = { colors, combos, combosOf, seasons, seasonsOf };

      // Colors: one grid per colour family (the book groups its colours by hue), in book order, under
      // its name. Colours only in Volume 2 are where its colour index puts them. Then the wheel.
      for (const family of families) {
        const section = document.createElement("section");
        section.append(Object.assign(document.createElement("h2"), { className: "group-heading", textContent: family.name }));
        const ul = document.createElement("ul");
        ul.className = "grid";
        ul.append(...family.colors.map((i) => swatchItem(colors[i])));
        section.append(ul);
        views.colors.append(section);
      }

      // Combinations: in book order, in the book's three sections (2, 3 and 4 colours), each under its
      // name and its numbers.
      for (const [size, name] of SECTIONS) {
        const list = combos.filter((combo) => combo.colors.length === size);
        const heading = Object.assign(document.createElement("h2"), { className: "group-heading", textContent: name });
        const range = Object.assign(document.createElement("span"), { textContent: `${comboLabel(list[0])}–${comboLabel(list.at(-1))}` });
        heading.append(range);
        const ul = document.createElement("ul");
        ul.className = "combos";
        ul.append(...list.map((combo) => combinationItem(combo)));
        const section = document.createElement("section");
        section.dataset.size = size; // for the sub-navigation's choice of size
        section.append(heading, ul);
        views.combinations.append(section);
      }
      // ... after your combinations, if any (see renderYours).
      yours.section = Object.assign(document.createElement("section"), { className: "yours" });
      views.combinations.prepend(yours.section);
      loadYours();
      renderYours();

      // Seasons: month by month, in book order.
      MONTHS.forEach((month, m) => {
        const heading = Object.assign(document.createElement("h2"), { className: "group-heading", textContent: month });
        const ul = document.createElement("ul");
        ul.className = "combos seasons";
        ul.append(...seasons.slice(m * 6, m * 6 + 6).map((combo) => combinationItem(combo)));
        const section = document.createElement("section");
        section.dataset.month = m + 1; // for the sub-navigation's choice of month
        section.append(heading, ul);
        views.seasons.append(section);
      });

      buildPicker(colors, families);
      views.colors.append(makeWheel(colors, { views: true }).box, makeOstwald(colors));
      // Prepare the wheel background's hue table while the page is idle, so opening the wheel is quick.
      (window.requestIdleCallback ?? setTimeout)(() => gamut("screen").cusp());
      showView(); // a #combination/<number> (or #season, #create) link opened directly needs the data
    } catch (error) {
      console.error(error);
      document.querySelector("main").innerHTML = `<p class="error">Couldn't load the colour data. Serve this folder over HTTP, e.g. <code>python3 -m http.server</code>.</p>`;
    }

    // A colour block: shows its text on hover, opens the details on click (or does onClick).
    function colorButton(c, onClick = () => showDetail(c)) {
      const button = document.createElement("button");
      button.className = "swatch";
      button.style.setProperty("--color", c.css);
      button.style.setProperty("--ink", c.oklch[0] > 0.6 ? "rgb(0 0 0 / 0.75)" : "rgb(255 255 255 / 0.9)");
      button.setAttribute("aria-label", c.name);
      button.addEventListener("click", onClick);
      return button;
    }

    // A combination's number as shown (001-348; seasonal ones 01-72) and its page's address.
    function comboLabel(combo) {
      return String(combo.number).padStart(combo.kind === "season" ? 2 : 3, "0");
    }
    function comboHref(combo) {
      return `#${combo.kind}/${combo.number}`;
    }

    // Blocks for n colours laid out as in the book: Volume 1's layouts for 2 to 4 (see the CSS),
    // stacked for seasonal combinations and for more than 4.
    function emptyBlocks(n, stacked) {
      const blocks = document.createElement("div");
      blocks.className = stacked ? "blocks stack" : "blocks";
      if (stacked) blocks.style.setProperty("--n", n);
      else blocks.dataset.size = n;
      return blocks;
    }

    // The combination's colours laid out as in the book; make(colour) creates each block.
    function blocksFor(combo, make) {
      const blocks = emptyBlocks(combo.colors.length, combo.kind === "season");
      for (const c of combo.colors) {
        const block = make(c);
        block.style.setProperty("--color", c.css);
        blocks.append(block);
      }
      return blocks;
    }

    // A colour block that shows its name on hover and opens the colour dialog on click (or does onClick).
    function namedColorButton(c, onClick) {
      const button = colorButton(c, onClick);
      const name = document.createElement("span");
      // Where a line can break inside the words too long for their colour in the lists (at their
      // narrowest): after a slash, and at soft hyphens. A variant's letter stays with its mark ("- A").
      name.textContent = c.name.replace("/", "/\u200B").replace("Vanderpoel", "Vander\u00ADpoel")
        .replace("Pomegranate", "Pome\u00ADgran\u00ADate").replace(/ ([-|]) (\w)$/, " $1\u2060\u00A0$2");
      button.append(name);
      return button;
    }

    // A combination in a list: its number (a link to its page) above its colours; those in `shared`
    // marked (the colours it shares with the combination whose page this is). `named`: each colour's name
    // shown on hover (not where the colours are too small for it).
    function combinationItem(combo, shared = [], named = true) {
      const link = document.createElement("a");
      link.className = "combo-number";
      link.href = comboHref(combo);
      link.textContent = comboLabel(combo);
      const li = document.createElement("li");
      li.setAttribute("aria-label", `${combo.kind === "season" ? "Seasonal combination" : "Combination"} ${combo.number}`);
      li.append(link, blocksFor(combo, (c) => {
        const button = named ? namedColorButton(c) : colorButton(c);
        if (shared.includes(c)) button.classList.add("shared");
        return button;
      }));
      return li;
    }

    // Each colour's name (followed by the colour), CMYK and OKLCH (with a copy button): under each of
    // `size` colours side by side (Create shows 1 colour in 2 slots), or (row) in rows under the
    // combination, up to 4 to a row, the rows balanced (see the CSS).
    // A colour's name, then a small square of it (so it is clear which colour the values are of).
    // Every colour name shown as text gets its square (here, the picker's status, the colour dialog
    // and the wheel's panel); only names written on their own colour (the blocks' labels) don't.
    function namedLine(c) {
      const name = document.createElement("p");
      name.className = "named";
      name.append(c.name, chipOf(c));
      return name;
    }
    function chipOf(c) {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.style.setProperty("--color", c.css);
      return chip;
    }

    function infoFor(colors, row = false, size = colors.length) {
      const info = document.createElement("div");
      info.className = "combo-info";
      if (row) {
        info.classList.add("row");
        info.dataset.cols = Math.ceil(colors.length / Math.ceil(colors.length / 4));
      } else info.dataset.size = size;
      for (const c of colors) {
        const name = namedLine(c);
        const cmyk = document.createElement("p");
        cmyk.textContent = !c.token ? cmykText(c.cmyk) : c.cmyk ? `≈ ${cmykText(c.cmyk)}` : "Not in Wada's palette"; // a new colour's: an estimate
        const oklch = document.createElement("p");
        oklch.className = "oklch-line";
        const values = document.createElement("span");
        values.textContent = oklchValues(c.oklch);
        oklch.append(values, copyButtonFor(c.css));
        const cell = document.createElement("div");
        cell.append(name, cmyk, oklch);
        info.append(cell);
      }
      return info;
    }

    // Colours in an address: Wada's by their numbers in book order, 1-based, e.g. 1-46-89; a new colour by
    // its token, its OKLCH values (see oklchColour).
    function colorsCode(colors) {
      return colors.map(tokenOf).join("-");
    }
    function parseColors(text, most = MAX_PICKED) {
      const colors = [];
      for (const part of text.split("-")) {
        const c = colourOf(part);
        if (c && !colors.includes(c) && colors.length < most) colors.push(c);
      }
      return colors;
    }

    // New colours: none of Wada's, picked in Create from OKLCH's slices or Ostwald's cells. Each goes by a
    // token, in the address and in this browser: its OKLCH values, as Wada's are given (0.7234,0.1203,45.2).
    // An OKLCH colour is named by them rounded ("OKLCH 0.72 0.12 45°", or "OKLCH grey 0.72"); an Ostwald
    // cell's own colour (its OKLCH exactly a cell's) as its card is ("Ostwald 16PA", or "Ostwald grey A"),
    // so its code is never stored, only found again. Their CMYK is an estimate: OKLCH's made in the page
    // (estimateCMYK), Ostwald's as the Ostwald view's (ostwald-cmyk.json); none until it's in.
    function tokenOf(c) {
      return c.token ?? String(c.index + 1);
    }
    function indexIn(list, c) {
      return list.findIndex((p) => tokenOf(p) === tokenOf(c));
    }
    function oklchColour([L0, C0, h0]) {
      const oklch = [+L0.toFixed(4), +C0.toFixed(4), +C0.toFixed(4) ? +h0.toFixed(2) % 360 : 0], [L, C, h] = oklch, token = oklch.join(",");
      if (newColours.has(token)) return newColours.get(token);
      const own = ostwaldShared().cellOf(token);
      if (own) {
        return {
          token, oklch, css: oklchText(oklch), name: `Ostwald ${own.sector === null ? "grey " : ""}${own.code}`,
          ostwald: { sector: own.sector, level: own.a + own.b, ring: own.a - own.b, code: own.code, white: own.white, black: own.black },
          get cmyk() { return ostwaldCMYK?.[own.code] ?? null; },
        };
      }
      return {
        token, oklch, css: oklchText(oklch),
        name: C ? `OKLCH ${+L.toFixed(2)} ${+C.toFixed(C < 0.01 ? 3 : 2)} ${Math.round(h) % 360}°` : `OKLCH grey ${+L.toFixed(2)}`,
        get cmyk() { return estimateCMYK(oklch); },
      };
    }
    // Ostwald's system (made when first needed, by the Ostwald view or a new colour), with its cells'
    // estimated CMYK fetched once it is.
    function ostwaldShared() {
      if (!ostwaldCells) {
        ostwaldCells = ostwaldSystem(data.colors);
        fetch("ostwald-cmyk.json").then((r) => r.json()).then((d) => {
          if (Math.abs(d.offset - ostwaldCells.offset) >= 1e-4) return; // made for another calibration
          ostwaldCMYK = d.cmyk;
          if (!views.create.hidden && !create.previewing && create.picked.some((c) => c.token && c.ostwald)) renderStage();
        }).catch(() => {});
      }
      return ostwaldCells;
    }
    // The colour of a token (none if it's not one), a new one kept from then on.
    function colourOf(token) {
      if (/^\d+$/.test(token)) return data.colors[Number(token) - 1] ?? null;
      const v = /^([\d.]+),([\d.]+),([\d.]+)$/.exec(token)?.slice(1).map(Number);
      return v && v[0] <= 1 && v[1] <= 0.5 && v[2] < 360 ? kept(oklchColour(v)) : null; // (not a number: none)
    }
    function kept(c) {
      if (!c?.token) return c;
      if (!newColours.has(c.token)) newColours.set(c.token, c);
      return newColours.get(c.token);
    }
    // The new colours picked, remembered in this browser, the oldest first: the last 48 (those in the
    // combination kept).
    function remember(c) {
      if (!c.token || create.news.includes(c)) return;
      create.news.push(c);
      while (create.news.length > 48) {
        const k = create.news.findIndex((p) => !create.picked.includes(p));
        create.news.splice(Math.max(0, k), 1);
      }
      saveNews();
    }
    function forget(list) {
      create.news = create.news.filter((c) => !list.includes(c));
      create.picked = create.picked.filter((c) => !list.includes(c));
      create.active = null;
      create.note = "";
      saveNews();
      updateCreate();
    }
    function saveNews() {
      try { localStorage.setItem("create-new", colorsCode(create.news)); } catch {}
    }

    // Your combinations (see yours): read from this browser, changed, and shown in Combinations as a
    // section of their own before the book's, numbered in the order saved; each number opens it in
    // Create, and the × removes it (with an undo). Only the size the sub-navigation chooses, as the
    // book's (5 to 7 colours under All).
    function loadYours() {
      let list = null;
      try { list = JSON.parse(localStorage.getItem("create-saved") ?? "[]"); } catch {}
      yours.list = Array.isArray(list) ? [...new Set(list.filter((code) => typeof code === "string" && code))] : [];
    }
    function saveYours(list, undo = null) {
      yours.list = list;
      yours.undo = undo;
      try { localStorage.setItem("create-saved", JSON.stringify(list)); } catch {}
      renderYours();
    }
    function renderYours() {
      const heading = Object.assign(document.createElement("h2"), { className: "group-heading", textContent: "Your combinations" });
      const about = Object.assign(document.createElement("span"), { textContent: "saved in this browser" });
      if (yours.undo) {
        const { code, at } = yours.undo;
        const undo = Object.assign(document.createElement("button"), { type: "button", textContent: "Undo" });
        undo.setAttribute("aria-label", `Undo removing combination ${at + 1}`);
        undo.addEventListener("click", () => saveYours(yours.list.toSpliced(at, 0, code)));
        about.append(" · ", undo);
      }
      heading.append(about);
      const list = document.createElement("ul");
      list.className = "combos";
      yours.list.forEach((code, i) => {
        const colors = parseColors(code);
        if (colors.length < 2) return;
        const open = Object.assign(document.createElement("a"), { className: "combo-number", href: `#create/${code}`, textContent: i + 1, title: "Open in Create" });
        const remove = Object.assign(document.createElement("button"), { type: "button", className: "remove", title: "Remove" });
        remove.setAttribute("aria-label", `Remove your combination ${i + 1}`);
        remove.innerHTML = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>';
        remove.addEventListener("click", () => {
          saveYours(yours.list.filter((other) => other !== code), { code, at: i });
          yours.section.querySelector(".group-heading button").focus();
        });
        const head = document.createElement("div");
        head.className = "combo-head";
        head.append(open, remove);
        const blocks = emptyBlocks(colors.length, colors.length > 4); // as in Create
        for (const c of colors) {
          const button = namedColorButton(c, c.token ? () => showNewDetail(c) : undefined);
          button.style.setProperty("--color", c.css);
          blocks.append(button);
        }
        const li = document.createElement("li");
        li.dataset.size = colors.length; // for the sub-navigation's choice of size
        li.setAttribute("aria-label", `Your combination ${i + 1}`);
        li.append(head, blocks);
        list.append(li);
      });
      yours.section.replaceChildren(heading, list);
      yours.section.hidden = !list.children.length && !yours.undo;
    }
    // A new colour's card (in your combinations): its values, as on the view it was picked from.
    function showNewDetail(c) {
      const own = c.ostwald ? `the Ostwald system's own colour for cell ${c.ostwald.code}` : "OKLCH's own";
      const line = c.ostwald ? `white ${Math.round(c.ostwald.white * 100)}% · black ${Math.round(c.ostwald.black * 100)}%` : "";
      const open = () => showComputedDetail(c, c.name, c.cmyk, line, `Not one of Wada's colours: ${own}${c.cmyk ? ", so its CMYK is an estimate" : ""}.`);
      if (!c.ostwald && !printTable) loadPrintTable().then(open);
      else open();
    }
    // Saved in another tab: the same here.
    addEventListener("storage", (e) => {
      if (e.key !== "create-saved" || !data) return;
      loadYours();
      yours.undo = null;
      renderYours();
      if (!views.create.hidden && !create.previewing) renderStage();
    });

    // Opens the Create view: with the colours in the address, or else the combination composed last.
    function openCreate(arg) {
      create.replaced = null;
      if (arg !== undefined) create.picked = parseColors(arg);
      else if (!create.picked.length) {
        let saved = null;
        try { saved = localStorage.getItem("create"); } catch {}
        create.picked = parseColors(saved ?? "");
      }
      create.picked.forEach(remember);
      create.active = null;
      create.note = "";
      showSource();
      updateCreate();
    }

    // After every change: the address, the saved copy, the composition and the picker's marks.
    function updateCreate(focusSlot) {
      const code = colorsCode(create.picked);
      history.replaceState(null, "", code ? `#create/${code}` : "#create");
      try { localStorage.setItem("create", code); } catch {}
      renderStage(focusSlot);
      renderRelated();
      for (const c of data.colors) {
        const at = create.picked.indexOf(c), button = pickerButtons[c.index];
        button.setAttribute("aria-pressed", at >= 0);
        button.firstElementChild.textContent = at >= 0 ? at + 1 : "";
      }
      renderNews();
      for (const view of pickers.values()) view.numbers(create.picked);
      // OKLCH's new colours' CMYK, estimated once the print profile's table is in
      if (!printTable && create.picked.some((c) => c.token && !c.ostwald)) loadPrintTable().then(() => { if (printTable && !create.previewing) renderStage(); });
    }

    // Under the composition: the book's combinations with any of its colours (Wada's: new colours aren't
    // in the book), as a colour's card lists them: first those with several of them, the most first;
    // then each colour's, in the composition's order. In each, a row per kind: 2, 3 and 4 colours, then
    // the seasonal ones (with their month). Its colours in
    // them are marked, as on a combination's page. Each number opens its page; each ＋ puts that
    // combination here instead (see useCombination).
    function renderRelated() {
      const box = views.create.querySelector(".create-related");
      const wada = create.picked.filter((c) => !c.token);
      const shares = (combo) => combo.colors.filter((c) => wada.includes(c)).length;
      const all = [...data.combos, ...data.seasons].filter((combo) => shares(combo) > 0);
      const groups = [];
      for (let n = wada.length; n > 1; n--) {
        const list = all.filter((combo) => shares(combo) === n);
        if (list.length) groups.push([n === wada.length ? (n === 2 ? "With both" : `With all ${n}`) : `With ${n} of them`, list]);
      }
      for (const c of wada) {
        const list = all.filter((combo) => shares(combo) === 1 && combo.colors.includes(c));
        if (list.length) groups.push([c, list]);
      }
      const here = colorsCode(create.picked);
      const parts = [];
      if (all.length) parts.push(Object.assign(document.createElement("p"), {
        className: "section-label",
        textContent: `In the book: ${all.length} combination${all.length === 1 ? "" : "s"} with ${wada.length === 1 ? "this colour" : "these colours"}.`,
      }));
      for (const [title, list] of groups) {
        const heading = document.createElement("h2");
        heading.className = "group-heading";
        if (typeof title === "string") heading.append(title);
        else heading.append(`With ${title.name}`, chipOf(title));
        heading.append(Object.assign(document.createElement("span"), { textContent: list.length }));
        const group = document.createElement("section");
        group.append(heading);
        for (const [kind, label] of [[2, "2 colours"], [3, "3 colours"], [4, "4 colours"], ["season", "Seasonal"]]) {
          const ofKind = list.filter((combo) => (kind === "season" ? combo.kind === "season" : combo.kind === "combination" && combo.colors.length === kind));
          if (!ofKind.length) continue;
          const ul = document.createElement("ul");
          ul.className = kind === "season" ? "combos seasons" : "combos";
          ul.dataset.kind = kind;
          ul.append(...ofKind.map((combo) => {
            const li = combinationItem(combo, wada, false); // too small for the colours' names
            if (combo.month) Object.assign(li.querySelector(".combo-number"), { textContent: `${comboLabel(combo)} · ${combo.month.slice(0, 3)}`, title: combo.month });
            const use = Object.assign(document.createElement("button"), { type: "button", className: "use", disabled: colorsCode(combo.colors) === here });
            use.title = use.disabled ? "Your combination is this one" : "Use it here, in place of your combination";
            use.setAttribute("aria-label", `Use ${combo.kind === "season" ? "seasonal combination" : "combination"} ${combo.number} in place of yours`);
            use.innerHTML = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9"/></svg>';
            use.addEventListener("click", () => useCombination(combo));
            const head = document.createElement("div");
            head.className = "combo-head";
            head.append(li.querySelector(".combo-number"), use);
            li.prepend(head);
            return li;
          }));
          group.append(Object.assign(document.createElement("p"), { className: "related-kind", textContent: label }), ul);
        }
        parts.push(group);
      }
      box.replaceChildren(...parts);
    }

    // A combination of the book in place of the composition: the note offers to undo it, until the
    // composition changes. The composition is shown from its top.
    function useCombination(combo) {
      create.replaced = {
        previous: [...create.picked], code: colorsCode(combo.colors),
        label: combo.kind === "season" ? `seasonal combination ${comboLabel(combo)}` : `combination ${comboLabel(combo)}`,
      };
      create.picked = [...combo.colors];
      create.active = null;
      create.note = "";
      updateCreate();
      const main = views.create.querySelector(".create-main");
      if (matchMedia("(min-width: 64rem)").matches) main.scrollTo({ top: 0 });
      else scrollTo({ top: 0 });
      views.create.querySelector(".create-stage .undo")?.focus({ preventScroll: true });
    }

    // The composition: the colours laid out as in the book (2 to 7; empty slots until there are 2),
    // each colour's values, a message, and actions. With a preview ({ colors, at }), its colours
    // instead, colour `at` being the one not picked yet.
    function renderStage(focusSlot, preview) {
      const { picked, active } = create;
      const shown = preview?.colors ?? picked;
      const size = Math.max(2, shown.length);
      const blocks = emptyBlocks(size, size > 4);
      for (let i = 0; i < size; i++) {
        if (i < shown.length) blocks.append(slotButton(shown[i], i, !preview));
        else blocks.append(Object.assign(document.createElement("div"), { className: "empty" }));
      }
      const figure = document.createElement("div");
      figure.className = "combo-figure";
      figure.append(blocks);
      let info = null;
      if (shown.length) {
        info = size > 3 ? infoFor(shown, true) : infoFor(shown, false, size);
        if (preview) info.children[preview.at].classList.add("preview");
      }

      const note = document.createElement("p");
      note.className = "section-label";
      note.setAttribute("aria-live", "polite");
      const replaced = create.replaced?.code === colorsCode(picked) ? create.replaced : null; // until the composition changes
      if (replaced && !preview) {
        const undo = Object.assign(document.createElement("button"), { type: "button", className: "undo", textContent: "Undo" });
        undo.addEventListener("click", () => {
          create.picked = replaced.previous;
          create.replaced = null;
          create.active = null;
          create.picked.forEach(remember);
          updateCreate();
        });
        note.append(`In place of your combination: ${replaced.label}. `, undo);
      } else if (create.note) note.textContent = create.note;
      else if (active !== null) note.textContent = "Pick a colour to replace it, or select another to swap them.";
      else if (shown.length < 2) note.textContent = `Pick 2 to ${MAX_PICKED} colours.`;
      else {
        // Book combinations (Volume 1's and the seasonal ones) that have all these colours: with new colours,
        // all of Wada's here.
        const wada = shown.filter((c) => !c.token), fresh = wada.length < shown.length;
        const has = (combo) => wada.every((c) => combo.colors.includes(c));
        const groups = wada.length < 2 ? [] : [["", data.combos.filter(has)], ["Seasons:", data.seasons.filter(has)]].filter(([, list]) => list.length);
        if (fresh && wada.length < 2) note.textContent = "New colours aren't in the book.";
        else if (!groups.length) note.textContent = fresh ? "New colours aren't in the book, and Wada's here aren't together in it." : "Not together in the book.";
        else {
          note.append(fresh ? "Wada's colours here, together in the book:" : "Together in the book:");
          groups.forEach(([title, list], g) => {
            if (title) note.append(g ? " · " : " ", title);
            for (const combo of list) {
              const a = document.createElement("a");
              a.href = comboHref(combo);
              a.textContent = comboLabel(combo);
              note.append(" ", a);
            }
          });
        }
      }

      const actions = document.createElement("p");
      actions.className = "actions";
      if (picked.length) {
        // Save: into your combinations (in Combinations), from 2 colours; again, out of them.
        const code = colorsCode(picked), saved = yours.list.includes(code);
        const save = Object.assign(document.createElement("button"), { type: "button", className: "save", textContent: saved ? "Saved" : "Save", disabled: picked.length < 2 });
        save.setAttribute("aria-pressed", saved);
        save.title = saved ? "Saved in Combinations, under Your combinations (in this browser). Click to remove it."
          : picked.length < 2 ? "Pick at least 2 colours to save them." : "Save it in Combinations, under Your combinations (in this browser).";
        save.addEventListener("click", () => {
          saveYours(saved ? yours.list.filter((other) => other !== code) : [...yours.list, code]);
          renderStage();
          views.create.querySelector(".actions .save")?.focus();
        });
        actions.append(save);
        const copyLink = Object.assign(document.createElement("button"), { type: "button", textContent: "Copy link" });
        copyLink.addEventListener("click", async () => {
          try { await navigator.clipboard.writeText(location.href); } catch { return; }
          copyLink.textContent = "Copied";
          setTimeout(() => (copyLink.textContent = "Copy link"), 1500);
        });
        const clear = Object.assign(document.createElement("button"), { type: "button", textContent: "Clear" });
        clear.addEventListener("click", () => {
          create.picked = [];
          create.active = null;
          create.note = "";
          updateCreate();
        });
        actions.append(copyLink, clear);
      }

      // A cross or a stack: its values, the message and the actions together, centred under it.
      if (size > 3) {
        const values = document.createElement("div");
        values.className = "combo-values";
        values.append(info, note, actions);
        figure.append(values);
        views.create.querySelector(".create-stage").replaceChildren(figure);
      } else {
        if (info) figure.append(info);
        views.create.querySelector(".create-stage").replaceChildren(figure, note, actions);
      }
      create.previewing = Boolean(preview);
      if (focusSlot !== undefined) blocks.children[focusSlot]?.focus();
    }

    // A colour of the composition: click it, then another, to swap them (or then a colour in the
    // picker, to replace it); or drag it onto another. Delete or Backspace removes it.
    function slotButton(c, i, marked = true) { // marked: show the selected slot (not in a preview)
      const button = namedColorButton(c, () => { if (!create.dragged) selectSlot(i); });
      button.dataset.slot = i;
      button.setAttribute("aria-pressed", marked && create.active === i);
      button.addEventListener("pointerdown", (e) => dragSlot(e, button, i));
      button.addEventListener("keydown", (e) => {
        if (e.key !== "Delete" && e.key !== "Backspace") return;
        e.preventDefault();
        create.picked.splice(i, 1);
        create.active = null;
        create.note = "";
        updateCreate(create.picked.length ? Math.min(i, create.picked.length - 1) : undefined);
      });
      return button;
    }

    function swapSlots(a, b) {
      const p = create.picked;
      [p[a], p[b]] = [p[b], p[a]];
    }

    function selectSlot(i) {
      const { active } = create;
      create.note = "";
      if (active === null) create.active = i;
      else {
        if (active !== i) swapSlots(active, i);
        create.active = null;
      }
      updateCreate(i);
    }

    // Dragging a colour of the composition: it follows the pointer; dropped on another colour, they swap.
    function dragSlot(e, button, i) {
      if (e.button !== 0 || !e.isPrimary) return;
      const x0 = e.clientX, y0 = e.clientY;
      const others = [...button.parentElement.querySelectorAll("[data-slot]")].filter((b) => b !== button);
      let dragging = false, target = null;
      button.setPointerCapture(e.pointerId);
      const move = (ev) => {
        const dx = ev.clientX - x0, dy = ev.clientY - y0;
        if (!dragging && Math.hypot(dx, dy) < 6) return; // still a click
        dragging = true;
        button.classList.add("dragging");
        button.style.transform = `translate(${dx}px, ${dy}px) scale(0.85)`; // smaller, to show the target
        target = others.find((b) => {
          const r = b.getBoundingClientRect();
          return ev.clientX >= r.left && ev.clientX < r.right && ev.clientY >= r.top && ev.clientY < r.bottom;
        }) ?? null;
        for (const b of others) b.classList.toggle("drop-target", b === target);
      };
      const end = (ev) => {
        button.removeEventListener("pointermove", move);
        button.removeEventListener("pointerup", end);
        button.removeEventListener("pointercancel", end);
        if (!dragging) return; // a click, handled by the click listener
        create.dragged = true; // ignore the click that follows this pointerup
        setTimeout(() => (create.dragged = false));
        if (target && ev.type === "pointerup") swapSlots(i, Number(target.dataset.slot));
        create.active = null;
        create.note = "";
        updateCreate();
      };
      button.addEventListener("pointermove", move);
      button.addEventListener("pointerup", end);
      button.addEventListener("pointercancel", end);
    }

    // A colour in the picker: adds it to the composition (or replaces the selected slot); if it is
    // already there, removes it.
    function pick(c) {
      c = kept(c);
      const { picked } = create;
      const at = picked.indexOf(c);
      create.note = "";
      if (at >= 0) picked.splice(at, 1);
      else if (create.active !== null) picked[create.active] = c;
      else if (picked.length < MAX_PICKED) picked.push(c);
      else create.note = `${MAX_PICKED} colours at most: click a picked colour to remove it, or select one in the combination to replace it.`;
      if (picked.includes(c)) remember(c);
      create.active = null;
      updateCreate();
    }

    // Where picking c would put it (see pick): the composition it would make and its place in it; none
    // if c would be removed instead, or there is no room.
    function previewOf(c) {
      const { picked, active } = create;
      if (indexIn(picked, c) >= 0) return null;
      const colors = [...picked];
      const at = active ?? colors.length;
      if (at >= MAX_PICKED) return null;
      colors[at] = c;
      return { colors, at };
    }

    // The colour picker: every colour, by family as in the Colors view, small, then the new colours picked
    // (remembered); or, as the header's choice says, the OKLCH or Ostwald view, to pick any colour of its
    // slices. A picked colour shows its place in the combination (on the views, a numbered mark where it
    // is); hovering or focusing one shows its values above, and hovering one shows it in the composition
    // where picking it would put it.
    function buildPicker(colors, families) {
      const picker = views.create.querySelector(".picker");
      const status = picker.querySelector(".picker-status");
      const showStatus = (c) => status.replaceChildren(namedLine(c), Object.assign(document.createElement("p"), {
        textContent: `${c.cmyk ? `${c.token ? "≈ " : ""}${cmykText(c.cmyk)}  ` : ""}${oklchValues(c.oklch)}`, // a new colour's CMYK: an estimate, if any
      }));
      // Changing the composition doesn't move the picker. On narrow screens the composition is above it:
      // when it changes height, scroll by as much, so the picker stays under the pointer. (On wide ones
      // each scrolls on its own.)
      const steady = (change) => {
        const top = picker.getBoundingClientRect().top;
        change();
        scrollBy(0, picker.getBoundingClientRect().top - top);
      };
      const preview = (c) => {
        const p = previewOf(c);
        if (p) steady(() => renderStage(undefined, p));
      };
      const unpreview = () => { if (create.previewing) steady(() => renderStage()); };
      const wire = (button, c) => {
        button.addEventListener("pointerenter", (e) => {
          showStatus(c);
          if (e.pointerType !== "touch") preview(c); // a tap picks it at once
        });
        button.addEventListener("focus", () => showStatus(c));
        button.addEventListener("pointerleave", () => {
          status.replaceChildren();
          unpreview();
        });
        button.addEventListener("blur", () => status.replaceChildren());
      };
      for (const family of families) {
        const ul = document.createElement("ul");
        ul.className = "grid";
        for (const i of family.colors) {
          const c = colors[i];
          const button = colorButton(c, () => steady(() => pick(c)));
          button.append(document.createElement("span"));
          wire(button, c);
          pickerButtons[i] = button;
          const li = document.createElement("li");
          li.append(button);
          ul.append(li);
        }
        picker.append(ul);
      }

      // After Wada's, the new colours picked, as they are; Delete or Backspace forgets one (out of the
      // combination too), and Clear forgets those not in the combination.
      const fresh = Object.assign(document.createElement("div"), { className: "new-colours" });
      const label = Object.assign(document.createElement("p"), { className: "section-label" });
      const clear = Object.assign(document.createElement("button"), { type: "button", textContent: "Clear", title: "Forget the new colours that aren't in the combination" });
      clear.addEventListener("click", () => steady(() => forget(create.news.filter((c) => !create.picked.includes(c)))));
      label.append("New colours", clear);
      const list = Object.assign(document.createElement("ul"), { className: "grid" });
      fresh.append(label, list);
      picker.append(fresh);
      const items = new Map(); // new colour -> its item
      const item = (c) => {
        const button = colorButton(c, () => steady(() => pick(c)));
        button.append(document.createElement("span"));
        wire(button, c);
        button.addEventListener("keydown", (e) => {
          if (e.key !== "Delete" && e.key !== "Backspace") return;
          e.preventDefault();
          const k = create.news.indexOf(c);
          steady(() => forget([c]));
          items.get(create.news[Math.min(k, create.news.length - 1)])?.firstChild.focus();
        });
        const li = document.createElement("li");
        li.append(button);
        items.set(c, li);
        return li;
      };
      renderNews = () => {
        const lis = create.news.map((c) => items.get(c) ?? item(c));
        if (lis.length !== list.children.length || lis.some((li, k) => li !== list.children[k])) list.replaceChildren(...lis); // only if changed: a focused one keeps the focus
        for (const c of items.keys()) if (!create.news.includes(c)) items.delete(c);
        for (const [c, li] of items) {
          const at = create.picked.indexOf(c), button = li.firstChild;
          button.setAttribute("aria-pressed", at >= 0);
          button.firstElementChild.textContent = at >= 0 ? at + 1 : "";
        }
        fresh.hidden = !create.news.length;
        clear.hidden = create.news.every((c) => create.picked.includes(c));
      };
      try { create.news = parseColors(localStorage.getItem("create-new") ?? "", Infinity).filter((c) => c.token); } catch {}

      // OKLCH's and Ostwald's views, for picking (see makeWheel and makeOstwald): each made when first shown.
      // A picked colour's mark: a disc of it with its number, which shows its values when hovered and takes
      // it out of the combination when clicked.
      const NS = "http://www.w3.org/2000/svg";
      const svgEl = (name, attrs) => {
        const e = document.createElementNS(NS, name);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        return e;
      };
      const badge = (c, n, [x, y], r) => {
        const g = svgEl("g", { class: "pick-mark", transform: `translate(${x} ${y})`, role: "button", "aria-label": `${c.name}, colour ${n} of the combination: take it out` });
        const number = svgEl("text", { "font-size": r * 1.2, "text-anchor": "middle", "dominant-baseline": "central", fill: c.oklch[0] > 0.6 ? "rgb(0 0 0 / 0.8)" : "rgb(255 255 255 / 0.95)" });
        number.textContent = n;
        g.append(svgEl("circle", { r, fill: c.css, "stroke-width": r * 0.15 }), number);
        g.addEventListener("pointerenter", () => showStatus(c));
        g.addEventListener("pointerleave", () => status.replaceChildren());
        g.addEventListener("click", () => steady(() => pick(c)));
        return g;
      };
      const hooks = {
        hover: (c, e) => {
          showStatus(c);
          if (e?.pointerType && e.pointerType !== "touch") preview(c); // (not on focus: as the grid)
        },
        leave: () => {
          status.replaceChildren();
          unpreview();
        },
        pick: (c) => steady(() => pick(c)),
        oklch: oklchColour,
        ostwald: (own) => oklchColour(own.oklch),
        badge,
      };
      showSource = () => {
        const from = views.create.dataset.show;
        if ((from === "oklch" || from === "ostwald") && !pickers.has(from)) {
          const view = from === "oklch" ? makeWheel(colors, { views: true, picker: hooks }) : makeOstwald(colors, { picker: hooks });
          picker.append(view.box);
          pickers.set(from, view);
        }
        pickers.get(from)?.numbers(create.picked); // now that it's shown, where they are
      };
      // What it shows, chosen at its top (and remembered): the grid, OKLCH or Ostwald.
      const sources = Object.assign(document.createElement("div"), { className: "picker-source" });
      sources.innerHTML = `<span>Pick from</span><div class="view-switch" role="group" aria-label="Pick from">`
        + `<button type="button" data-source="grid">Grid</button><button type="button" data-source="oklch">OKLCH</button><button type="button" data-source="ostwald">Ostwald</button></div>`;
      picker.prepend(sources);
      const choose = (from) => {
        views.create.dataset.show = from;
        for (const b of sources.querySelectorAll("[data-source]")) b.setAttribute("aria-pressed", b.dataset.source === from);
        try { localStorage.setItem("create-show", from); } catch {}
      };
      for (const b of sources.querySelectorAll("[data-source]")) {
        b.addEventListener("click", () => {
          choose(b.dataset.source);
          status.replaceChildren();
          if (!views.create.hidden) showSource();
        });
      }
      let saved = null;
      try { saved = localStorage.getItem("create-show"); } catch {}
      choose(["oklch", "ostwald"].includes(saved) ? saved : "grid");
    }

    // Escape cancels a selected slot.
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape" || views.create.hidden || detail.open || create.active === null) return;
      const focusSlot = create.active;
      create.active = null;
      updateCreate(focusSlot);
    });

    // One combination's pages (kind "combination" or "season"; tab one of TABS): its colours on their
    // own, large, with each colour's values; the combinations of one kind that share a colour with it
    // (by section or month; in each, most shared colours first, then in book order); or its colours on
    // the wheel. The other pages start with its number and its colours, small. Previous and next keep
    // the page.
    function renderCombination(kind, number, tab = "") {
      const view = views[kind];
      const all = kind === "season" ? data.seasons : data.combos;
      const combo = all[number - 1];
      if (!combo) {
        comboSubnav.querySelector(".pager").replaceChildren();
        comboSubnav.querySelector(".tabs").replaceChildren();
        view.replaceChildren(Object.assign(document.createElement("p"), { className: "error", textContent: "No such combination." }));
        document.title = "No such combination | Wada Sanzo";
        return;
      }
      if (!TABS.some(([t]) => t === tab)) tab = "";
      const shared = (other) => other.colors.filter((c) => combo.colors.includes(c)).length;
      const relatedIn = (list) => list
        .filter((other) => other !== combo && shared(other) > 0)
        .sort((a, b) => shared(b) - shared(a) || a.number - b.number);
      const related = { combinations: relatedIn(data.combos), seasons: relatedIn(data.seasons) };

      // Sub-navigation: previous, this one and next (also the arrow keys), and the tabs, with how many related.
      const suffix = tab ? `/${tab}` : "";
      const step = (other, rel, text) => other
        ? [Object.assign(document.createElement("a"), { href: comboHref(other) + suffix, rel, textContent: text(comboLabel(other)) })]
        : [];
      const here = Object.assign(document.createElement("span"), { textContent: comboLabel(combo) });
      here.setAttribute("aria-current", "page");
      comboSubnav.querySelector(".pager").replaceChildren(
        ...step(all[number - 2], "prev", (label) => `← ${label}`), here, ...step(all[number], "next", (label) => `${label} →`));
      comboSubnav.querySelector(".tabs").replaceChildren(...TABS.map(([t, label]) => {
        const count = related[t]?.length;
        const text = count === undefined ? label : `${label} ${count}`;
        if (count === 0) {
          const span = Object.assign(document.createElement("span"), { textContent: text });
          span.setAttribute("aria-disabled", "true");
          return span;
        }
        const a = Object.assign(document.createElement("a"), { href: comboHref(combo) + (t ? `/${t}` : ""), textContent: text });
        if (t === tab) a.setAttribute("aria-current", "page");
        return a;
      }));

      const name = combo.month ? `${comboLabel(combo)} · ${combo.month}` : comboLabel(combo);
      const title = document.createElement("h1");
      title.className = "combo-number";
      title.textContent = name;
      view.dataset.tab = tab || "colours";
      document.title = `${name}${tab ? ` · ${TABS.find(([t]) => t === tab)[1]}` : ""} | Wada Sanzo`;

      if (!tab) {
        const figure = document.createElement("div");
        figure.className = "combo-figure";
        // Under each colour when they're side by side (2 or 3); in rows for a cross or a stack.
        const info = infoFor(combo.colors, combo.kind === "season" || combo.colors.length === 4);
        const edit = document.createElement("a");
        edit.href = `#create/${colorsCode(combo.colors)}`;
        edit.textContent = "Edit in Create";
        const actions = document.createElement("p");
        actions.className = "actions";
        actions.append(edit);
        const blocks = blocksFor(combo, (c) => namedColorButton(c));
        if (kind === "combination") { // its number as in the book: see .plate
          const plate = document.createElement("div");
          plate.className = "plate";
          plate.append(title, blocks);
          figure.append(plate);
        } else figure.append(title, blocks);
        if (info.classList.contains("row")) { // the rows are wider than the colours: they go together
          const below = document.createElement("div");
          below.className = "combo-values";
          below.append(info, actions);
          figure.append(below);
        } else figure.append(info, actions);
        view.replaceChildren(figure);
        return;
      }

      const ref = document.createElement("div");
      ref.className = "combo-ref";
      ref.append(title, blocksFor(combo, (c) => colorButton(c))); // too small for the colours' names
      if (tab === "wheel") {
        comboWheel ??= makeWheel(data.colors);
        comboWheel.mark(combo.colors);
        ref.append(comboWheel.panel);
        view.replaceChildren(ref, comboWheel.wheel);
        return;
      }

      const items = related[tab];
      if (!items.length) {
        const noun = tab === "seasons" ? "seasonal combination" : "combination";
        view.replaceChildren(ref, Object.assign(document.createElement("p"), { className: "error", textContent: `No ${noun} shares a colour with this one.` }));
        return;
      }
      // Grouped as on their own pages: Volume 1's by section, the seasonal ones by month.
      const seasonal = tab === "seasons";
      const groups = seasonal
        ? MONTHS.map((month) => [month, (c) => c.month === month])
        : SECTIONS.map(([size, sectionName]) => [sectionName, (c) => c.colors.length === size]);
      const box = document.createElement("section");
      box.className = seasonal ? "related-months" : "related";
      const next = { 6: 0, 3: 0, 2: 0 }; // months side by side: the next free column, per number of columns
      for (const [groupName, inGroup] of groups) {
        const inThis = items.filter(inGroup);
        if (!inThis.length) continue;
        const heading = Object.assign(document.createElement("h2"), { className: "group-heading", textContent: groupName });
        heading.append(Object.assign(document.createElement("span"), { textContent: inThis.length }));
        const list = document.createElement("ul");
        list.className = seasonal ? "combos seasons" : "combos";
        list.append(...inThis.map((other) => combinationItem(other, combo.colors)));
        const group = document.createElement("div");
        if (seasonal) { // where the month goes (see the CSS): after the previous one and an empty column, or on a new row
          for (const cols of [6, 3, 2]) {
            const width = Math.min(inThis.length, cols);
            if (next[cols] > 0 && next[cols] + width > cols) next[cols] = 0;
            group.style.setProperty(`--at-${cols}`, next[cols] + 1);
            group.style.setProperty(`--n-${cols}`, width);
            next[cols] += width + 1;
          }
        }
        group.append(heading, list);
        box.append(group);
      }
      view.replaceChildren(ref, box);
    }

    // Left and right arrow keys: the previous and next combination, on the same page.
    document.addEventListener("keydown", (e) => {
      if (comboSubnav.hidden || detail.open || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
      const rel = { ArrowLeft: "prev", ArrowRight: "next" }[e.key];
      const link = rel && comboSubnav.querySelector(`[rel="${rel}"]`);
      if (!link) return;
      e.preventDefault();
      location.hash = link.hash;
    });

    function swatchItem(c) {
      const button = colorButton(c);
      const inGrid = document.createElement("span");
      inGrid.className = "in-grid";
      inGrid.textContent = c.cmyk.map((v, j) => `${"CMYK"[j]} ${v}`).join("\n");
      const inRows = document.createElement("span");
      inRows.className = "in-rows";
      for (const text of [c.name, cmykText(c.cmyk), oklchValues(c.oklch)]) {
        const cell = document.createElement("span");
        cell.textContent = text;
        inRows.append(cell);
      }
      button.append(inGrid, inRows);
      const li = document.createElement("li");
      li.append(button);
      return li;
    }

    // The arrow keys, anywhere on the page, for a view with slices (`box`, its layout, while shown): the
    // next slice, as its control or the arrows under its pages would. Up and left go back (to the level
    // above, or the previous pages), down and right on; `go(step)` says false if the view has no slices
    // just then. Not while typing in a field, nor where the keys already do something (the level control,
    // the dial, the 3D solid, which have the focus then), nor with a card open.
    function onArrows(box, go) {
      document.addEventListener("keydown", (e) => {
        const step = { ArrowUp: -1, ArrowLeft: -1, ArrowDown: 1, ArrowRight: 1 }[e.key];
        if (!step || e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey || detail.open) return;
        if (!box.getClientRects().length || e.target.closest?.("input, textarea, select, [contenteditable]")) return;
        if (go(step) !== false) e.preventDefault();
      });
    }

    // Donut wheel on a polar grid: angle = OKLCH hue (counter-clockwise from the right, 10° slices),
    // distance from the centre = chroma (8 rings, spaced by the square root of chroma so the many
    // muted colours get room). Colours sharing a cell split it side by side, in hue order; empty
    // cells stay as gaps. Near-neutral colours (no meaningful hue) form the inner ring, light to dark.
    // Returns the wheel, its info panel (the colour under the pointer), and mark(colours), which shows
    // a combination's colours on it.
    // With `views` (the Colors page's wheel), it also returns `box`: the wheel with its switches. The
    // view: Flat, the wheel above, every colour at once, its lightness left out; or 2D, a slice of OKLCH's
    // solid (lightness up its axis), across the axis (one lightness, seen from above, as the wheel is) or
    // through it (a hue's page and the opposite hue's, back to back), with its control beside it. The
    // marks: squares, each colour filling its piece of its cell, as above; or dots, each colour at its
    // exact place.
    // With `picker` (the creator's, with views), it's for picking colours: Flat and 2D only, and hovering
    // one of Wada's colours or a point or cell of the slice, or clicking it, goes to the picker (hover(colour,
    // event), leave(), pick(colour); oklch([L, C, h]) makes a colour of the slice's one); and numbers(list)
    // marks the colours picked where they are on what's shown (badge(colour, number, [x, y], r) makes
    // each mark). Its choices are saved apart from the Colors page's.
    function makeWheel(colors, { views = false, picker = null } = {}) {
      const P = picker ? "create-" : ""; // its saved choices' and its ids' prefix
      // The range shown, Screen (Rec. 2020) or Print (the press), as the switch says (see gamut()); the
      // combination pages' wheel, without the switch, shows Screen's.
      let range = "screen", G = gamut(range);
      const SLICE = 10, BANDS = 8, NEUTRAL_C = 0.02, LEVELS = 20; // (the 2D view's lightness levels: 21, 0.05 apart)
      const RING = [0.25, 1], GREYS = [0.13, 0.23];
      const panel = Object.assign(document.createElement("aside"), { className: "wheel-panel" });
      panel.setAttribute("aria-live", "polite");
      panel.innerHTML = `<div class="detail-swatch"></div><h2></h2><p data-field="cmyk"></p><p data-field="oklch"></p>`;
      const wheel = Object.assign(document.createElement("div"), { className: "wheel" });
      wheel.innerHTML = `<canvas class="wheel-bg" aria-hidden="true"></canvas>`
        + `<svg viewBox="-1.02 -1.02 2.04 2.04" role="group" aria-label="Colour wheel"></svg>`;
      const svg = wheel.querySelector("svg");
      const NS = "http://www.w3.org/2000/svg";
      const svgEl = (name, attrs = {}) => {
        const e = document.createElementNS(NS, name);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        return e;
      };
      const overlay = (name) => svgEl("path", { class: name }); // drawn over the colours
      const shape = overlay("shape"), marks = overlay("marks"), highlight = overlay("highlight");
      // Under the colours, in 2D: the slice's edge (as far as the range shown goes) and, across the axis,
      // the rim, for scale.
      const sliceEdge = svgEl("path", { class: "gamut" }), rim = svgEl("path", { class: "rim" });
      const layer = svgEl("g"); // the colours
      svg.append(...(views ? [sliceEdge, rim] : []), layer, shape, marks, highlight);
      const segments = new Map(); // colour -> its path, outline, and (if not grey) hue angle and centre
      const spots = new Map(); // colour -> its dot's centre, where it's a dot
      const pt = polarPoint, arc = ringSector;
      const polar = (r, deg) => [r * Math.cos((deg * Math.PI) / 180), -r * Math.sin((deg * Math.PI) / 180)]; // as polarPoint
      const circle = (x, y, r) => `M ${x + r} ${y} A ${r} ${r} 0 1 0 ${x - r} ${y} A ${r} ${r} 0 1 0 ${x + r} ${y} Z`;

      // Makes `el` a colour's: hovering or focusing it outlines `d` and shows the colour in the panel;
      // clicking it (or Enter) opens its card. In 2D the slice round it is as light as its level, so round
      // a dark one (a level of lightness 0.6 or less, as the lightness levels' labels) the outline is
      // light, and so is the ring round Wada's colour's own mark (dark round the others).
      let onSlice = false; // in 2D
      const dark = (L) => 1 - Math.round((1 - L) * LEVELS) / LEVELS <= 0.6; // (its level, as levelOf)
      const outlineAt = (d, L) => {
        highlight.setAttribute("d", d);
        highlight.classList.toggle("on-dark", onSlice && dark(L));
      };
      const ring = (el, c) => { if (onSlice) el.classList.add(dark(c.oklch[0]) ? "on-dark" : "on-light"); };
      const hide = () => { highlight.removeAttribute("d"); panel.classList.remove("show"); picker?.leave(); };
      const target = (el, c, d) => {
        el.setAttribute("tabindex", "0");
        el.setAttribute("role", "button");
        el.setAttribute("aria-label", c.name);
        const show = (e) => {
          outlineAt(d, c.oklch[0]);
          if (picker) return picker.hover(c, e);
          fillDetails(panel, c);
          panel.classList.add("show");
        };
        const open = () => (picker ? picker.pick(c) : showDetail(c));
        el.addEventListener("pointerenter", show);
        el.addEventListener("focus", show);
        el.addEventListener("pointerleave", hide);
        el.addEventListener("blur", hide);
        el.addEventListener("click", open);
        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
        });
      };
      const segment = (c, d, angle, centre) => {
        const path = svgEl("path", { class: "segment", d, fill: c.css });
        ring(path, c);
        segments.set(c, { path, d, angle, centre });
        target(path, c, d);
        layer.append(path);
        return path;
      };
      // A colour's dot at (x, y), on an unseen target round it, as big as its neighbours leave room for.
      const DOT = 0.018;
      const dot = (c, x, y, reach) => {
        const g = svgEl("g", { class: "dot" });
        const spot = svgEl("circle", { class: "dot-mark", cx: x, cy: y, r: DOT, fill: c.css });
        ring(spot, c);
        g.append(svgEl("circle", { class: "dot-hit", cx: x, cy: y, r: reach }), spot);
        target(g, c, circle(x, y, DOT + 0.006));
        spots.set(c, [x, y]);
        layer.append(g);
      };
      // Dots at their places (`items`: [colour, x, y]), nudged apart until no two overlap: only those that
      // nearly coincide move (on the flat wheel, colours that differ mostly in lightness), by at most about
      // a dot's radius; and, in 2D, kept inside the slice (`keepIn`, which moves a point back in and says
      // whether it did). Where they end up, and how far round each its target reaches: [colour, x, y, reach].
      const placeDots = (items, keepIn) => {
        const p = items.map(([, x, y]) => [x, y]), gap = 2 * DOT + 0.004;
        const inside = () => items.reduce((moved, [c], i) => keepIn(p[i], c) || moved, false);
        for (let round = 0, moved = true; moved && round < 300; round++) {
          moved = !!keepIn && inside();
          for (let i = 0; i < p.length; i++) {
            for (let j = i + 1; j < p.length; j++) {
              let dx = p[j][0] - p[i][0], dy = p[j][1] - p[i][1], d = Math.hypot(dx, dy);
              if (d >= gap * 0.999) continue; // apart enough (pushed to exactly the gap, they would otherwise keep nudging)
              if (d < 1e-9) { dx = Math.cos(j) * 1e-9; dy = Math.sin(j) * 1e-9; d = 1e-9; } // exactly together: apart any way
              const f = (gap - d) / 2 / d;
              p[i][0] -= dx * f; p[i][1] -= dy * f;
              p[j][0] += dx * f; p[j][1] += dy * f;
              moved = true;
            }
          }
        }
        return p.map(([x, y], i) => {
          let near = Infinity;
          p.forEach(([u, v], j) => { if (j !== i) near = Math.min(near, Math.hypot(u - x, v - y)); });
          return [items[i][0], x, y, Math.min(1.8 * DOT, near / 2)];
        });
      };
      const drawDots = (items, keepIn) => { for (const [c, x, y, reach] of placeDots(items, keepIn)) dot(c, x, y, reach); };

      const chromatic = colors.filter((c) => c.oklch[1] >= NEUTRAL_C);
      const greys = colors.filter((c) => c.oklch[1] < NEUTRAL_C);
      const isGrey = (c) => c.oklch[1] < NEUTRAL_C;
      const lo = Math.sqrt(NEUTRAL_C), hi = Math.sqrt(Math.max(...chromatic.map((c) => c.oklch[1])));
      const bandWidth = (RING[1] - RING[0]) / BANDS;
      const sliceOf = (c) => Math.floor(c.oklch[2] / SLICE);
      const band = (c) => Math.min(Math.floor(((Math.sqrt(c.oklch[1]) - lo) / (hi - lo)) * BANDS), BANDS - 1);
      // The greys round the inner ring, lightest first: each one's piece, from and to (degrees); or its dot,
      // in the piece's middle.
      const greyPieces = (list) => {
        list.sort((a, b) => b.oklch[0] - a.oklch[0]);
        const step = 360 / list.length;
        return list.map((c, k) => [c, k * step, (k + 1) * step]);
      };
      const greyDots = (list) => greyPieces(list).map(([c, d0, d1]) => [c, ...polar((GREYS[0] + GREYS[1]) / 2, (d0 + d1) / 2)]);
      // The flat wheel's squares: colours in their cells (slice, and ring b); the greys round the inner ring.
      const drawSquares = (list, greyList) => {
        const cells = new Map();
        for (const c of list) {
          const s = sliceOf(c), b = band(c), key = `${s},${b}`;
          if (!cells.has(key)) cells.set(key, { s, b, list: [] });
          cells.get(key).list.push(c);
        }
        for (const { s, b, list } of cells.values()) {
          list.sort((x, y) => x.oklch[2] - y.oklch[2]);
          const [r0, r1] = flatRing(b), w = SLICE / list.length;
          list.forEach((c, k) => {
            const d0 = s * SLICE + k * w, mid = d0 + w / 2;
            segment(c, arc(r0, r1, d0, d0 + w), mid, pt((r0 + r1) / 2, mid));
          });
        }
        for (const [c, d0, d1] of greyPieces(greyList)) segment(c, arc(GREYS[0], GREYS[1], d0, d1));
      };
      // The flat wheel; its dots at their hue and chroma (√chroma from the inner ring's edge to the rim).
      let marksAs = "squares";
      const flatRing = (b) => [RING[0] + b * bandWidth, RING[0] + b * bandWidth + bandWidth];
      const flatR = (C) => RING[0] + ((Math.sqrt(C) - lo) / (hi - lo)) * (RING[1] - RING[0]);
      const drawFlat = () => {
        if (marksAs === "dots") drawDots([...chromatic.map((c) => [c, ...polar(flatR(c.oklch[1]), c.oklch[2])]), ...greyDots(greys)]);
        else drawSquares(chromatic, greys);
      };

      // Background: the continuous wheel on the same mapping, faded (in 2D, the slice, at full strength),
      // repainted when the size changes or the slice does. With the views, what's been painted is kept
      // (the flat wheel, and the last KEEP slices), so that going back to it, from another view or slice,
      // takes no painting.
      const canvas = wheel.querySelector(".wheel-bg");
      const flat = () => ({ key: `flat ${range}`, paint: () => { delete canvas.dataset.painted; return paintWheel(canvas, RING, lo, hi, G); } });
      let background = flat(), painted = ""; // what the background shows; what it was last painted with, at what size
      const kept = new Map(), KEEP = 12; // pictures by what they show, the last shown last
      const paintBackground = () => {
        const key = `${background.key} ${canvas.clientWidth} ${devicePixelRatio}`;
        if (!canvas.clientWidth || key === painted) return; // hidden (painted once shown), or done
        painted = key;
        const picture = kept.get(key);
        if (picture) { // as it was painted
          kept.delete(key);
          kept.set(key, picture);
          canvas.width = picture.width;
          canvas.height = picture.height;
          wide2d(canvas).ctx.putImageData(picture, 0, 0);
          return;
        }
        const painting = background.paint(); // its pixels (none if there was nothing to paint)
        if (!views || !painting) return;
        kept.set(key, painting);
        for (const k of kept.keys()) if (kept.size > KEEP + 1 && !k.startsWith("flat ")) kept.delete(k); // the oldest slices go; the flat wheel stays
      };
      new ResizeObserver(paintBackground).observe(canvas);

      // A combination's colours: the others faded, its own outlined, joined in hue order.
      const mark = (list) => {
        wheel.classList.toggle("marking", list.length > 0);
        for (const [c, { path }] of segments) path.classList.toggle("marked", list.includes(c));
        marks.setAttribute("d", list.map((c) => segments.get(c).d).join(" "));
        const points = list.map((c) => segments.get(c)).filter((s) => s.centre).sort((a, b) => a.angle - b.angle).map((s) => s.centre);
        if (points.length < 2) shape.removeAttribute("d");
        else shape.setAttribute("d", `M ${points.join(" L ")}${points.length > 2 ? " Z" : ""}`);
      };
      if (!views) {
        drawFlat();
        return { panel, wheel, mark };
      }
      // Its choices, remembered by the page (see below); the range first, as everything's drawn in it.
      const saved = (key) => { try { return localStorage.getItem(P + key); } catch { return null; } };
      const save = (key, value) => { try { localStorage.setItem(P + key, value); } catch {} };
      range = saved("wheel-range") === "print" ? "print" : "screen";
      G = gamut(range);

      // 2D: OKLCH's solid. Out from the axis, √chroma, as on the wheel, out to the rim: 14 of its rings, not
      // 8, so as to reach Rec. 2020's most vivid colours (chroma 0.47, green), far past Wada's (0.22), and

      // Hovering previews a pair of pages without choosing it.
      const pageAt = (e) => {

        const q = new DOMPoint(e.clientX, e.clientY).matrixTransform(dial.getScreenCTM().inverse());
        return wrap(Math.floor(((Math.atan2(-q.y, q.x) * 180) / Math.PI + 360) % 360 / SLICE));
      };

      });

      dial.addEventListener("keydown", (e) => {

      });

            walls: { LEVELS, SLICE, PAGE_Y, AXIS, inner, out, room, steps, lightOf, rowOf, levelOf, isGrey, sliceOf, shareOf, ringOf, midHue, pageEdge, edgeAtL, pageCells, NAMED: G.NAMED, vivid, pageName },
            start: solidFrom,
            onColour: (c) => { under = ""; fillDetails(panel, c); panel.classList.add("show"); },
            onCell: (t) => showOwn(own(cellColour(t)), "Cell colour"),
            onLeave: () => { under = ""; hide(); },
            onOpen: showDetail,
            onOpenCell: (t) => openOwn(own(cellColour(t)), "Cell colour", "in the middle of this cell of the solid"),

        pageShown = page;

        save("wheel-view", v);

      const setRange = (r) => {

        pressed("wheel-range", r);
        save("wheel-range", r);

        hues?.forEach((g) => g.remove()); // the dial's colours
        hues = null;

          solid.canvas.remove();
          solid.labels.forEach((b) => b.remove());

      };

      const setMarks = (m) => {

        pressed("wheel-marks", m);
        save("wheel-marks", m);
        render();
      };
      const setSlicing = (how) => {
        slicing = how;
        shown = level;
        pageShown = page;
        pressed("wheel-slicing", how);
        save("wheel-slicing", how);
        render();
      };
      for (const b of modes.querySelectorAll("[data-wheel-view]")) b.addEventListener("click", () => setView(b.dataset.wheelView));
      for (const b of modes.querySelectorAll("[data-wheel-marks]")) b.addEventListener("click", () => setMarks(b.dataset.wheelMarks));
      const setSurface = (how) => {
        surface = how;
        pressed("wheel-surface", how);
        save("wheel-surface", how);
        render();
      };
      const setEmpty = (how) => {
        hide();
        solid?.unhover();
        empties = how;
        pressed("wheel-empty", how);
        save("wheel-empty", how);
        solid?.empty(how);
      };

        cutFrom = where;
        pressed("wheel-cut", where);
        save("wheel-cut", where);

      for (const b of modes.querySelectorAll("[data-wheel-slicing]")) b.addEventListener("click", () => setSlicing(b.dataset.wheelSlicing));
      for (const b of modes.querySelectorAll("[data-wheel-surface]")) b.addEventListener("click", () => setSurface(b.dataset.wheelSurface));
      for (const b of modes.querySelectorAll("[data-wheel-empty]")) b.addEventListener("click", () => setEmpty(b.dataset.wheelEmpty));
      for (const b of modes.querySelectorAll("[data-wheel-cut]")) b.addEventListener("click", () => setCut(b.dataset.wheelCut, true));

      pressed("wheel-marks", marksAs);
      pressed("wheel-slicing", slicing);
      pressed("wheel-surface", surface);
      pressed("wheel-empty", empties);

    }

    // A small segmented switch (the Ostwald view's and the wheel's): its label (shown on touch screens and
    // phones, where there are no tooltips), then a button per choice ([value, title, icon]), each with
    // data-<key> set to its value.
    function optionSwitch(label, key, list) {
      return `<div class="view-option" data-option="${key}"><span aria-hidden="true">${label}</span><div class="view-switch" role="group" aria-label="${label}">`
